<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos e Suporte - Canal WhatsApp</title>
    
    <!-- Link corrigido para a sua pasta local 'css/' dentro de 'jesus/' -->
    <link rel="stylesheet" href="css/jesus-style.css">
    
    <!-- SDK oficial do Supabase -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- Link para buscar as chaves que estão na sua pasta js/ raiz -->
    <script src="../js/supabase-config.js"></script>
</head>
<body>

<div class="formulario-container">
  <h2>Fale Conosco</h2>
  <p>Deixe seu pedido de oração, testemunho ou dúvida abaixo. Receberemos sua mensagem de forma totalmente privada.</p>

  <form id="formSuporte">
    <label for="nome">Seu Nome:</label>
    <input type="text" id="nome" required placeholder="Como prefere ser chamado?">

    <label for="whatsapp">Seu WhatsApp (com DDD):</label>
    <input type="tel" id="whatsapp" required placeholder="(00) 99999-9999">

    <label for="tipo">Como podemos te ajudar hoje?</label>
    <select id="tipo" required>
      <option value="Pedido de Oração">🙏 Preciso de Oração</option>
      <option value="Testemunho">❤️ Quero contar um Testemunho / Agradecer</option>
      <option value="Suporte Técnico">🛠️ Problema ou Dúvida sobre o Canal</option>
    </select>

    <label for="mensagem">Sua Mensagem / Motivo da Oração:</label>
    <textarea id="mensagem" rows="5" required placeholder="Abra o seu coração aqui..."></textarea>

    <button type="submit" id="btnEnviar">Enviar Mensagem</button>
  </form>
  
  <div id="mensagemSucesso" style="display:none; background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 20px; border: 1px solid #c3e6cb;">
    🙏 Mensagem enviada com sucesso! Deus abençoe a sua vida.
  </div>
</div>

<script>
  document.getElementById('formSuporte').addEventListener('submit', async (e) => {
    e.preventDefault();

    // Captura os valores digitados pelo usuário
    const nomeInput = document.getElementById('nome').value;
    const whatsappInput = document.getElementById('whatsapp').value;
    const tipoInput = document.getElementById('tipo').value;
    const textoMensagem = document.getElementById('mensagem').value;

    // Efeito visual no botão de enviando
    const botao = document.getElementById('btnEnviar');
    botao.innerText = "Enviando... ⏳";
    botao.disabled = true;

    try {
      // Enviamos tanto 'mensagem' quanto 'message' para o banco aceitar de qualquer jeito
      const { data, error } = await supabase
        .from('pedidos_canal')
        .insert([{ 
            nome: nomeInput, 
            whatsapp: whatsappInput, 
            tipo_mensagem: tipoInput, 
            mensagem: textoMensagem,
            message: textoMensagem
        }]);

      if (error) {
        alert('Erro retornado pelo Supabase:\n' + error.message);
        botao.innerText = "Enviar Mensagem";
        botao.disabled = false;
      } else {
        // Sucesso total
        document.getElementById('formSuporte').reset();
        document.getElementById('mensagemSucesso').style.display = 'block';
        botao.innerText = "Enviar Mensagem";
        botao.disabled = false;
        
        // Esconde a mensagem de sucesso após 5 segundos
        setTimeout(() => {
            document.getElementById('mensagemSucesso').style.display = 'none';
        }, 5000);
      }
    } catch (err) {
      alert('Erro de Conexão:\nVerifique se o seu arquivo "js/supabase-config.js" possui as chaves corretas e se as variáveis estão com os nomes SUPABASE_URL e SUPABASE_ANON_KEY.');
      botao.innerText = "Enviar Mensagem";
      botao.disabled = false;
    }
  });
</script>

</body>
</html>
