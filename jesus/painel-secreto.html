<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Mensagens - Canal WhatsApp</title>
    <!-- Usaremos o mesmo arquivo de configuração e SDK que você já tem pronto -->
    <script src="https://jsdelivr.net"></script>
    <script src="../js/supabase-config.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f3f5;
            margin: 0;
            padding: 30px;
        }
        .painel-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #7f8c8d;
            margin-top: 50px;
        }
        .card-mensagem {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
            transition: all 0.3s ease;
        }
        .card-mensagem.lida {
            border-left-color: #2ecc71;
            opacity: 0.65;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .nome-usuario {
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .badge-oracao { background-color: #9b59b6; }
        .badge-testemunho { background-color: #e67e22; }
        .badge-suporte { background-color: #34495e; }
        
        .texto-mensagem {
            color: #34495e;
            font-size: 15px;
            line-height: 1.6;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            white-space: pre-wrap;
        }
        .card-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-check { background-color: #2ecc71; color: white; }
        .btn-check:hover { background-color: #27ae60; }
        .btn-delete { background-color: #e74c3c; color: white; }
        .btn-delete:hover { background-color: #c0392b; }
        .zap-link {
            color: #25d366;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="painel-container">
    <h1>
        <span>📋 Pedidos Recebidos</span>
        <button class="btn" style="background:#3498db; color:white;" onclick="buscarMensagens()">Atualizar 🔄</button>
    </h1>
    
    <div id="listaMensagens">
        <p class="loading">Carregando mensagens do Supabase...</p>
    </div>
</div>

<script>
    // Executa a busca assim que a página abre
    document.addEventListener("DOMContentLoaded", buscarMensagens);

    async function buscarMensagens() {
        const listaDiv = document.getElementById('listaMensagens');
        listaDiv.innerHTML = '<p class="loading">Buscando atualizações...</p>';

        // Busca dados ordenando pelo id decrescente (mais recentes no topo)
        const { data, error } = await supabase
            .from('pedidos_canal')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            listaDiv.innerHTML = `<p class="loading" style="color:red;">Erro ao buscar dados: ${error.message}</p>`;
            return;
        }

        if (data.length === 0) {
            listaDiv.innerHTML = '<p class="loading">Nenhuma mensagem recebida ainda. 🙏</p>';
            return;
        }

        listaDiv.innerHTML = ''; // Limpa o carregando

        data.forEach(item => {
            // Formata o badge por tipo de mensagem
            let badgeClass = 'badge-suporte';
            if (item.tipo_mensagem === 'Pedido de Oração') badgeClass = 'badge-oracao';
            if (item.tipo_mensagem === 'Testemunho') badgeClass = 'badge-testemunho';

            // Limpa o número de whatsapp para gerar o link direto
            const zapLimpo = item.whatsapp.replace(/\D/g, '');
            
            // Cria a estrutura visual do card
            const card = document.createElement('div');
            card.className = `card-mensagem ${item.lida ? 'lida' : ''}`;
            card.id = `card-${item.id}`;

            card.innerHTML = `
                <div class="card-header">
                    <span class="nome-usuario">${item.nome} — <a class="zap-link" href="https://wa.me{zapLimpo}" target="_blank">💬 Chamar no Zap</a></span>
                    <span class="badge ${badgeClass}">${item.tipo_mensagem}</span>
                </div>
                <div class="texto-mensagem">${item.mensagem}</div>
                <div class="card-actions">
                    ${!item.lida ? `<button class="btn btn-check" onclick="marcarComoLida(${item.id})">✔ Marcar como Lida</button>` : '<span>✅ Lida</span>'}
                    <button class="btn btn-delete" onclick="deletarMensagem(${item.id})">🗑 Excluir</button>
                </div>
            `;
            listaDiv.appendChild(card);
        });
    }

    // Função para atualizar o status de "lida" no Supabase
    async function marcarComoLida(id) {
        const { error } = await supabase
            .from('pedidos_canal')
            .update({ lida: true })
            .eq('id', id);

        if (error) {
            alert('Erro ao atualizar status: ' + error.message);
        } else {
            document.getElementById(`card-${id}`).classList.add('lida');
            buscarMensagens(); // Atualiza a tela
        }
    }

    // Função para deletar a mensagem permanentemente
    async function deletarMensagem(id) {
        if (confirm('Tem certeza que deseja excluir permanentemente esta mensagem?')) {
            const { error } = await supabase
                .from('pedidos_canal')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Erro ao deletar: ' + error.message);
            } else {
                document.getElementById(`card-${id}`).remove();
            }
        }
    }
</script>

</body>
</html>
