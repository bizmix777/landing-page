<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Somos</title>
    
    <!-- Favicon -->
    <link rel="icon" href="/images/browser/favicon.ico" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="/somos-todos-um/css/style.css">
    
    <!-- Preload da imagem principal para otimização -->
    <link rel="preload" href="/somos-todos-um/images/capa-livro.jpg" as="image">

    <!-- MercadoPago SDK -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Config (assumido globalmente disponível) -->
    <script src="/somos-todos-um/js/supabase-config.js"></script>

    <style>
        /* Estilos básicos para o corpo e layout */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .checkout-section {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
        }

        .checkout-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            width: 100%;
        }

        .produto-info, .form-pagamento {
            flex: 1;
            min-width: 300px;
        }

        .produto-info {
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .produto-info img {
            max-width: 180px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .produto-info h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
        }

        .produto-info p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 5px;
        }

        .produto-info .preco {
            font-size: 2.2em;
            color: #6a11cb;
            font-weight: bold;
            margin-top: 15px;
        }

        .form-pagamento h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="tel"]:focus,
        .form-group input[type="number"]:focus {
            border-color: #6a11cb;
            outline: none;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
            display: none; /* Hidden by default */
        }

        .payment-methods {
            margin-top: 30px;
            text-align: center;
        }

        .payment-methods button {
            background-color: #6a11cb;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
        }

        .payment-methods button:hover {
            background-color: #2575fc;
            transform: translateY(-2px);
        }

        .payment-methods button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #mercadopago-bricks-container {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
            font-size: 1.5em;
            flex-direction: column;
            gap: 20px;
            display: none; /* Hidden by default */
        }

        .loading-spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #6a11cb;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .checkout-section {
                flex-direction: column;
                padding: 20px;
            }
            .produto-info, .form-pagamento {
                min-width: unset;
                width: 100%;
            }
            .produto-info img {
                max-width: 150px;
            }
            .produto-info h2 {
                font-size: 1.5em;
            }
            .produto-info .preco {
                font-size: 1.8em;
            }
            .form-pagamento h2 {
                font-size: 1.5em;
            }
            .payment-methods button {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Processando seu pagamento...</p>
    </div>

    <section class="checkout-section">
        <div class="checkout-wrapper">
            <div class="produto-info">
                <img id="produtoImagem" src="/somos-todos-um/images/capa-livro.jpg" alt="Capa do livro">
                <h2 id="produtoNome">Carregando...</h2>
                <p id="produtoDescricao">Carregando descrição...</p>
                <p class="preco" id="produtoPreco">R$ 0,00</p>
            </div>

            <div class="form-pagamento">
                <h2>Informações de Pagamento</h2>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                        <div class="error-message" id="nomeError"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" 
                               placeholder="000.000.000-00" 
                               required 
                               maxlength="14"
                               title="CPF deve estar no formato 000.000.000-00">
                        <div class="error-message" id="cpfError"></div>
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" 
                               placeholder="(11) 3333-4444">
                        <div class="error-message" id="telefoneError"></div>
                    </div>

                    <div class="form-group">
                        <label for="whatsapp">WhatsApp *</label>
                        <input type="tel" id="whatsapp" name="whatsapp" 
                               placeholder="(11) 99999-9999" 
                               required
                               minlength="10"
                               pattern="[0-9\s\(\)\-]+"
                               title="WhatsApp deve ter no mínimo 10 dígitos">
                        <div class="error-message" id="whatsappError"></div>
                    </div>

                    <div class="form-group">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" required maxlength="9">
                        <div class="error-message" id="cepError"></div>
                    </div>

                    <div class="form-group">
                        <label for="endereco">Endereço *</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua, Avenida, etc." required>
                        <div class="error-message" id="enderecoError"></div>
                    </div>

                    <div class="form-group">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" name="numero" placeholder="123" required>
                        <div class="error-message" id="numeroError"></div>
                    </div>

                    <div class="form-group">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, Casa">
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Seu bairro" required>
                        <div class="error-message" id="bairroError"></div>
                    </div>

                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
                        <div class="error-message" id="cidadeError"></div>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado *</label>
                        <input type="text" id="estado" name="estado" placeholder="Seu estado (UF)" required maxlength="2">
                        <div class="error-message" id="estadoError"></div>
                    </div>

                    <div class="payment-methods">
                        <button type="button" id="btnPix">Pagar com PIX</button>
                        <div id="mercadopago-bricks-container">
                            <!-- Aqui serão renderizados os Bricks do Mercado Pago -->
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
        // Variáveis globais
        const urlParams = new URLSearchParams(window.location.search);
        const produtoId = urlParams.get('produto');
        let produtoAtual = null;

        // MercadoPago Public Key
        const MP_PUBLIC_KEY = 'APP_USR-e02e5be1-5802-47c6-8ec6-4146afcc61f5';

        // Inicializar MercadoPago SDK
        const mp = new MercadoPago(MP_PUBLIC_KEY, {
            locale: 'pt-BR'
        });
        const bricksBuilder = mp.bricks();

        // Elementos do DOM
        const loadingOverlay = document.getElementById('loadingOverlay');
        const checkoutForm = document.getElementById('checkoutForm');
        const btnPix = document.getElementById('btnPix');

        // --- Funções de Validação e Máscaras ---

        function showError(fieldId, message) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }
        }

        function hideError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            if (errorElement) {
                errorElement.textContent = '';
                errorElement.style.display = 'none';
            }
        }

        function validateField(fieldId, validationFn) {
            const field = document.getElementById(fieldId);
            if (!validationFn(field.value)) {
                showError(fieldId, `Preencha o campo ${field.labels[0].textContent.replace('*', '').trim()} corretamente.`);
                return false;
            }
            hideError(fieldId);
            return true;
        }

        function validateForm() {
            let isValid = true;

            isValid = validateField('nome', value => value.trim() !== '') && isValid;
            isValid = validateField('email', value => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) && isValid;
            isValid = validateField('cpf', value => value.replace(/\D/g, '').length === 11) && isValid;
            
            // WhatsApp é obrigatório
            isValid = validateField('whatsapp', value => value.replace(/\D/g, '').length >= 10) && isValid;

            isValid = validateField('cep', value => value.replace(/\D/g, '').length === 8) && isValid;
            isValid = validateField('endereco', value => value.trim() !== '') && isValid;
            isValid = validateField('numero', value => value.trim() !== '') && isValid;
            isValid = validateField('bairro', value => value.trim() !== '') && isValid;
            isValid = validateField('cidade', value => value.trim() !== '') && isValid;
            isValid = validateField('estado', value => value.trim() !== '' && value.length === 2) && isValid;

            return isValid;
        }

        function applyMasks() {
            // Máscara CPF
            document.getElementById('cpf').addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
                hideError('cpf');
            });

            // Máscara Telefone
            document.getElementById('telefone').addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 0) {
                    value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
                    value = value.replace(/(\d)(\d{4})$/, '$1-$2');
                }
                e.target.value = value;
                hideError('telefone');
            });

            // Máscara WhatsApp
            document.getElementById('whatsapp').addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 0) {
                    value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
                    value = value.replace(/(\d)(\d{4})$/, '$1-$2');
                }
                e.target.value = value;
                hideError('whatsapp');
            });

            // Máscara CEP
            document.getElementById('cep').addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                value = value.replace(/(\d{5})(\d)/, '$1-$2');
                e.target.value = value;
                hideError('cep');
            });
        }

        // --- ViaCEP Auto-fill ---
        document.getElementById('cep').addEventListener('blur', async function() {
            const cep = this.value.replace(/\D/g, '');
            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        document.getElementById('endereco').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('estado').value = data.uf;
                        hideError('cep');
                        hideError('endereco');
                        hideError('bairro');
                        hideError('cidade');
                        hideError('estado');
                        document.getElementById('numero').focus();
                    } else {
                        showError('cep', 'CEP não encontrado.');
                    }
                } catch (error) {
                    console.error('Erro ao buscar CEP:', error);
                    showError('cep', 'Erro ao buscar CEP. Tente novamente.');
                }
            } else if (cep.length > 0) {
                showError('cep', 'CEP inválido. Digite 8 dígitos.');
            }
        });

        // --- Carregar Detalhes do Produto ---
        async function carregarProduto() {
            console.log('✅ Checkout inicializado');
            if (!produtoId) {
                console.error('❌ Produto ID não encontrado na URL.');
                alert('Produto não especificado. Por favor, use um link válido.');
                return;
            }

            try {
                // Mock de dados do produto, pois não há backend especificado para isso
                // Em um cenário real, você buscaria isso do Supabase ou de uma API
                const produtosMock = {
                    '1f19140d-d466-4d14-b64c-c6c2ae9c22df': {
                        id: '1f19140d-d466-4d14-b64c-c6c2ae9c22df',
                        nome: 'Livro: Somos Todos Um',
                        descricao: 'Um guia inspirador para a conexão humana e espiritual.',
                        preco: 29.90,
                        imagem: '/somos-todos-um/images/capa-livro.jpg'
                    }
                    // Adicione outros produtos mock aqui se necessário
                };

                produtoAtual = produtosMock[produtoId];

                if (produtoAtual) {
                    document.getElementById('produtoNome').textContent = produtoAtual.nome;
                    document.getElementById('produtoDescricao').textContent = produtoAtual.descricao;
                    document.getElementById('produtoPreco').textContent = `R$ ${produtoAtual.preco.toFixed(2).replace('.', ',')}`;
                    document.getElementById('produtoImagem').src = produtoAtual.imagem;
                } else {
                    console.error('❌ Produto não encontrado para o ID:', produtoId);
                    alert('Produto não encontrado.');
                }
            } catch (error) {
                console.error('❌ Erro ao carregar produto:', error);
                alert('Erro ao carregar detalhes do produto. Tente novamente.');
            }
        }

        // --- Funções de Pagamento ---

        function showLoading(message = "Processando seu pagamento...") {
            document.querySelector('.loading-overlay p').textContent = message;
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        async function finalizarCompra(metodoPagamento) {
            if (!validateForm()) {
                alert('Por favor, preencha todos os campos obrigatórios corretamente.');
                return;
            }

            showLoading();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value.replace(/\D/g, ''); // Remove máscara
            const telefone = document.getElementById('telefone').value.replace(/\D/g, ''); // Remove máscara
            const whatsapp = document.getElementById('whatsapp').value.replace(/\D/g, ''); // Remove máscara

            try {
                // 1. Registrar venda no Supabase
                const { data: vendaData, error: vendaError } = await supabase
                    .from('vendas')
                    .insert([{
                        produto_id: produtoAtual.id,
                        nome_comprador: nome,
                        email_comprador: email,
                        cpf_comprador: cpf,
                        telefone_comprador: telefone,
                        whatsapp_comprador: whatsapp,
                        quantidade: 1,
                        valor_unitario: produtoAtual.preco,
                        valor_total: produtoAtual.preco,
                        forma_pagamento: metodoPagamento,
                        status_pagamento: 'pending',
                        data_venda: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (vendaError) {
                    console.error('❌ Erro ao registrar venda no Supabase:', vendaError);
                    throw new Error('Erro ao registrar venda.');
                }
                
                const vendaId = vendaData.id;
                console.log('📦 Venda registrada no Supabase com ID:', vendaId);

                // 2. Chamar Edge Function para criar PIX/Cartão
                const edgeFunctionUrl = 'https://YOUR_PROJECT.supabase.co/functions/v1/create-payment'; // Substitua pela URL da sua Edge Function
                const response = await fetch(edgeFunctionUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${supabase.auth.session()?.access_token || ''}` // Se sua Edge Function exige autenticação
                    },
                    body: JSON.stringify({
                        venda_id: vendaId,
                        metodo: metodoPagamento,
                        valor: produtoAtual.preco,
                        email_comprador: email,
                        nome_comprador: nome,
                        cpf_comprador: cpf
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('❌ Erro na Edge Function:', errorData);
                    throw new Error(`Erro ao criar pagamento: ${errorData.message || response.statusText}`);
                }

                const paymentData = await response.json();
                console.log('💰 Dados de pagamento do Mercado Pago:', paymentData);

                // 3. Atualizar venda com payment_id (se aplicável)
                if (paymentData.payment_id) {
                    await supabase
                        .from('vendas')
                        .update({ mercadopago_payment_id: paymentData.payment_id })
                        .eq('id', vendaId);
                }

                // 4. Redirecionar
                window.location.href = `/somos-todos-um/pix.html?payment_id=${paymentData.payment_id}&venda_id=${vendaId}`;
                
            } catch (error) {
                console.error('❌ Erro ao finalizar compra:', error);
                alert(`Erro ao processar pagamento: ${error.message}. Tente novamente.`);
            } finally {
                hideLoading();
            }
        }

        // --- Event Listeners ---
        btnPix.addEventListener('click', () => finalizarCompra('pix'));

        // Renderizar Bricks do Mercado Pago para Cartão de Crédito
        async function renderCardPaymentBrick() {
            try {
                await bricksBuilder.create('cardPayment', 'mercadopago-bricks-container', {
                    initialization: {
                        amount: produtoAtual.preco, // Valor total da compra
                        payer: {
                            email: document.getElementById('email').value,
                        },
                    },
                    customization: {
                        visual: {
                            style: {
                                theme: 'bootstrap', // ou 'dark', 'flat', etc.
                            }
                        },
                        checkout: {
                            buttons: {
                                hide: true // Esconde o botão padrão do Brick, usaremos o nosso
                            }
                        }
                    },
                    callbacks: {
                        onReady: () => {
                            console.log('💳 CardPayment Brick pronto.');
                            // Opcional: mostrar o Brick após carregar
                        },
                        onSubmit: async (cardFormData) => {
                            showLoading("Processando pagamento com cartão...");
                            try {
                                // Aqui você enviaria cardFormData para sua Edge Function para processar o pagamento com cartão
                                // A lógica seria similar à do PIX, mas enviando os dados do cartão
                                console.log('Dados do cartão para processamento:', cardFormData);
                                alert('Pagamento com cartão ainda não implementado para este exemplo. Use PIX.');
                                // Exemplo de como seria a chamada (adaptar para sua Edge Function)
                                /*
                                const response = await fetch('https://YOUR_PROJECT.supabase.co/functions/v1/create-card-payment', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        venda_id: vendaId, // Você precisaria registrar a venda primeiro
                                        card_data: cardFormData,
                                        valor: produtoAtual.preco,
                                        email_comprador: document.getElementById('email').value,
                                        // ... outros dados necessários
                                    })
                                });
                                const paymentData = await response.json();
                                window.location.href = `/somos-todos-um/sucesso.html?payment_id=${paymentData.payment_id}&venda_id=${vendaId}`;
                                */
                            } catch (error) {
                                console.error('Erro ao processar cartão:', error);
                                alert('Erro ao processar pagamento com cartão. Tente novamente.');
                            } finally {
                                hideLoading();
                            }
                        },
                        onError: (error) => {
                            console.error('Erro no CardPayment Brick:', error);
                            alert('Erro ao carregar o formulário de cartão. Tente novamente.');
                        },
                    },
                });
            } catch (error) {
                console.error('Erro ao renderizar CardPayment Brick:', error);
            }
        }


        // --- Inicialização ---
        document.addEventListener('DOMContentLoaded', async () => {
            applyMasks();
            await carregarProduto();
            // Renderizar o Brick de cartão apenas se o produto foi carregado com sucesso
            if (produtoAtual) {
                // renderCardPaymentBrick(); // Descomente para ativar o Brick de cartão
            }
        });
    </script>
</body>
</html>
