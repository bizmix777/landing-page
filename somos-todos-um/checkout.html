<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Livro Digital: Somos Todos Um</title>
    
    <!-- Mercado Pago SDK -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilo do corpo da página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Gradiente roxo */
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinha ao topo para evitar sobreposição em telas pequenas */
        }

        /* Container principal */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 20px auto; /* Margem superior e inferior para espaçamento */
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Cabeçalho do checkout */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* Informações do produto */
        .produto-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .produto-icon {
            font-size: 64px;
        }

        .produto-detalhes h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .produto-preco {
            font-size: 36px;
            color: #667eea;
            font-weight: bold;
        }

        /* Informações do parceiro */
        .parceiro-info {
            padding: 20px 30px;
            background: #f8f9fa;
            border-left: 4px solid #ccc; /* Cor neutra inicial */
            margin: 20px 30px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
        }

        .parceiro-info.erro {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .parceiro-info.sucesso {
            background: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }

        /* Seção do formulário */
        .form-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Botão de finalizar compra */
        .btn-finalizar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn-finalizar:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-finalizar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mensagens de alerta */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .produto-info {
                flex-direction: column;
                text-align: center;
            }
            body {
                padding: 10px;
            }
            .container {
                margin: 10px auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 Livro Digital</h1>
            <p>Somos Todos Um</p>
        </div>

        <div class="produto-info">
            <div class="produto-icon">📚</div>
            <div class="produto-detalhes">
                <h2>Livro Digital: Somos Todos Um</h2>
                <p style="color: #666; margin-bottom: 10px;">Livro digital sobre unidade e espiritualidade</p>
                <div class="produto-preco">R$ 47,00</div>
            </div>
        </div>

        <div id="parceiro-info" class="parceiro-info">
            <div class="loading active">
                <div class="spinner"></div>
                <p>Verificando parceiro...</p>
            </div>
        </div>

        <div class="form-section">
            <div id="alertContainer"></div>

            <form id="checkoutForm">
                <h3 style="margin-bottom: 20px; color: #333;">Dados do Comprador</h3>

                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" required autocomplete="name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required autocomplete="off">
                </div>

                <h3 style="margin: 30px 0 20px 0; color: #333;">Endereço de Entrega</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" required autocomplete="postal-code">
                    </div>
                    <div class="form-group">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" name="numero" required autocomplete="address-line2">
                    </div>
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço *</label>
                    <input type="text" id="endereco" name="endereco" required autocomplete="address-line1">
                </div>

                <div class="form-group">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento" autocomplete="address-line3">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" name="bairro" required autocomplete="address-level4">
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">
                    </div>
                </div>

                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <input type="text" id="estado" name="estado" maxlength="2" placeholder="GO" required autocomplete="address-level1">
                </div>

                <button type="submit" class="btn-finalizar" id="btnFinalizar">
                    Finalizar Compra
                </button>

                <div class="loading" id="loadingPagamento">
                    <div class="spinner"></div>
                    <p>Processando pagamento...</p>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // 
        // CONFIGURAÇÕES - SUBSTITUA AQUI
        // 
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM'; // ⚠️ SUBSTITUA PELA SUA CHAVE ANON DO SUPABASE
        const MERCADOPAGO_PUBLIC_KEY = 'TEST-3c85afff-0b3a-4907-855c-742b90d6cfce'; // ✅ PUBLIC KEY DO MERCADO PAGO (TESTE)
        const PRECO_PRODUTO = 47.00;
        const PRODUTO_ID = '00000000-0000-0000-0000-000000000001';
        
        // ⚠️ IMPORTANTE: Para criar a preferência do Mercado Pago de forma segura,
        // você precisa de um BACKEND para proteger seu ACCESS_TOKEN.
        // Este URL é um placeholder para o seu endpoint de backend.
        const MERCADO_PAGO_BACKEND_URL = 'https://seu-backend.com/api/create-mercadopago-preference'; 
        
        // URL para o webhook do Mercado Pago (para receber notificações de pagamento)
        const MERCADO_PAGO_WEBHOOK_URL = 'https://seu-backend.com/api/mercadopago-webhook';

        // 
        // INICIALIZAÇÃO
        // 
        const supabase = createClient(SUPABASE_URL, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM);
        const mp = new MercadoPago(MERCADOPAGO_PUBLIC_KEY);

        console.log('✅ Supabase e Mercado Pago SDK inicializados');

        // Elementos do DOM
        const parceiroInfo = document.getElementById('parceiro-info');
        const checkoutForm = document.getElementById('checkoutForm');
        const btnFinalizar = document.getElementById('btnFinalizar');
        const loadingPagamento = document.getElementById('loadingPagamento');
        const alertContainer = document.getElementById('alertContainer');

        // Variáveis globais
        let parceiroAtual = null;
        let codigoParceiro = null;

        // 
        // FUNÇÕES AUXILIARES
        // 
        function mostrarAlerta(mensagem, tipo = 'error') {
            alertContainer.innerHTML = `
                <div class="alert alert-${tipo}">
                    ${mensagem}
                </div>
            `;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        function formatarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length > 11) cpf = cpf.substring(0, 11);
            return cpf.replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        }

        function formatarTelefone(telefone) {
            telefone = telefone.replace(/\D/g, '');
            if (telefone.length > 11) telefone = telefone.substring(0, 11);
            return telefone.replace(/(\d{2})(\d)/, '($1) $2')
                .replace(/(\d{5})(\d)/, '$1-$2');
        }

        function formatarCEP(cep) {
            cep = cep.replace(/\D/g, '');
            if (cep.length > 8) cep = cep.substring(0, 8);
            return cep.replace(/(\d{5})(\d)/, '$1-$2');
        }

        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false; // Evita CPFs com todos os dígitos iguais
            let sum = 0, remainder;
            for (let i = 1; i <= 9; i++) sum = sum + parseInt(cpf.substring(i-1, i)) * (11 - i);
            remainder = (sum * 10) % 11;
            if ((remainder == 10) || (remainder == 11)) remainder = 0;
            if (remainder != parseInt(cpf.substring(9, 10))) return false;
            sum = 0;
            for (let i = 1; i <= 10; i++) sum = sum + parseInt(cpf.substring(i-1, i)) * (12 - i);
            remainder = (sum * 10) % 11;
            if ((remainder == 10) || (remainder == 11)) remainder = 0;
            if (remainder != parseInt(cpf.substring(10, 11))) return false;
            return true;
        }

        function validarEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // 
        // BUSCAR PARCEIRO
        // 
        async function buscarParceiro() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                codigoParceiro = urlParams.get('ref');

                console.log('🔍 Código do parceiro na URL:', codigoParceiro);

                if (!codigoParceiro) {
                    parceiroInfo.className = 'parceiro-info'; // Remove classes de erro/sucesso
                    parceiroInfo.innerHTML = `
                        <div>
                            ℹ️ Nenhuma indicação de parceiro para esta compra.
                        </div>
                    `;
                    return;
                }

                const { data: parceiro, error } = await supabase
                    .from('parceiros')
                    .select('id, nome_completo, comissao_padrao, status')
                    .eq('codigo_parceiro', codigoParceiro)
                    .eq('status', 'ativo')
                    .single();

                if (error || !parceiro) {
                    console.error('❌ Erro ao buscar parceiro:', error ? error.message : 'Parceiro não encontrado.');
                    parceiroInfo.className = 'parceiro-info erro';
                    parceiroInfo.innerHTML = `
                        <div>
                            ⚠️ Parceiro não encontrado<br>
                            <small>O código de parceiro informado não é válido ou está inativo.</small>
                        </div>
                    `;
                    return;
                }

                console.log('✅ Parceiro encontrado:', parceiro);
                parceiroAtual = parceiro;

                parceiroInfo.className = 'parceiro-info sucesso';
                parceiroInfo.innerHTML = `
                    <div>
                        ✅ Você está comprando através da indicação de <strong>${parceiro.nome_completo}</strong><br>
                        <small>Este parceiro receberá ${parceiro.comissao_padrao || 30}% de comissão pela sua compra.</small>
                    </div>
                `;

            } catch (error) {
                console.error('❌ Erro inesperado ao buscar parceiro:', error);
                parceiroInfo.className = 'parceiro-info erro';
                parceiroInfo.innerHTML = `
                    <div>
                        ❌ Erro ao verificar parceiro<br>
                        <small>${error.message}</small>
                    </div>
                `;
            } finally {
                // Remove o spinner de carregamento
                const loadingSpinner = parceiroInfo.querySelector('.loading');
                if (loadingSpinner) loadingSpinner.remove();
            }
        }

        // 
        // MÁSCARAS DE ENTRADA
        // 
        document.getElementById('cpf').addEventListener('input', (e) => {
            e.target.value = formatarCPF(e.target.value);
        });

        document.getElementById('telefone').addEventListener('input', (e) => {
            e.target.value = formatarTelefone(e.target.value);
        });

        document.getElementById('cep').addEventListener('input', (e) => {
            e.target.value = formatarCEP(e.target.value);
        });

        // 
        // BUSCAR CEP (ViaCEP)
        // 
        document.getElementById('cep').addEventListener('blur', async (e) => {
            const cep = e.target.value.replace(/\D/g, '');
            
            if (cep.length === 8) {
                try {
                    console.log('🌍 Buscando CEP:', cep);
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    
                    if (!data.erro) {
                        document.getElementById('endereco').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('estado').value = data.uf;
                        document.getElementById('numero').focus();
                        console.log('✅ CEP encontrado e campos preenchidos.');
                    } else {
                        mostrarAlerta('CEP não encontrado.', 'error');
                        console.warn('⚠️ CEP não encontrado:', cep);
                    }
                } catch (error) {
                    console.error('❌ Erro ao buscar CEP:', error);
                    mostrarAlerta('Erro ao buscar CEP. Verifique sua conexão.', 'error');
                }
            }
        });

        // 
        // PROCESSAR CHECKOUT
        // 
        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validações
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.replace(/\D/g, '');
            const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const endereco = document.getElementById('endereco').value.trim();
            const numero = document.getElementById('numero').value.trim();
            const bairro = document.getElementById('bairro').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
            const estado = document.getElementById('estado').value.trim();

                mostrarAlerta('Por favor, preencha todos os campos obrigatórios.', 'error');
                return;
            }

            if (!validarCPF(cpf)) {
                mostrarAlerta('CPF inválido. Por favor, verifique.', 'error');
                return;
            }

            if (!validarEmail(email)) {
                mostrarAlerta('Email inválido. Por favor, verifique.', 'error');
                return;
            }

            // Desabilitar botão e mostrar loading
            btnFinalizar.disabled = true;
            loadingPagamento.classList.add('active');

            try {
                // Coletar dados do formulário
                const comissaoPercentual = parceiroAtual ? (parceiroAtual.comissao_padrao || 30) : 0;
                const comissaoValor = parceiroAtual ? (PRECO_PRODUTO * comissaoPercentual / 100) : 0;

                const dadosVenda = {
                    nome_comprador: nome,
                    email_comprador: email,
                    telefone_comprador: telefone,
                    cpf_comprador: cpf,
                    cep_comprador: cep,
                    endereco_comprador: endereco,
                    numero_comprador: numero,
                    complemento_comprador: document.getElementById('complemento').value.trim(),
                    bairro_comprador: bairro,
                    cidade_comprador: cidade,
                    estado_comprador: estado,
                    valor_total: PRECO_PRODUTO,
                    produto_id: PRODUTO_ID,
                    parceiro_id: parceiroAtual ? parceiroAtual.id : null,
                    comissao_percentual: comissaoPercentual,
                    comissao_valor: comissaoValor,
                    status_pagamento: 'pendente', // Status inicial
                    created_at: new Date().toISOString()
                };

                console.log('📊 Dados da venda a ser registrada:', dadosVenda);

                // Registrar venda no Supabase
                const { data: vendaRegistrada, error: erroVenda } = await supabase
                    .from('vendas')
                    .insert([dadosVenda])
                    .select('id') // Seleciona apenas o ID da venda registrada
                    .single();

                if (erroVenda) {
                    console.error('❌ Erro ao registrar venda no Supabase:', erroVenda);
                    throw new Error('Falha ao registrar sua compra. Tente novamente.');
                }

                console.log('✅ Venda registrada no Supabase com ID:', vendaRegistrada.id);

                // 
                // INTEGRAÇÃO COM MERCADO PAGO - CRIAÇÃO DA PREFERÊNCIA
                // ⚠️ ESTA PARTE DEVE SER FEITA EM UM BACKEND PARA PROTEGER SEU ACCESS_TOKEN
                // 
                console.log('💳 Iniciando criação da preferência de pagamento no Mercado Pago...');

                const preferencePayload = {
                    items: [
                        {
                            id: PRODUTO_ID,
                            title: 'Livro Digital: Somos Todos Um',
                            description: 'Livro digital sobre unidade e espiritualidade',
                            quantity: 1,
                            currency_id: 'BRL',
                            unit_price: PRECO_PRODUTO
                        }
                    ],
                    payer: {
                        name: dadosVenda.nome_comprador,
                        email: dadosVenda.email_comprador,
                        identification: {
                            type: 'CPF',
                            number: dadosVenda.cpf_comprador
                        },
                        phone: {
                            area_code: dadosVenda.telefone_comprador.substring(0, 2),
                            number: dadosVenda.telefone_comprador.substring(2)
                        },
                        address: {
                            zip_code: dadosVenda.cep_comprador,
                            street_name: dadosVenda.endereco_comprador,
                            street_number: parseInt(dadosVenda.numero_comprador) || 0,
                            neighborhood: dadosVenda.bairro_comprador,
                            city: dadosVenda.cidade_comprador,
                            federal_unit: dadosVenda.estado_comprador
                        }
                    },
                    back_urls: {
                        success: `https://bizmix.com.br/somos-todos-um/parceiros/pagamento-sucesso.html?venda_id=${vendaRegistrada.id}`,
                        failure: `https://bizmix.com.br/somos-todos-um/parceiros/pagamento-erro.html?venda_id=${vendaRegistrada.id}`,
                        pending: `https://bizmix.com.br/somos-todos-um/parceiros/pagamento-pendente.html?venda_id=${vendaRegistrada.id}`
                    },
                    auto_return: 'approved',
                    external_reference: vendaRegistrada.id, // ID da venda para rastreamento
                    statement_descriptor: 'LIVRO SOMOS TODOS UM',
                    notification_url: MERCADO_PAGO_WEBHOOK_URL // Seu endpoint de webhook
                };

                // Chamada ao seu backend para criar a preferência
                const response = await fetch(MERCADO_PAGO_BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(preferencePayload),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('❌ Erro do backend ao criar preferência MP:', errorData);
                    throw new Error(errorData.message || 'Falha ao criar preferência de pagamento.');
                }

                const preferenceResult = await response.json();
                console.log('✅ Preferência Mercado Pago criada:', preferenceResult);

                // Redirecionar para o fluxo de pagamento do Mercado Pago
                window.location.href = preferenceResult.init_point;

            } catch (error) {
                console.error('❌ Erro no processo de checkout:', error);
                mostrarAlerta('Erro ao finalizar compra: ' + error.message, 'error');
                btnFinalizar.disabled = false;
                loadingPagamento.classList.remove('active');
            }
        });

        // 
        // INICIALIZAR
        // 
        buscarParceiro();
    </script>
</body>
</html>
