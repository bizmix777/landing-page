<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Somos</title>

    <!-- CRITICAL: Link para o CSS principal -->
    <link rel="stylesheet" href="/somos-todos-um/css/style.css">
    <!-- Preload da imagem principal do produto para carregamento rápido -->
    <link rel="preload" href="/images/capa-livro.png" as="image">

    <!-- CRITICAL: Inclui as configurações do Supabase (URL e KEY) -->
    <!-- Este script deve inicializar a variável global 'supabase' -->
    <script src="/js/supabase-config.js"></script>

    <!-- Script do MercadoPago SDK -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <!-- Script do Supabase JS SDK (para usar window.supabase.createClient se necessário, mas supabase-config.js já deve fazer isso) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Estilos básicos para o corpo e gradiente de fundo */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); /* Gradiente moderno */
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .checkout-section {
            padding: 40px 20px;
            flex-grow: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .checkout-wrapper {
            display: flex;
            flex-wrap: wrap;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .product-info {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-right: 1px solid #eee;
        }

        .product-info img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .product-info h2 {
            font-size: 2.2em;
            color: #2c3e50;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .product-info p {
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .product-price {
            font-size: 2.8em;
            font-weight: bold;
            color: #27ae60; /* Verde vibrante */
            margin-bottom: 30px;
        }

        .security-badges {
            margin-top: auto; /* Empurra para o final */
            padding-top: 20px;
            border-top: 1px solid #eee;
            width: 100%;
        }

        .security-badges p {
            font-size: 0.9em;
            color: #777;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .security-badges p::before {
            content: '🔒'; /* Ícone de cadeado */
            margin-right: 8px;
            font-size: 1.1em;
        }

        .checkout-form-container {
            flex: 2;
            min-width: 400px;
            padding: 40px;
        }

        .checkout-form-container h2 {
            font-size: 2em;
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"] {
            width: calc(100% - 20px);
            padding: 12px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="tel"]:focus,
        .form-group input[type="number"]:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
            display: none; /* Escondido por padrão */
        }

        .payment-methods {
            margin-top: 30px;
            text-align: center;
        }

        .payment-methods button {
            display: block;
            width: 100%;
            padding: 15px 25px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .payment-methods button.btn-pix {
            background-color: #2ecc71; /* Verde PIX */
            color: #fff;
        }

        .payment-methods button.btn-pix:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        .payment-methods button.btn-card {
            background-color: #3498db; /* Azul Cartão */
            color: #fff;
        }

        .payment-methods button.btn-card:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s linear;
        }

        .loading-overlay.visible {
            visibility: visible;
            opacity: 1;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-size: 0.9em;
            margin-top: auto; /* Empurra o footer para o final */
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .checkout-wrapper {
                flex-direction: column;
            }

            .product-info, .checkout-form-container {
                border-right: none;
                border-bottom: 1px solid #eee;
                padding: 30px 20px;
            }

            .product-info {
                order: 1; /* Coloca info do produto antes do formulário no mobile */
            }

            .checkout-form-container {
                order: 2;
            }

            .product-info h2 {
                font-size: 1.8em;
            }

            .product-price {
                font-size: 2.2em;
            }

            .checkout-form-container h2 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <!-- Overlay de carregamento -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <section class="checkout-section">
        <div class="container">
            <div class="checkout-wrapper">
                <!-- Seção de Informações do Produto -->
                <div class="product-info">
                    <img src="/images/capa-livro.png" alt="Capa do livro" id="productImage">
                    <h2 id="productTitle">Carregando Produto...</h2>
                    <p id="productDescription">Aguarde enquanto carregamos os detalhes do produto.</p>
                    <div class="product-price" id="productPrice">R$ 0,00</div>
                    <div class="security-badges">
                        <p>Compra 100% segura</p>
                        <p>Seus dados protegidos</p>
                        <p>Pagamento criptografado</p>
                    </div>
                </div>

                <!-- Seção do Formulário de Checkout -->
                <div class="checkout-form-container">
                    <h2>Finalizar Compra</h2>
                    <form id="checkoutForm">
                        <!-- Informações Pessoais -->
                        <h3>Dados Pessoais</h3>
                        <div class="form-group">
                            <label for="nome">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                            <div class="error-message" id="nomeError"></div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
                            <div class="error-message" id="emailError"></div>
                        </div>
                        <div class="form-group">
                            <label for="cpf">CPF *</label>
                            <input type="text" id="cpf" name="cpf" 
                                   placeholder="000.000.000-00" 
                                   required 
                                   maxlength="14"
                                   pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                                   title="CPF deve estar no formato 000.000.000-00">
                            <div class="error-message" id="cpfError"></div>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" 
                                   placeholder="(11) 3333-4444">
                            <div class="error-message" id="telefoneError"></div>
                        </div>
                        <div class="form-group">
                            <label for="whatsapp">WhatsApp *</label>
                            <input type="tel" id="whatsapp" name="whatsapp" 
                                   placeholder="(11) 99999-9999" 
                                   required
                                   minlength="10"
                                   pattern="[0-9\s\(\)\-]+"
                                   title="WhatsApp deve ter no mínimo 10 dígitos">
                            <div class="error-message" id="whatsappError"></div>
                        </div>

                        <!-- Informações de Endereço -->
                        <h3>Endereço de Entrega</h3>
                        <div class="form-group">
                            <label for="cep">CEP *</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000" required maxlength="9">
                            <div class="error-message" id="cepError"></div>
                        </div>
                        <div class="form-group">
                            <label for="endereco">Endereço *</label>
                            <input type="text" id="endereco" name="endereco" placeholder="Rua, Avenida, etc." required>
                            <div class="error-message" id="enderecoError"></div>
                        </div>
                        <div class="form-group">
                            <label for="numero">Número *</label>
                            <input type="text" id="numero" name="numero" placeholder="123" required>
                            <div class="error-message" id="numeroError"></div>
                        </div>
                        <div class="form-group">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, Casa">
                        </div>
                        <div class="form-group">
                            <label for="bairro">Bairro *</label>
                            <input type="text" id="bairro" name="bairro" placeholder="Seu bairro" required>
                            <div class="error-message" id="bairroError"></div>
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade *</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
                            <div class="error-message" id="cidadeError"></div>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado *</label>
                            <input type="text" id="estado" name="estado" placeholder="Seu estado" required maxlength="2">
                            <div class="error-message" id="estadoError"></div>
                        </div>

                        <!-- Métodos de Pagamento -->
                        <div class="payment-methods">
                            <h3>Método de Pagamento</h3>
                            <button type="button" class="btn-pix" id="btnPix">Pagar com PIX</button>
                            <button type="button" class="btn-card" id="btnCard">Pagar com Cartão</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Somos. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Variáveis globais e configurações iniciais
        const urlParams = new URLSearchParams(window.location.search);
        const produtoId = urlParams.get('produto');
        
        // A variável 'supabase' é esperada ser inicializada por /js/supabase-config.js
        // Ex: const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        // Se supabase-config.js não exportar globalmente, pode ser necessário:
        // const supabase = window.supabaseClient; // ou o nome da variável global que ele cria

        // Chave pública do MercadoPago
        const MP_PUBLIC_KEY = 'APP_USR-e02e5be1-5802-47c6-8ec6-4146afcc61f5';
        
        let produtoAtual = null; // Armazenará os dados do produto carregado
        
        // Inicializar MercadoPago SDK
        const mp = new MercadoPago(MP_PUBLIC_KEY, {
            locale: 'pt-BR'
        });
        const bricksBuilder = mp.bricks(); // Para futuras integrações de cartão, se necessário

        // Elementos do DOM
        const loadingOverlay = document.getElementById('loadingOverlay');
        const productTitleElem = document.getElementById('productTitle');
        const productDescriptionElem = document.getElementById('productDescription');
        const productPriceElem = document.getElementById('productPrice');
        const productImageElem = document.getElementById('productImage');

        // Função para mostrar/esconder o overlay de carregamento
        function toggleLoading(show) {
            if (show) {
                loadingOverlay.classList.add('visible');
            } else {
                loadingOverlay.classList.remove('visible');
            }
        }

        // Função para carregar os detalhes do produto do Supabase
        async function carregarProduto() {
            toggleLoading(true);
            try {
                if (!produtoId) {
                    throw new Error('ID do produto não encontrado na URL.');
                }

                const { data, error } = await supabase
                    .from('produtos')
                    .select('*')
                    .eq('id', produtoId)
                    .single();

                if (error) {
                    throw error;
                }

                if (data) {
                    produtoAtual = data;
                    productTitleElem.textContent = produtoAtual.nome;
                    productDescriptionElem.textContent = produtoAtual.descricao;
                    productPriceElem.textContent = `R$ ${produtoAtual.preco.toFixed(2).replace('.', ',')}`;
                    if (produtoAtual.imagem_url) {
                        productImageElem.src = produtoAtual.imagem_url;
                    } else {
                        productImageElem.src = '/images/capa-livro.png'; // Fallback
                    }
                    console.log('✅ Produto carregado:', produtoAtual);
                } else {
                    productTitleElem.textContent = 'Produto não encontrado';
                    productDescriptionElem.textContent = 'Verifique o ID do produto na URL.';
                    productPriceElem.textContent = 'R$ 0,00';
                    console.warn('Produto não encontrado para o ID:', produtoId);
                }
            } catch (error) {
                console.error('❌ Erro ao carregar produto:', error);
                productTitleElem.textContent = 'Erro ao carregar produto';
                productDescriptionElem.textContent = 'Não foi possível carregar os detalhes do produto. Tente novamente mais tarde.';
                productPriceElem.textContent = 'R$ 0,00';
                alert('Erro ao carregar produto: ' + error.message);
            } finally {
                toggleLoading(false);
            }
        }

        // --- Funções de Máscara de Input ---
        function applyCpfMask(value) {
            value = value.replace(/\D/g, '');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            return value;
        }

        function applyPhoneMask(value) {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
            value = value.replace(/(\d)(\d{4})$/, '$1-$2');
            return value;
        }

        function applyWhatsappMask(value) {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
            value = value.replace(/(\d)(\d{4})$/, '$1-$2'); // Para 9 dígitos
            return value;
        }

        function applyCepMask(value) {
            value = value.replace(/\D/g, '');
            value = value.replace(/(\d{5})(\d)/, '$1-$2');
            return value;
        }

        // --- Validação de Formulário ---
        function validarFormulario() {
            let isValid = true;
            const form = document.getElementById('checkoutForm');
            const inputs = form.querySelectorAll('input[required]');

            // Limpa mensagens de erro anteriores
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            inputs.forEach(input => {
                if (!input.value.trim()) {
                    document.getElementById(input.id + 'Error').textContent = 'Este campo é obrigatório.';
                    document.getElementById(input.id + 'Error').style.display = 'block';
                    isValid = false;
                }
            });

            // Validação de Email
            const emailInput = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                document.getElementById('emailError').textContent = 'Email inválido.';
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }

            // Validação de CPF
            const cpfInput = document.getElementById('cpf');
            const cpfValue = cpfInput.value.replace(/\D/g, '');
            if (cpfValue.length !== 11) {
                document.getElementById('cpfError').textContent = 'CPF deve ter 11 dígitos.';
                document.getElementById('cpfError').style.display = 'block';
                isValid = false;
            }

            // Validação de WhatsApp (minlength já é do HTML, mas podemos reforçar)
            const whatsappInput = document.getElementById('whatsapp');
            const whatsappValue = whatsappInput.value.replace(/\D/g, '');
            if (whatsappInput.required && whatsappValue.length < 10) {
                document.getElementById('whatsappError').textContent = 'WhatsApp deve ter no mínimo 10 dígitos.';
                document.getElementById('whatsappError').style.display = 'block';
                isValid = false;
            }

            return isValid;
        }

        // --- Processamento de Pagamento ---
        async function finalizarCompra(metodoPagamento) {
            if (!validarFormulario()) {
                alert('Por favor, preencha todos os campos obrigatórios corretamente.');
                return;
            }

            if (!produtoAtual) {
                alert('Erro: Dados do produto não carregados.');
                return;
            }

            toggleLoading(true);

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
            const telefone = document.getElementById('telefone').value.replace(/\D/g, '');
            const whatsapp = document.getElementById('whatsapp').value.replace(/\D/g, '');

            try {
                // 1. Registrar venda no Supabase (simplificado para vendas diretas)
                const { data: vendaData, error: vendaError } = await supabase
                    .from('vendas')
                    .insert([{
                        produto_id: produtoId,
                        nome_comprador: nome,
                        email_comprador: email,
                        cpf_comprador: cpf,
                        telefone_comprador: telefone,
                        whatsapp_comprador: whatsapp,
                        quantidade: 1,
                        valor_unitario: produtoAtual.preco,
                        valor_total: produtoAtual.preco,
                        forma_pagamento: metodoPagamento,
                        status_pagamento: 'pending',
                        data_venda: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (vendaError) {
                    throw vendaError;
                }
                
                const vendaId = vendaData.id;
                console.log('✅ Venda registrada no Supabase com ID:', vendaId);

                // 2. Chamar Edge Function para criar pagamento (MercadoPago)
                // Substitua 'YOUR_PROJECT' pela sua URL do Supabase Project
                const edgeFunctionUrl = 'https://YOUR_PROJECT.supabase.co/functions/v1/create-payment'; 
                
                const response = await fetch(edgeFunctionUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${supabase.auth.session()?.access_token || ''}` // Se a Edge Function exigir auth
                    },
                    body: JSON.stringify({
                        venda_id: vendaId,
                        metodo: metodoPagamento,
                        valor: produtoAtual.preco, // Passa o valor para a Edge Function
                        email_comprador: email,
                        cpf_comprador: cpf
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Erro na Edge Function: ${errorData.message || response.statusText}`);
                }

                const paymentData = await response.json();
                console.log('✅ Pagamento criado via Edge Function:', paymentData);

                // 3. Atualizar venda com o ID de pagamento do MercadoPago
                await supabase
                    .from('vendas')
                    .update({ mercadopago_payment_id: paymentData.payment_id })
                    .eq('id', vendaId);
                
                console.log('✅ Venda atualizada com payment_id:', paymentData.payment_id);

                // 4. Redirecionar para a página de PIX/Sucesso
                window.location.href = `/pix.html?payment_id=${paymentData.payment_id}&venda_id=${vendaId}`;
                
            } catch (error) {
                console.error('❌ Erro ao finalizar compra:', error);
                alert('Erro ao processar pagamento. Por favor, tente novamente. Detalhes: ' + error.message);
            } finally {
                toggleLoading(false);
            }
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            carregarProduto();

            // Máscaras
            document.getElementById('cpf').addEventListener('input', (e) => {
                e.target.value = applyCpfMask(e.target.value);
            });
            document.getElementById('telefone').addEventListener('input', (e) => {
                e.target.value = applyPhoneMask(e.target.value);
            });
            document.getElementById('whatsapp').addEventListener('input', (e) => {
                e.target.value = applyWhatsappMask(e.target.value);
            });
            document.getElementById('cep').addEventListener('input', (e) => {
                e.target.value = applyCepMask(e.target.value);
            });

            // ViaCEP Auto-fill
            document.getElementById('cep').addEventListener('blur', async function() {
                const cep = this.value.replace(/\D/g, '');
                if (cep.length === 8) {
                    toggleLoading(true);
                    try {
                        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                        const data = await response.json();
                        
                        if (!data.erro) {
                            document.getElementById('endereco').value = data.logradouro;
                            document.getElementById('bairro').value = data.bairro;
                            document.getElementById('cidade').value = data.localidade;
                            document.getElementById('estado').value = data.uf;
                            document.getElementById('numero').focus(); // Foca no número após preencher
                        } else {
                            alert('CEP não encontrado.');
                        }
                    } catch (error) {
                        console.error('Erro ao buscar CEP:', error);
                        alert('Erro ao buscar CEP. Verifique o número e tente novamente.');
                    } finally {
                        toggleLoading(false);
                    }
                }
            });

            // Botões de Pagamento
            document.getElementById('btnPix').addEventListener('click', () => finalizarCompra('pix'));
            document.getElementById('btnCard').addEventListener('click', () => finalizarCompra('cartao')); // Implementar lógica de cartão se necessário
        });
    </script>
</body>
</html>
