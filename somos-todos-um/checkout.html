<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Livro Digital: Somos Todos Um</title>
    <link rel="icon" href="https://bizmix.com.br/favicon.ico" type="image/x-icon">
    <style>
        /* Reset e Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinha ao topo para melhor visualização em telas pequenas */
            padding: 20px;
            color: #333;
        }

        /* Container Principal */
        .checkout-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap; /* Permite que as colunas quebrem em telas menores */
            overflow: hidden;
        }

        /* Coluna do Produto */
        .product-summary {
            flex: 1;
            min-width: 300px; /* Garante largura mínima */
            padding: 30px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-summary h2 {
            font-size: 24px;
            color: #444;
            margin-bottom: 20px;
        }

        .product-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .product-item .icon {
            font-size: 48px;
            line-height: 1;
        }

        .product-details h3 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #333;
        }

        .product-details p {
            font-size: 14px;
            color: #666;
        }

        .price-info {
            text-align: right;
            margin-top: auto; /* Empurra para o final da coluna */
        }

        .price-info .label {
            font-size: 14px;
            color: #666;
        }

        .price-info .value {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
        }

        /* Coluna do Formulário */
        .checkout-form-section {
            flex: 2;
            min-width: 400px; /* Garante largura mínima */
            padding: 30px;
            background: white;
        }

        .checkout-form-section h2 {
            font-size: 24px;
            color: #444;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0; /* Remove margin-bottom para não duplicar */
        }

        /* Alertas */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert-info {
            background-color: #e0f2f7;
            color: #0288d1;
            border: 1px solid #b3e5fc;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .alert-warning {
            background-color: #fff3e0;
            color: #ef6c00;
            border: 1px solid #ffe0b2;
        }

        .alert-danger {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        /* Botão de Pagamento */
        .btn-pay {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #28a745 0%, #218838 100%); /* Verde para pagamento */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .btn-pay:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        .btn-pay.loading .loading-spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .checkout-container {
                flex-direction: column;
            }
            .product-summary, .checkout-form-section {
                min-width: unset;
                width: 100%;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <!-- Coluna de Resumo do Produto -->
        <div class="product-summary">
            <div>
                <h2>Seu Pedido</h2>
                <div class="product-item">
                    <span class="icon">📖</span>
                    <div class="product-details">
                        <h3>Livro Digital: Somos Todos Um</h3>
                        <p>Acesso imediato após a confirmação do pagamento.</p>
                    </div>
                </div>
                <div id="parceiro-info" class="alert alert-info" style="display: none;">
                    <!-- Informações do parceiro serão inseridas aqui -->
                </div>
            </div>
            <div class="price-info">
                <p class="label">Valor Total</p>
                <p class="value" id="product-price">R$ 97,00</p>
            </div>
        </div>

        <!-- Coluna do Formulário de Checkout -->
        <div class="checkout-form-section">
            <h2>Dados do Comprador</h2>
            <div id="alert-message-container"></div>

            <form id="checkout-form">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required maxlength="14">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" required maxlength="15">
                    </div>
                </div>

                <div class="form-group">
                    <label for="cep">CEP (Opcional)</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9">
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Rua, Avenida, etc." readonly>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" placeholder="123" readonly>
                    </div>
                    <div class="form-group">
                        <label for="complemento">Complemento (Opcional)</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, Casa" readonly>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Seu bairro" readonly>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="estado" placeholder="Seu estado" readonly>
                </div>

                <button type="submit" class="btn-pay" id="btn-pay">
                    <span class="loading-spinner"></span>
                    Finalizar Compra - Pagar com Mercado Pago
                </button>
            </form>
        </div>
    </div>

    <!-- Supabase Client -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // --- CONFIGURAÇÕES CRÍTICAS ---
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = '[INSERT_SUPABASE_ANON_KEY_HERE]'; // ⚠️ SUBSTITUA PELA SUA CHAVE ANON REAL DO SUPABASE

        const PRODUCT_ID = '00000000-0000-0000-0000-000000000001';
        const PRODUCT_NAME = 'Livro Digital: Somos Todos Um';
        const PRODUCT_PRICE = 97.00; // R$ 97,00

        // URL para criar preferência de pagamento no Mercado Pago (ESTE É UM ENDPOINT DE BACKEND QUE VOCÊ PRECISA IMPLEMENTAR)
        // Exemplo: https://seu-backend.com/api/create-mercadopago-preference
        const MERCADO_PAGO_PREFERENCE_URL = 'https://seu-backend.com/api/create-mercadopago-preference'; // ⚠️ SUBSTITUA PELA SUA URL DE BACKEND

        // --- INICIALIZAÇÃO SUPABASE ---
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase Client inicializado.');

        // --- ELEMENTOS DO DOM ---
        const checkoutForm = document.getElementById('checkout-form');
        const parceiroInfoDiv = document.getElementById('parceiro-info');
        const alertMessageContainer = document.getElementById('alert-message-container');
        const btnPay = document.getElementById('btn-pay');

        const inputNome = document.getElementById('nome');
        const inputEmail = document.getElementById('email');
        const inputCpf = document.getElementById('cpf');
        const inputTelefone = document.getElementById('telefone');
        const inputCep = document.getElementById('cep');
        const inputEndereco = document.getElementById('endereco');
        const inputNumero = document.getElementById('numero');
        const inputComplemento = document.getElementById('complemento');
        const inputBairro = document.getElementById('bairro');
        const inputCidade = document.getElementById('cidade');
        const inputEstado = document.getElementById('estado');

        // --- VARIÁVEIS GLOBAIS ---
        let parceiroReferral = null; // Objeto do parceiro se encontrado
        let codigoParceiro = null;   // Código do parceiro da URL

        // --- FUNÇÕES DE UTILIDADE ---

        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        }

        function mostrarAlerta(mensagem, tipo = 'danger') {
            alertMessageContainer.innerHTML = `
                <div class="alert alert-${tipo}">
                    ${mensagem}
                </div>
            `;
            setTimeout(() => {
                alertMessageContainer.innerHTML = '';
            }, 8000); // Alerta some após 8 segundos
        }

        function formatarCpf(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length > 11) cpf = cpf.substring(0, 11);
            return cpf.replace(/(\d{3})(\d)/, '$1.$2')
                      .replace(/(\d{3})(\d)/, '$1.$2')
                      .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        }

        function formatarTelefone(telefone) {
            telefone = telefone.replace(/\D/g, '');
            if (telefone.length > 11) telefone = telefone.substring(0, 11);
            return telefone.replace(/^(\d{2})(\d)/g, '($1) $2')
                           .replace(/(\d)(\d{4})$/, '$1-$2');
        }

        function formatarCep(cep) {
            cep = cep.replace(/\D/g, '');
            if (cep.length > 8) cep = cep.substring(0, 8);
            return cep.replace(/^(\d{5})(\d)/, '$1-$2');
        }

        function validarEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        function validarCpf(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf == '') return false;
            if (cpf.length != 11 ||
                cpf == "00000000000" ||
                cpf == "11111111111" ||
                cpf == "22222222222" ||
                cpf == "33333333333" ||
                cpf == "44444444444" ||
                cpf == "55555555555" ||
                cpf == "66666666666" ||
                cpf == "77777777777" ||
                cpf == "88888888888" ||
                cpf == "99999999999")
                return false;
            let add = 0;
            for (let i = 0; i < 9; i++)
                add += parseInt(cpf.charAt(i)) * (10 - i);
            let rev = 11 - (add % 11);
            if (rev == 10 || rev == 11)
                rev = 0;
            if (rev != parseInt(cpf.charAt(9)))
                return false;
            add = 0;
            for (let i = 0; i < 10; i++)
                add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11);
            if (rev == 10 || rev == 11)
                rev = 0;
            if (rev != parseInt(cpf.charAt(10)))
                return false;
            return true;
        }

        // --- LÓGICA DE PARCEIRO ---

        async function buscarParceiro(codigo) {
            console.log(`🔍 Buscando parceiro com código: ${codigo}`);
            try {
                const { data, error } = await supabase
                    .from('parceiros')
                    .select('id, nome_completo, comissao_percentual, status')
                    .eq('codigo_parceiro', codigo)
                    .eq('status', 'ativo')
                    .single();

                if (error || !data) {
                    console.error('❌ Erro ou parceiro não encontrado/ativo:', error?.message || 'Parceiro não encontrado.');
                    return null;
                }
                console.log('✅ Parceiro encontrado:', data);
                return data;
            } catch (e) {
                console.error('❌ Exceção ao buscar parceiro:', e.message);
                return null;
            }
        }

        function exibirInfoParceiro(parceiro) {
            const comissao = parceiro.comissao_percentual || 30; // Padrão 30%
            parceiroInfoDiv.innerHTML = `
                <p>🎉 Você está comprando através da indicação de <strong>${parceiro.nome_completo}</strong>!</p>
                <p>Ao finalizar a compra, ${parceiro.nome_completo} receberá <strong>${comissao}% de comissão</strong>.</p>
            `;
            parceiroInfoDiv.style.display = 'block';
        }

        // --- LÓGICA DE CEP ---

        async function buscarCep(cep) {
            cep = cep.replace(/\D/g, '');
            if (cep.length !== 8) return;

            console.log(`🔍 Buscando CEP: ${cep}`);
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    console.warn('⚠️ CEP não encontrado.');
                    mostrarAlerta('CEP não encontrado. Preencha o endereço manualmente.', 'warning');
                    limparCamposEndereco();
                    return;
                }

                console.log('✅ Dados do CEP:', data);
                inputEndereco.value = data.logradouro;
                inputBairro.value = data.bairro;
                inputCidade.value = data.localidade;
                inputEstado.value = data.uf;
                
                // Habilitar campos para edição se ViaCEP preencheu
                inputEndereco.readOnly = false;
                inputBairro.readOnly = false;
                inputCidade.readOnly = false;
                inputEstado.readOnly = false;
                inputNumero.readOnly = false;
                inputComplemento.readOnly = false;

                inputNumero.focus(); // Foca no número para o usuário preencher
            } catch (e) {
                console.error('❌ Erro ao buscar CEP:', e.message);
                mostrarAlerta('Erro ao buscar CEP. Preencha o endereço manualmente.', 'danger');
                limparCamposEndereco();
            }
        }

        function limparCamposEndereco() {
            inputEndereco.value = '';
            inputNumero.value = '';
            inputComplemento.value = '';
            inputBairro.value = '';
            inputCidade.value = '';
            inputEstado.value = '';

            inputEndereco.readOnly = false;
            inputBairro.readOnly = false;
            inputCidade.readOnly = false;
            inputEstado.readOnly = false;
            inputNumero.readOnly = false;
            inputComplemento.readOnly = false;
        }

        // --- LÓGICA DE PAGAMENTO ---

        async function criarVendaESolicitarPagamento(formData) {
            btnPay.disabled = true;
            btnPay.classList.add('loading');
            btnPay.innerHTML = '<span class="loading-spinner"></span> Processando...';
            alertMessageContainer.innerHTML = ''; // Limpa alertas anteriores

            try {
                // 1. Calcular comissão
                let comissaoPercentual = 0;
                let comissaoValor = 0;
                let parceiroId = null;

                if (parceiroReferral) {
                    parceiroId = parceiroReferral.id;
                    comissaoPercentual = parceiroReferral.comissao_percentual || 30;
                    comissaoValor = PRODUCT_PRICE * (comissaoPercentual / 100);
                    console.log(`💰 Comissão calculada: ${comissaoPercentual}% = ${formatarMoeda(comissaoValor)}`);
                } else {
                    console.log('💰 Nenhuma comissão para parceiro.');
                }

                // 2. Montar objeto de venda
                const vendaData = {
                    nome_comprador: formData.nome,
                    email_comprador: formData.email,
                    cpf_comprador: formData.cpf.replace(/\D/g, ''),
                    telefone_comprador: formData.telefone.replace(/\D/g, ''),
                    endereco_completo: `${formData.endereco}, ${formData.numero} ${formData.complemento ? `- ${formData.complemento}` : ''} - ${formData.bairro}, ${formData.cidade} - ${formData.estado}, CEP: ${formData.cep}`,
                    valor_total: PRODUCT_PRICE,
                    produto_id: PRODUCT_ID,
                    parceiro_id: parceiroId,
                    comissao_percentual: comissaoPercentual,
                    comissao_valor: comissaoValor,
                    status_pagamento: 'pendente',
                    metodo_pagamento: 'mercado_pago',
                    codigo_referencia: codigoParceiro // Armazena o código bruto da URL
                };
                console.log('📊 Dados da venda para Supabase:', vendaData);

                // 3. Inserir venda no Supabase
                const { data: vendaInserida, error: erroVenda } = await supabase
                    .from('vendas')
                    .insert([vendaData])
                    .select()
                    .single();

                if (erroVenda) {
                    console.error('❌ Erro ao inserir venda no Supabase:', erroVenda);
                    throw new Error('Não foi possível registrar sua compra. Tente novamente.');
                }
                console.log('✅ Venda registrada no Supabase:', vendaInserida);

                // 4. Criar preferência de pagamento no Mercado Pago (requer backend)
                console.log('📡 Solicitando preferência de pagamento ao backend...');
                const mpResponse = await fetch(MERCADO_PAGO_PREFERENCE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        items: [{
                            title: PRODUCT_NAME,
                            quantity: 1,
                            unit_price: PRODUCT_PRICE,
                            currency_id: 'BRL',
                            picture_url: 'https://bizmix.com.br/somos-todos-um/images/livro-capa.png' // Imagem do produto
                        }],
                        payer: {
                            name: formData.nome,
                            email: formData.email,
                            cpf: formData.cpf.replace(/\D/g, ''),
                            phone: formData.telefone.replace(/\D/g, '')
                        },
                        // Informações para o backend identificar a venda após o pagamento
                        external_reference: vendaInserida.id // ID da venda no Supabase
                    })
                });

                if (!mpResponse.ok) {
                    const errorData = await mpResponse.json();
                    console.error('❌ Erro ao criar preferência MP:', errorData);
                    throw new Error('Não foi possível gerar o pagamento. Tente novamente.');
                }

                const preference = await mpResponse.json();
                console.log('✅ Preferência Mercado Pago criada:', preference);

                // 5. Redirecionar para o Mercado Pago
                mostrarAlerta('Redirecionando para o pagamento...', 'success');
                window.location.href = preference.init_point;

            } catch (error) {
                console.error('❌ Erro no processo de checkout:', error);
                mostrarAlerta(error.message || 'Ocorreu um erro inesperado. Tente novamente.', 'danger');
            } finally {
                btnPay.disabled = false;
                btnPay.classList.remove('loading');
                btnPay.innerHTML = '<span class="loading-spinner"></span> Finalizar Compra - Pagar com Mercado Pago';
            }
        }

        // --- EVENT LISTENERS ---

        inputCpf.addEventListener('input', (e) => {
            e.target.value = formatarCpf(e.target.value);
        });

        inputTelefone.addEventListener('input', (e) => {
            e.target.value = formatarTelefone(e.target.value);
        });

        inputCep.addEventListener('input', (e) => {
            e.target.value = formatarCep(e.target.value);
        });

        inputCep.addEventListener('blur', () => {
            buscarCep(inputCep.value);
        });

        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validação básica do formulário
            const formData = {
                nome: inputNome.value.trim(),
                email: inputEmail.value.trim(),
                cpf: inputCpf.value.trim(),
                telefone: inputTelefone.value.trim(),
                cep: inputCep.value.trim(),
                endereco: inputEndereco.value.trim(),
                numero: inputNumero.value.trim(),
                complemento: inputComplemento.value.trim(),
                bairro: inputBairro.value.trim(),
                cidade: inputCidade.value.trim(),
                estado: inputEstado.value.trim()
            };

                mostrarAlerta('Por favor, preencha todos os campos obrigatórios.', 'danger');
                return;
            }
            if (!validarEmail(formData.email)) {
                mostrarAlerta('Por favor, insira um email válido.', 'danger');
                return;
            }
            if (!validarCpf(formData.cpf)) {
                mostrarAlerta('Por favor, insira um CPF válido.', 'danger');
                return;
            }
            if (formData.telefone.replace(/\D/g, '').length < 10) {
                mostrarAlerta('Por favor, insira um telefone válido (mínimo 10 dígitos).', 'danger');
                return;
            }

            await criarVendaESolicitarPagamento(formData);
        });

        // --- INICIALIZAÇÃO ---
        async function initCheckout() {
            // 1. Obter código de parceiro da URL
            const urlParams = new URLSearchParams(window.location.search);
            codigoParceiro = urlParams.get('ref');

            if (codigoParceiro) {
                console.log(`🔍 Código de parceiro na URL: ${codigoParceiro}`);
                parceiroReferral = await buscarParceiro(codigoParceiro);
                if (parceiroReferral) {
                    exibirInfoParceiro(parceiroReferral);
                } else {
                    parceiroInfoDiv.innerHTML = `
                        <div class="alert alert-warning">
                            ⚠️ Parceiro não encontrado ou inativo.<br>
                            <small>O código de indicação "${codigoParceiro}" não é válido.</small>
                        </div>
                    `;
                    parceiroInfoDiv.style.display = 'block';
                }
            } else {
                console.log('🔍 Nenhum código de parceiro na URL.');
            }
        }

        initCheckout();
    </script>
</body>
</html>
