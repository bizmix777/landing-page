<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Somos Todos UM</title>
    <link rel="stylesheet" href="/somos-todos-um/css/style.css">
    <link rel="preload" href="/somos-todos-um/images/capa-livro.jpg" as="image">
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Basic Reset & Body Styling */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%); /* Purple to Blue Gradient */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Container for the entire checkout page */
        .checkout-container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            box-sizing: border-box;
        }

        /* Product Card Styling */
        .product-card {
            flex: 1;
            min-width: 300px;
            background-color: #f9f9f9;
            border-radius: 10px;
            padding: 25px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .product-card img {
            max-width: 180px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .product-card h2 {
            color: #8B5CF6;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .product-card p {
            font-size: 1em;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }

        .product-card .price {
            font-size: 2.2em;
            font-weight: bold;
            color: #3B82F6;
            margin-top: 15px;
        }

        /* Form Styling */
        .form-section {
            flex: 2;
            min-width: 300px;
        }

        .form-section h2 {
            color: #8B5CF6;
            margin-bottom: 25px;
            font-size: 1.6em;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #8B5CF6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        /* Payment Buttons */
        .payment-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .payment-buttons button {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            width: 100%;
        }

        .payment-buttons button.pix-button {
            background: linear-gradient(45deg, #8B5CF6 0%, #A78BFA 100%); /* Primary Purple Gradient */
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .payment-buttons button.pix-button:hover {
            background: linear-gradient(45deg, #A78BFA 0%, #8B5CF6 100%);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }

        .payment-buttons button.card-button {
            background: linear-gradient(45deg, #3B82F6 0%, #60A5FA 100%); /* Secondary Blue Gradient */
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .payment-buttons button.card-button:hover {
            background: linear-gradient(45deg, #60A5FA 0%, #3B82F6 100%);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            transform: translateY(-2px);
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .checkout-container {
                flex-direction: column;
                padding: 20px;
            }

            .product-card, .form-section {
                min-width: unset;
                width: 100%;
            }

            .product-card {
                margin-bottom: 20px;
            }
        }

        /* Error message styling */
        .error-message {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="product-card">
            <img id="productImage" src="/somos-todos-um/images/capa-livro.jpg" alt="Capa do livro Somos Todos UM">
            <h2 id="productTitle">Somos Todos UM</h2>
            <p id="productDescription">Um livro transformador sobre conexão, espiritualidade e propósito de vida.</p>
            <div class="price" id="productPrice">R$ 29,90</div>
        </div>

        <div class="form-section">
            <h2>Informações do Comprador</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone (Opcional):</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 3333-4444">
                </div>
                <div class="form-group">
                    <label for="whatsapp">WhatsApp:</label>
                    <input type="tel" id="whatsapp" name="whatsapp" required minlength="10" placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000">
                </div>
                <div class="form-group">
                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" name="rua" required readonly>
                </div>
                <div class="form-group">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" required>
                </div>
                <div class="form-group">
                    <label for="complemento">Complemento (Opcional):</label>
                    <input type="text" id="complemento" name="complemento">
                </div>
                <div class="form-group">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required readonly>
                </div>
                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required readonly>
                </div>
                <div class="form-group">
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required disabled>
                        <option value="">Selecione o Estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>

                <div class="payment-buttons">
                    <button type="button" id="pixButton" class="pix-button">Pagar com PIX</button>
                    <button type="button" id="cardButton" class="card-button">Pagar com Cartão de Crédito</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        console.log("Checkout carregado");

        // Supabase Initialization with Fallback
        let supabase;
        if (typeof window.supabaseClient !== 'undefined') {
            supabase = window.supabaseClient;
            console.log("✅ Supabase inicializado via window.supabaseClient");
        } else {
            const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY5NjE0MTMsImV4cCI6MjA1MjUzNzQxM30.vZ8VsyFEkC_2bHoJH7jTNXsqJuYVEBw2gzHfKPWAh1M';
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("✅ Supabase inicializado via fallback");
        }

        // MercadoPago Public Key
        const MP_PUBLIC_KEY = 'APP_USR-e02e5be1-5802-47c6-8ec6-4146afcc61f5';
        const mp = new MercadoPago(MP_PUBLIC_KEY);

        // Product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('produto');

        // Elements
        const productImage = document.getElementById('productImage');
        const productTitle = document.getElementById('productTitle');
        const productDescription = document.getElementById('productDescription');
        const productPrice = document.getElementById('productPrice');
        const checkoutForm = document.getElementById('checkoutForm');
        const pixButton = document.getElementById('pixButton');
        const cardButton = document.getElementById('cardButton');

        // Form Fields
        const nomeInput = document.getElementById('nome');
        const emailInput = document.getElementById('email');
        const cpfInput = document.getElementById('cpf');
        const telefoneInput = document.getElementById('telefone');
        const whatsappInput = document.getElementById('whatsapp');
        const cepInput = document.getElementById('cep');
        const ruaInput = document.getElementById('rua');
        const numeroInput = document.getElementById('numero');
        const complementoInput = document.getElementById('complemento');
        const bairroInput = document.getElementById('bairro');
        const cidadeInput = document.getElementById('cidade');
        const estadoSelect = document.getElementById('estado');

        let currentProduct = null; // To store product details

        // --- FUNCTIONS ---

        async function carregarProduto() {
            if (!productId) {
                console.error("❌ Erro: ID do produto não encontrado na URL.");
                alert("Erro: ID do produto não encontrado na URL.");
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('produtos')
                    .select('*')
                    .eq('id', productId)
                    .single();

                if (error) throw error;

                if (data) {
                    currentProduct = data;
                    productImage.src = `/somos-todos-um/images/${data.imagem_capa || 'capa-livro.jpg'}`; // Use default if not set
                    productTitle.textContent = data.nome;
                    productDescription.textContent = data.descricao;
                    productPrice.textContent = `R$ ${data.preco.toFixed(2).replace('.', ',')}`;
                    console.log("📦 Produto carregado:", data);
                } else {
                    console.error("❌ Erro: Produto não encontrado.");
                    alert("Erro: Produto não encontrado.");
                }
            } catch (error) {
                console.error("❌ Erro ao carregar produto:", error.message);
                alert("Erro ao carregar produto. Tente novamente mais tarde.");
            }
        }

        function aplicarMascaras() {
            // CPF Mask
            cpfInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            });

            // CEP Mask
            cepInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                value = value.replace(/^(\d{5})(\d)/, '$1-$2');
                e.target.value = value;
            });

            // Phone Mask (Telefone and WhatsApp)
            const applyPhoneMask = (input) => {
                input.addEventListener('input', (e) => {
                    let value = e.target.value.replace(/\D/g, '');
                    if (value.length > 10) { // Cell phone with 9th digit
                        value = value.replace(/^(\d\d)(\d{5})(\d{4}).*/, '($1) $2-$3');
                    } else if (value.length > 6) { // Landline or shorter cell
                        value = value.replace(/^(\d\d)(\d{4})(\d{0,4}).*/, '($1) $2-$3');
                    } else if (value.length > 2) { // Just DDD
                        value = value.replace(/^(\d\d)(\d{0,5})/, '($1) $2');
                    } else {
                        value = value.replace(/^(\d*)/, '($1');
                    }
                    e.target.value = value;
                });
            };
            applyPhoneMask(telefoneInput);
            applyPhoneMask(whatsappInput);
        }

        async function buscarCEP() {
            const cep = cepInput.value.replace(/\D/g, '');
            if (cep.length !== 8) return;

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    alert("CEP não encontrado.");
                    limparEndereco();
                    return;
                }

                ruaInput.value = data.logradouro;
                bairroInput.value = data.bairro;
                cidadeInput.value = data.localidade;
                estadoSelect.value = data.uf;
                estadoSelect.disabled = true; // Keep disabled after autofill
                numeroInput.focus();
            } catch (error) {
                console.error("❌ Erro ao buscar CEP:", error);
                alert("Erro ao buscar CEP. Verifique o número e tente novamente.");
                limparEndereco();
            }
        }

        function limparEndereco() {
            ruaInput.value = '';
            bairroInput.value = '';
            cidadeInput.value = '';
            estadoSelect.value = '';
            estadoSelect.disabled = false;
        }

        function validarFormulario() {
            let isValid = true;
            const requiredFields = checkoutForm.querySelectorAll('[required]');

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    isValid = false;
                    field.style.borderColor = 'red';
                } else {
                    field.style.borderColor = '#ddd';
                }
            });

            // Specific validations
            if (!/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(cpfInput.value)) {
                isValid = false;
                cpfInput.style.borderColor = 'red';
            }
            if (!/\S+@\S+\.\S+/.test(emailInput.value)) {
                isValid = false;
                emailInput.style.borderColor = 'red';
            }
            if (whatsappInput.value.replace(/\D/g, '').length < 10) {
                isValid = false;
                whatsappInput.style.borderColor = 'red';
            }
            if (!/^\d{5}-\d{3}$/.test(cepInput.value)) {
                isValid = false;
                cepInput.style.borderColor = 'red';
            }

            if (!isValid) {
                alert("Por favor, preencha todos os campos obrigatórios corretamente.");
            }
            return isValid;
        }

        async function processarCompraPIX() {
            if (!validarFormulario()) {
                return;
            }
            if (!currentProduct) {
                alert("Erro: Dados do produto não carregados.");
                return;
            }

            pixButton.disabled = true;
            cardButton.disabled = true;
            pixButton.textContent = "Processando...";

            const nome = nomeInput.value;
            const email = emailInput.value;
            const cpf = cpfInput.value.replace(/\D/g, '');
            const telefone = telefoneInput.value.replace(/\D/g, '');
            const whatsapp = whatsappInput.value.replace(/\D/g, '');
            const valorTotal = currentProduct.preco;

            try {
                // 1. Registrar venda no Supabase
                console.log("📦 Registrando venda...");
                const { data: vendaData, error: vendaError } = await supabase
                    .from('vendas')
                    .insert([{
                        produto_id: productId,
                        nome_comprador: nome,
                        email_comprador: email,
                        cpf_comprador: cpf,
                        telefone_comprador: telefone,
                        whatsapp_comprador: whatsapp,
                        quantidade: 1,
                        valor_unitario: currentProduct.preco,
                        valor_total: valorTotal,
                        forma_pagamento: 'pix',
                        status_pagamento: 'pending',
                        data_venda: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (vendaError) throw vendaError;
                console.log("✅ Venda registrada:", vendaData);

                const vendaId = vendaData.id;

                // 2. Chamar Edge Function para criar PIX
                console.log("📞 Chamando Edge Function para criar PIX...");
                const response = await fetch('https://zofxhfbjgvpbqjtlkbbk.supabase.co/functions/v1/criar-pagamento-pix', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, // Use the anon key from fallback or external config
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        venda_id: vendaId,
                        valor: valorTotal,
                        email: email,
                        cpf: cpf,
                        nome: nome
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Erro ao criar pagamento PIX na Edge Function.');
                }

                const paymentData = await response.json();
                console.log("✅ PIX criado com sucesso:", paymentData);

                // 3. Redirecionar para a página de PIX
                window.location.href = `/somos-todos-um/pix.html?payment_id=${paymentData.id}&venda_id=${vendaId}`;

            } catch (error) {
                console.error("❌ Erro ao finalizar compra:", error);
                alert(`Erro ao processar pagamento: ${error.message}. Tente novamente.`);
                pixButton.disabled = false;
                cardButton.disabled = false;
                pixButton.textContent = "Pagar com PIX";
            }
        }

        async function processarCompraCartao() {
            if (!validarFormulario()) {
                return;
            }
            if (!currentProduct) {
                alert("Erro: Dados do produto não carregados.");
                return;
            }

            cardButton.disabled = true;
            pixButton.disabled = true;
            cardButton.textContent = "Processando...";

            const nome = nomeInput.value;
            const email = emailInput.value;
            const cpf = cpfInput.value.replace(/\D/g, '');
            const telefone = telefoneInput.value.replace(/\D/g, '');
            const whatsapp = whatsappInput.value.replace(/\D/g, '');
            const valorTotal = currentProduct.preco;

            try {
                // 1. Registrar venda no Supabase (similar ao PIX)
                console.log("📦 Registrando venda (Cartão)...");
                const { data: vendaData, error: vendaError } = await supabase
                    .from('vendas')
                    .insert([{
                        produto_id: productId,
                        nome_comprador: nome,
                        email_comprador: email,
                        cpf_comprador: cpf,
                        telefone_comprador: telefone,
                        whatsapp_comprador: whatsapp,
                        quantidade: 1,
                        valor_unitario: currentProduct.preco,
                        valor_total: valorTotal,
                        forma_pagamento: 'credit_card',
                        status_pagamento: 'pending', // Status inicial para cartão
                        data_venda: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (vendaError) throw vendaError;
                console.log("✅ Venda registrada (Cartão):", vendaData);

                const vendaId = vendaData.id;

                // 2. Integração com MercadoPago CardForm (placeholder)
                // A integração completa do CardForm do MercadoPago é mais complexa
                // e requer a criação de um token de cartão e uma chamada de API de pagamento
                // para o seu backend. Este é um placeholder para a lógica.
                alert("Funcionalidade de Cartão de Crédito em desenvolvimento. Por favor, use PIX.");
                console.warn("⚠️ Lógica de Cartão de Crédito precisa ser implementada: tokenização e chamada de API de pagamento.");

                // Exemplo de redirecionamento (ajuste conforme sua implementação de cartão)
                // window.location.href = `/somos-todos-um/sucesso.html?venda_id=${vendaId}`;

            } catch (error) {
                console.error("❌ Erro ao finalizar compra (Cartão):", error);
                alert(`Erro ao processar pagamento com cartão: ${error.message}. Tente novamente.`);
            } finally {
                cardButton.disabled = false;
                pixButton.disabled = false;
                cardButton.textContent = "Pagar com Cartão de Crédito";
            }
        }


        // --- EVENT LISTENERS ---

        document.addEventListener('DOMContentLoaded', () => {
            carregarProduto();
            aplicarMascaras();
        });

        cepInput.addEventListener('blur', buscarCEP);
        cepInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' || cepInput.value.replace(/\D/g, '').length === 8) {
                buscarCEP();
            }
        });

        pixButton.addEventListener('click', processarCompraPIX);
        cardButton.addEventListener('click', processarCompraCartao);

        console.log("✅ Checkout inicializado");
    </script>
</body>
</html>
