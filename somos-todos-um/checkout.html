<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Livro Digital Somos Todos Um</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Mercado Pago SDK CDN -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        /* Product Info */
        .product-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #eee;
        }

        .product-info h2 {
            font-size: 1.5em;
            color: #444;
            margin-bottom: 10px;
        }

        .product-info .price {
            font-size: 2.5em;
            color: #764ba2;
            font-weight: bold;
        }

        /* Payment Method Selector */
        .payment-method-selector {
            margin-bottom: 30px;
        }

        .payment-method-selector h3 {
            font-size: 1.3em;
            color: #444;
            margin-bottom: 15px;
            text-align: center;
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .payment-option {
            cursor: pointer;
            display: block;
        }

        .payment-option input[type="radio"] {
            display: none;
        }

        .option-content {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            background: #fff;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .payment-option input[type="radio"]:checked + .option-content {
            border-color: #667eea;
            background: #eef2ff;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .payment-option:hover .option-content {
            border-color: #a7b4f7;
        }

        .option-content .icon {
            font-size: 2.5em;
            display: block;
            margin-bottom: 10px;
            color: #667eea;
        }

        .option-content .text {
            font-size: 1em;
            color: #333;
            font-weight: bold;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            background: #a7b4f7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loading/Error Messages */
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .message.loading {
            background: #eef2ff;
            color: #667eea;
            border: 1px solid #a7b4f7;
        }

        .message.error {
            background: #ffebeb;
            color: #d9534f;
            border: 1px solid #f5c6cb;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .header h1 {
                font-size: 1.8em;
            }
            .product-info .price {
                font-size: 2em;
            }
            .payment-options {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BizMix Checkout</h1>
            <p>Finalize sua compra do Livro Digital - Somos Todos Um</p>
        </div>

        <div class="product-info">
            <h2>Livro Digital - Somos Todos Um</h2>
            <p class="price">R$ 47,00</p>
        </div>

        <form id="form-checkout">
            <div class="payment-method-selector">
                <h3>Escolha a forma de pagamento:</h3>
                <div class="payment-options">
                    <label class="payment-option">
                        <input type="radio" name="payment_method" value="credit_card" checked>
                        <div class="option-content">
                            <span class="icon">💳</span>
                            <span class="text">Cartão de Crédito</span>
                        </div>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment_method" value="pix">
                        <div class="option-content">
                            <span class="icon">💰</span>
                            <span class="text">PIX (Aprovação Instantânea)</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="buyer-info">
                <h3>Seus Dados</h3>
                <div class="form-group">
                    <label for="form-checkout__cardholderName">Nome Completo</label>
                    <input type="text" id="form-checkout__cardholderName" name="cardholderName" placeholder="Seu nome completo" required>
                </div>
                <div class="form-group">
                    <label for="form-checkout__cardholderEmail">E-mail</label>
                    <input type="email" id="form-checkout__cardholderEmail" name="cardholderEmail" placeholder="seu.email@exemplo.com" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Telefone</label>
                        <input type="tel" id="phone" name="phone" placeholder="(XX) XXXXX-XXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="XXX.XXX.XXX-XX" required>
                    </div>
                </div>
            </div>

            <div id="credit-card-form-container">
                <h3>Dados do Cartão</h3>
                <div id="cardPaymentBrick_container"></div>
            </div>

            <button type="submit" class="btn-submit" id="submit-button">Finalizar Compra</button>

            <div id="loading-message" class="message loading">Processando seu pagamento...</div>
            <div id="error-message" class="message error"></div>
        </form>
    </div>

    <footer class="footer">
        <p>&copy; 2026 BizMix. Todos os direitos reservados.</p>
    </footer>

    <script>
        // --- CONFIGURAÇÕES ---
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY3MTc1NzMsImV4cCI6MjA1MjI5MzU3M30.kHXn2pCMqGdNzxKPTUGIRdJI0Ow-Ks6gxLBLSvXaR_4';
        const MERCADOPAGO_PUBLIC_KEY = 'TEST-c5e46a4e-5775-4e9f-9e09-4007d1b3e5e8';

        const PRODUCT_PRICE = 47.00;
        const COMMISSION_PERCENTAGE = 0.30;
        const COMMISSION_AMOUNT = PRODUCT_PRICE * COMMISSION_PERCENTAGE;

        // --- SUPABASE CLIENT ---
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DOM ELEMENTS ---
        const formCheckout = document.getElementById('form-checkout');
        const creditCardFormContainer = document.getElementById('credit-card-form-container');
        const paymentMethodRadios = document.querySelectorAll('input[name="payment_method"]');
        const submitButton = document.getElementById('submit-button');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');

        // --- AFFILIATE CODE ---
        let affiliateCode = null;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('ref')) {
            affiliateCode = urlParams.get('ref');
            console.log('Código de afiliado:', affiliateCode);
        }

        // --- UTILITY FUNCTIONS ---
        function showMessage(element, msg, type = '') {
            element.textContent = msg;
            element.className = `message ${type}`;
            element.style.display = 'block';
        }

        function hideMessage(element) {
            element.style.display = 'none';
        }

        function setLoading(isLoading) {
            submitButton.disabled = isLoading;
            if (isLoading) {
                showMessage(loadingMessage, 'Processando seu pagamento...', 'loading');
                hideMessage(errorMessage);
            } else {
                hideMessage(loadingMessage);
            }
        }

        function validateBuyerInfo() {
            const name = document.getElementById('form-checkout__cardholderName').value;
            const email = document.getElementById('form-checkout__cardholderEmail').value;
            const phone = document.getElementById('phone').value;
            const cpf = document.getElementById('cpf').value;

            if (!name || !email || !phone || !cpf) {
                showMessage(errorMessage, 'Por favor, preencha todos os seus dados.', 'error');
                return false;
            }
            if (!/^\S+@\S+\.\S+$/.test(email)) {
                showMessage(errorMessage, 'Por favor, insira um e-mail válido.', 'error');
                return false;
            }
            return true;
        }

        // --- PAYMENT METHOD TOGGLE ---
        function togglePaymentMethod() {
            const selectedMethod = document.querySelector('input[name="payment_method"]:checked').value;
            if (selectedMethod === 'pix') {
                creditCardFormContainer.style.display = 'none';
            } else {
                creditCardFormContainer.style.display = 'block';
            }
            hideMessage(errorMessage);
        }

        paymentMethodRadios.forEach(radio => {
            radio.addEventListener('change', togglePaymentMethod);
        });

        togglePaymentMethod();

        // --- FORM SUBMISSION HANDLER ---
        formCheckout.addEventListener('submit', async (event) => {
            event.preventDefault();
            setLoading(true);
            hideMessage(errorMessage);

            if (!validateBuyerInfo()) {
                setLoading(false);
                return;
            }

            const selectedMethod = document.querySelector('input[name="payment_method"]:checked').value;
            const cardholderName = document.getElementById('form-checkout__cardholderName').value;
            const cardholderEmail = document.getElementById('form-checkout__cardholderEmail').value;
            const phone = document.getElementById('phone').value;
            const cpf = document.getElementById('cpf').value;

            if (selectedMethod === 'pix') {
                try {
                    const { data: venda, error: supabaseError } = await supabase
                        .from('vendas')
                        .insert({
                            nome_comprador: cardholderName,
                            email_comprador: cardholderEmail,
                            telefone_comprador: phone,
                            cpf_comprador: cpf,
                            valor_total: PRODUCT_PRICE,
                            valor_comissao: COMMISSION_AMOUNT,
                            status_pagamento: 'pending',
                            forma_pagamento: 'pix',
                            codigo_indicacao: affiliateCode,
                            data_venda: new Date().toISOString(),
                        })
                        .select()
                        .single();

                    if (supabaseError) {
                        throw new Error('Erro ao registrar a venda para PIX: ' + supabaseError.message);
                    }

                    const vendaId = venda.id;
                    console.log('Venda PIX registrada no Supabase:', vendaId);
                    window.location.href = `pagamento-pix.html?venda_id=${vendaId}`;

                } catch (error) {
                    console.error('Erro no processamento PIX:', error);
                    showMessage(errorMessage, 'Erro ao gerar pagamento PIX: ' + error.message, 'error');
                } finally {
                    setLoading(false);
                }
            } else {
                alert('Integração com cartão de crédito via Mercado Pago será implementada aqui.');
                setLoading(false);
            }
        });

        // --- INPUT MASKING ---
        const phoneInput = document.getElementById('phone');
        const cpfInput = document.getElementById('cpf');

        function maskPhone(value) {
            value = value.replace(/\D/g, "");
            value = value.replace(/^(\d{2})(\d)/g, "($1) $2");
            value = value.replace(/(\d)(\d{4})$/, "$1-$2");
            return value;
        }

        function maskCpf(value) {
            value = value.replace(/\D/g, "");
            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            return value;
        }

        phoneInput.addEventListener('input', (e) => {
            e.target.value = maskPhone(e.target.value);
        });

        cpfInput.addEventListener('input', (e) => {
            e.target.value = maskCpf(e.target.value);
        });
    </script>
</body>
</html>
