<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Somos Todos Um</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            line-height: 1.3;
        }

        .preco {
            text-align: center;
            font-size: 36px;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }

        /* Box de indicação (igreja ou parceiro) */
        .info-box {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #4caf50;
        }

        .info-box p {
            margin: 5px 0;
            color: #2d5016;
            font-size: 14px;
        }

        .info-box strong {
            color: #1b5e20;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading p {
            color: #667eea;
            font-size: 18px;
        }

        #resultado {
            display: none;
            margin-top: 30px;
        }

        #resultado h2 {
            color: #4caf50;
            text-align: center;
            margin-bottom: 20px;
        }

        .instrucoes {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .instrucoes h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .instrucoes ol {
            margin-left: 20px;
        }

        .instrucoes li {
            margin-bottom: 10px;
            color: #555;
        }

        #qrcode {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        #qrcode img {
            max-width: 250px;
            border: 3px solid #667eea;
            border-radius: 10px;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-weight: bold;
        }

        .codigo-pix-container {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .codigo-pix {
            background: white;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            border: 2px dashed #667eea;
            margin-top: 10px;
        }

        .btn-copy {
            background: #4caf50;
            margin-bottom: 10px;
        }

        .btn-copy:hover {
            background: #45a049;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: #fff3cd;
            border-radius: 10px;
            color: #856404;
            margin: 20px 0;
        }

        .btn-confirmacao {
            background: #4caf50;
        }

        .btn-confirmacao:hover {
            background: #45a049;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .preco {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Livro Digital<br>Somos Todos Um</h1>
        <div class="preco">R$ 47,00</div>

        <!-- Box de indicação (aparece se houver parceiro ou igreja) -->
        <div id="indicacao-info" style="display: none;"></div>

        <form id="formCheckout">
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" required placeholder="Seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" required maxlength="14" placeholder="000.000.000-00">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone/WhatsApp *</label>
                <input type="tel" id="telefone" required maxlength="15" placeholder="(00) 00000-0000">
            </div>

            <button type="button" id="btnGerar">Gerar PIX - R$ 47,00</button>
        </form>

        <div class="loading" id="loading">
            <p>⏳ Gerando PIX...</p>
        </div>

        <div id="resultado">
            <h2>✅ PIX Gerado com Sucesso!</h2>

            <div class="instrucoes">
                <h3>📱 Como Pagar:</h3>
                <ol>
                    <li><strong>Opção 1:</strong> Escaneie o QR Code abaixo com o app do seu banco</li>
                    <li><strong>Opção 2:</strong> Copie o código PIX e cole no app do seu banco (Pix Copia e Cola)</li>
                </ol>
            </div>

            <div id="qrcode"></div>

            <div class="divider">OU</div>

            <div class="codigo-pix-container">
                <button type="button" id="btnCopiar" class="btn-copy">📋 Copiar Código PIX</button>
                <div class="codigo-pix" id="codigoPix"></div>
            </div>

            <div class="status">
                ⏳ Aguardando confirmação do pagamento...
            </div>

            <button type="button" id="btnConfirmacao" class="btn-confirmacao">✅ Já Paguei - Verificar Status</button>
        </div>
    </div>

    <script>
        // Configuração do Supabase
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM'
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        // Variáveis globais
        let vendaIdAtual = null
        let igrejaIdAtual = null
        let parceiroIdAtual = null // NOVO: para parceiros

        // Máscaras de input
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '')
            if (value.length <= 11) {
                value = value.replace(/(\d{3})(\d)/, '$1.$2')
                value = value.replace(/(\d{3})(\d)/, '$1.$2')
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2')
            }
            e.target.value = value
        })

        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '')
            if (value.length <= 11) {
                value = value.replace(/(\d{2})(\d)/, '($1) $2')
                value = value.replace(/(\d{5})(\d)/, '$1-$2')
            }
            e.target.value = value
        })

        // Verificar se há código de parceiro ou igreja na URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search)
            const codigoParceiro = urlParams.get('parceiro')
            const codigoIgreja = urlParams.get('igreja')

            // PRIORIDADE: Parceiro > Igreja
            if (codigoParceiro) {
                buscarParceiro(codigoParceiro)
            } else if (codigoIgreja) {
                buscarIgreja(codigoIgreja)
            }
        })

        // NOVA FUNÇÃO: Buscar parceiro
        async function buscarParceiro(codigoParceiro) {
            try {
                console.log('Buscando parceiro:', codigoParceiro)
                
                const { data: parceiro, error } = await supabase
                    .from('parceiros')
                    .select('id, nome_completo, status')
                    .eq('codigo_parceiro', codigoParceiro)
                    .eq('status', 'ativo')
                    .single()

                if (error || !parceiro) {
                    console.log('Parceiro não encontrado, tentando buscar igreja...')
                    buscarIgreja(codigoParceiro)
                    return
                }

                console.log('Parceiro encontrado:', parceiro)
                parceiroIdAtual = parceiro.id

                // Mostrar informações do parceiro
                const infoDiv = document.getElementById('indicacao-info')
                infoDiv.innerHTML = `
                    <div class="info-box">
                        <p><strong>🤝 Indicado por:</strong> ${parceiro.nome_completo}</p>
                    </div>
                `
                infoDiv.style.display = 'block'

            } catch (error) {
                console.error('Erro ao buscar parceiro:', error)
                buscarIgreja(codigoParceiro)
            }
        }

        // Função para buscar igreja (mantém compatibilidade)
        async function buscarIgreja(codigoIgreja) {
            try {
                console.log('Buscando igreja:', codigoIgreja)
                
                const { data: igreja, error } = await supabase
                    .from('igrejas')
                    .select('id, nome, responsavel, status')
                    .eq('codigo_indicacao', codigoIgreja)
                    .eq('status', 'ativa')
                    .single()

                if (error || !igreja) {
                    console.log('Igreja não encontrada')
                    return
                }

                console.log('Igreja encontrada:', igreja)
                igrejaIdAtual = igreja.id

                // Mostrar informações da igreja
                const infoDiv = document.getElementById('indicacao-info')
                infoDiv.innerHTML = `
                    <div class="info-box">
                        <p><strong>⛪ Indicado por:</strong> ${igreja.nome}</p>
                        ${igreja.responsavel ? `<p><strong>Responsável:</strong> ${igreja.responsavel}</p>` : ''}
                    </div>
                `
                infoDiv.style.display = 'block'

            } catch (error) {
                console.error('Erro ao buscar igreja:', error)
            }
        }

        // Gerar PIX
        document.getElementById('btnGerar').addEventListener('click', async () => {
            const nome = document.getElementById('nome').value.trim()
            const email = document.getElementById('email').value.trim()
            const cpf = document.getElementById('cpf').value.replace(/\D/g, '')
            const telefone = document.getElementById('telefone').value.replace(/\D/g, '')

            // Validações
            if (!nome || !email || !cpf || !telefone) {
                alert('Por favor, preencha todos os campos obrigatórios')
                return
            }

            if (cpf.length !== 11) {
                alert('CPF inválido')
                return
            }

            if (telefone.length < 10) {
                alert('Telefone inválido')
                return
            }

            // Mostrar loading
            document.getElementById('formCheckout').style.display = 'none'
            document.getElementById('loading').style.display = 'block'

            try {
                // Chamar Edge Function para criar pagamento PIX
                const response = await fetch(`${SUPABASE_URL}/functions/v1/criar-pagamento-pix`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        nome: nome,
                        email: email,
                        cpf: cpf,
                        telefone: telefone,
                        igrejaId: igrejaIdAtual,
                        parceiroId: parceiroIdAtual, // NOVO: enviar parceiroId
                        valor: 47.00
                    })
                })

                const data = await response.json()

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao gerar PIX')
                }

                console.log('PIX gerado:', data)
                vendaIdAtual = data.vendaId

                // Mostrar QR Code
                document.getElementById('qrcode').innerHTML = `
                    <img src="${data.qrCodeBase64}" alt="QR Code PIX">
                `

                // Mostrar código PIX
                document.getElementById('codigoPix').textContent = data.qrCode

                // Configurar botão de copiar
                document.getElementById('btnCopiar').addEventListener('click', () => {
                    navigator.clipboard.writeText(data.qrCode)
                    alert('✅ Código PIX copiado!')
                })

                // Configurar botão de confirmação
                document.getElementById('btnConfirmacao').addEventListener('click', () => {
                    window.location.href = `confirmacao.html?venda=${vendaIdAtual}`
                })

                // Esconder loading e mostrar resultado
                document.getElementById('loading').style.display = 'none'
                document.getElementById('resultado').style.display = 'block'

            } catch (error) {
                console.error('Erro:', error)
                alert('❌ Erro ao gerar PIX: ' + error.message)
                document.getElementById('loading').style.display = 'none'
                document.getElementById('formCheckout').style.display = 'block'
            }
        })
    </script>
</body>
</html>
