<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Somos Todos Um</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Login Admin</h1>
            <p>Acesse o painel administrativo</p>
        </div>

        <div id="alertContainer"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Entrar
            </button>
        </form>

        <div class="back-link">
            <a href="/">← Voltar para o site</a>
        </div>
    </div>

    <script>
        console.log('🔐 Página de Login Carregada');

        // Verificar se JÁ está logado
        function verificarSeJaEstaLogado() {
            const session = localStorage.getItem('adminSession');
            if (session) {
                try {
                    const sessionData = JSON.parse(session);
                    const now = new Date().getTime();
                    
                    if (now < sessionData.expires) {
                        console.log('✅ Usuário já está logado - redirecionando para dashboard');
                        window.location.href = 'index.html';
                        return true;
                    } else {
                        console.log('⏰ Sessão expirada - removendo');
                        localStorage.removeItem('adminSession');
                    }
                } catch (e) {
                    console.error('❌ Erro ao verificar sessão:', e);
                    localStorage.removeItem('adminSession');
                }
            }
            return false;
        }

        // Verificar ao carregar a página
        verificarSeJaEstaLogado();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const btnLogin = document.getElementById('btnLogin');
            btnLogin.disabled = true;
            btnLogin.textContent = '⏳ Verificando...';

            // CREDENCIAIS DE TESTE (SUBSTITUA POR AUTENTICAÇÃO REAL)
            const ADMIN_EMAIL = 'admin@somostodosum.com';
            const ADMIN_PASSWORD = 'admin123';

            setTimeout(function() {
                if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                    // Login bem-sucedido
                    const sessionData = {
                        email: email,
                        expires: new Date().getTime() + (24 * 60 * 60 * 1000) // 24 horas
                    };

                    localStorage.setItem('adminSession', JSON.stringify(sessionData));

                    showAlert('✅ Login realizado com sucesso!', 'success');

                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1000);

                } else {
                    // Login falhou
                    showAlert('❌ Email ou senha incorretos!', 'error');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar';
                }
            }, 1000);
        });

        function showAlert(message, type) {
            document.getElementById('alertContainer').innerHTML = 
                '<div class="alert alert-' + type + '">' + message + '</div>';
        }
    </script>
</body>
</html>
