    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        console.log('🚀 SCRIPT DASHBOARD INICIADO');

        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM';

        var supabaseClient = null;
        var verificacaoFeita = false; // ← IMPORTANTE: Previne loop

        function checkSession() {
            if (verificacaoFeita) {
                console.log('⚠️ Verificação já foi feita - ignorando');
                return true;
            }

            verificacaoFeita = true;

            const session = localStorage.getItem('adminSession');
            if (!session) {
                console.log('❌ Sem sessão - redirecionando para login');
                window.location.replace('login.html'); // ← replace em vez de href
                return false;
            }

            try {
                const sessionData = JSON.parse(session);
                const now = new Date().getTime();
                
                if (now > sessionData.expires) {
                    console.log('⏰ Sessão expirada - redirecionando para login');
                    localStorage.removeItem('adminSession');
                    window.location.replace('login.html');
                    return false;
                }

                document.getElementById('userEmail').textContent = sessionData.email;
                console.log('✅ Sessão válida:', sessionData.email);
                return true;

            } catch (e) {
                console.error('❌ Erro ao verificar sessão:', e);
                localStorage.removeItem('adminSession');
                window.location.replace('login.html');
                return false;
            }
        }

        function logout() {
            localStorage.removeItem('adminSession');
            window.location.replace('login.html');
        }

        function iniciar() {
            console.log('📥 Inicializando dashboard...');

            if (!checkSession()) {
                console.log('⛔ Sessão inválida - parando execução');
                return;
            }

            if (typeof window.supabase === 'undefined') {
                console.error('❌ Supabase não carregou');
                alert('Erro ao carregar sistema');
                return;
            }

            const { createClient } = window.supabase;
            supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log('✅ Supabase criado');

            carregarDados();
        }

        function carregarDados() {
            console.log('📥 Carregando dados do dashboard...');

            Promise.all([
                supabaseClient.from('vendas').select('*').order('created_at', { ascending: false }).limit(10),
                supabaseClient.from('vendas').select('valor_total, valor_comissao, igreja_id'),
                supabaseClient.from('igrejas').select('id')
            ])
            .then(function(results) {
                const vendasRecentesResult = results[0];
                const todasVendasResult = results[1];
                const igrejasResult = results[2];

                console.log('📊 Vendas Recentes:', vendasRecentesResult);
                console.log('📊 Todas Vendas:', todasVendasResult);
                console.log('📊 Igrejas:', igrejasResult);

                if (vendasRecentesResult.error) throw vendasRecentesResult.error;
                if (todasVendasResult.error) throw todasVendasResult.error;
                if (igrejasResult.error) throw igrejasResult.error;

                const vendasRecentes = vendasRecentesResult.data || [];
                const todasVendas = todasVendasResult.data || [];
                const igrejas = igrejasResult.data || [];

                let totalVendas = 0;
                let vendasDiretas = 0;
                let vendasComIgreja = 0;
                let totalComissoes = 0;

                todasVendas.forEach(function(venda) {
                    const valor = parseFloat(venda.valor_total || 0);
                    const comissao = parseFloat(venda.valor_comissao || 0);
                    
                    totalVendas += valor;
                    totalComissoes += comissao;

                    if (venda.igreja_id) {
                        vendasComIgreja += valor;
                    } else {
                        vendasDiretas += valor;
                    }
                });

                document.getElementById('totalVendas').textContent = 'R$ ' + totalVendas.toFixed(2);
                document.getElementById('vendasDiretas').textContent = 'R$ ' + vendasDiretas.toFixed(2);
                document.getElementById('vendasIgreja').textContent = 'R$ ' + vendasComIgreja.toFixed(2);
                document.getElementById('totalComissoes').textContent = 'R$ ' + totalComissoes.toFixed(2);
                document.getElementById('igrejasAtivas').textContent = igrejas.length;

                document.querySelector('.status').textContent = todasVendas.length + ' vendas';

                renderizarVendas(vendasRecentes);

                document.getElementById('loadingOverlay').classList.add('hidden');
                console.log('✅ Carregamento completo');
            })
            .catch(function(error) {
                console.error('❌ Erro:', error);
                alert('Erro ao carregar dados: ' + error.message);
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
        }

        function renderizarVendas(vendas) {
            const tbody = document.getElementById('vendasTableBody');
            tbody.innerHTML = '';

            if (!vendas || vendas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px;">Nenhuma venda registrada ainda.</td></tr>';
                return;
            }

            vendas.forEach(function(venda) {
                const row = document.createElement('tr');
                
                const data = new Date(venda.created_at);
                const dataFormatada = data.toLocaleDateString('pt-BR') + ' ' + data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                
                let statusBadge = '';
                if (venda.status_pagamento === 'aprovado') {
                    statusBadge = '<span class="badge success">✓ Aprovado</span>';
                } else if (venda.status_pagamento === 'pendente') {
                    statusBadge = '<span class="badge warning">⏳ Pendente</span>';
                } else {
                    statusBadge = '<span class="badge danger">✗ Cancelado</span>';
                }

                row.innerHTML = `
                    <td>${dataFormatada}</td>
                    <td><strong>${venda.nome_comprador || 'N/A'}</strong><br><small>${venda.email_comprador || ''}</small></td>
                    <td>${venda.igreja_id ? '⛪ Com Igreja' : '🏢 Direta'}</td>
                    <td><strong>R$ ${parseFloat(venda.valor_total || 0).toFixed(2)}</strong></td>
                    <td><strong style="color: #28a745;">R$ ${parseFloat(venda.valor_comissao || 0).toFixed(2)}</strong></td>
                    <td>${statusBadge}</td>
                `;
                tbody.appendChild(row);
            });

            console.log('✅ Renderizadas', vendas.length, 'vendas');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(iniciar, 1000);
            });
        } else {
            setTimeout(iniciar, 1000);
        }
    </script>
</body>
</html>
