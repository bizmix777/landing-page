<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Portal do Parceiro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 30px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #f8f9fa; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card h3 { color: #666; font-size: 14px; margin: 0 0 10px 0; }
        .stat-card .value { color: #667eea; font-size: 32px; font-weight: bold; }
        .link-box { background: #f8f9fa; padding: 20px; border-radius: 12px; margin-top: 30px; }
        .link-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #5568d3; }
        #loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <h2>Carregando...</h2>
            <p>Aguarde enquanto buscamos seus dados</p>
        </div>
        
        <div id="dashboard" style="display:none;">
            <h1>Dashboard - <span id="nomeParceiro"></span></h1>
            
            <div class="stats">
                <div class="stat-card">
                    <h3>Total de Vendas</h3>
                    <div class="value" id="totalVendas">0</div>
                </div>
                <div class="stat-card">
                    <h3>Valor Total</h3>
                    <div class="value" id="valorTotal">R$ 0,00</div>
                </div>
                <div class="stat-card">
                    <h3>Comissão Total</h3>
                    <div class="value" id="comissaoTotal">R$ 0,00</div>
                </div>
                <div class="stat-card">
                    <h3>Taxa</h3>
                    <div class="value" id="taxaComissao">0%</div>
                </div>
            </div>
            
            <div class="link-box">
                <h3>Seu Link de Indicação</h3>
                <input type="text" id="linkIndicacao" readonly>
                <button class="btn" onclick="copiarLink()">Copiar Link</button>
            </div>
            
            <button class="btn" onclick="logout()" style="margin-top: 20px;">Sair</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabase = createClient(
            'https://fbmxioslmmnxldjnnulg.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZibXhpb3NsbW1ueGxkam5udWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDIxOTEsImV4cCI6MjEwNDk3ODE5MX0.wPY_UjlCVkJb0Ci5j0CYxxpaeYSjyN9GKc49tE31MU0'
        );

        console.log('✅ Supabase inicializado');

        async function init() {
            try {
                console.log('🔐 Verificando sessão...');
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session) {
                    console.log('❌ Sem sessão, redirecionando...');
                    window.location.href = 'login.html';
                    return;
                }

                console.log('✅ Sessão OK:', session.user.email);

                console.log('📊 Buscando parceiro...');
                const { data: parceiro, error: erroParceiro } = await supabase
                    .from('parceiros')
                    .select('*')
                    .eq('auth_user_id', session.user.id)
                    .single();

                if (erroParceiro) throw erroParceiro;
                console.log('✅ Parceiro:', parceiro);

                console.log('📈 Buscando vendas...');
                const { data: vendas, error: erroVendas } = await supabase
                    .from('vendas')
                    .select('*')
                    .eq('parceiro_id', parceiro.id)
                    .eq('status_pagamento', 'pago');

                if (erroVendas) throw erroVendas;
                console.log('✅ Vendas:', vendas);

                // Calcular
                const total = vendas.length;
                const valorTotal = vendas.reduce((s, v) => s + parseFloat(v.valor_total || 0), 0);
                const comissaoTotal = vendas.reduce((s, v) => s + parseFloat(v.comissao_valor || 0), 0);

                // Atualizar
                document.getElementById('nomeParceiro').textContent = parceiro.nome_completo;
                document.getElementById('totalVendas').textContent = total;
                document.getElementById('valorTotal').textContent = `R$ ${valorTotal.toFixed(2)}`;
                document.getElementById('comissaoTotal').textContent = `R$ ${comissaoTotal.toFixed(2)}`;
                document.getElementById('taxaComissao').textContent = `${parceiro.comissao_percentual || 30}%`;
                document.getElementById('linkIndicacao').value = `https://bizmix.com.br/somos-todos-um/parceiros/checkout.html?ref=${parceiro.codigo_parceiro}`;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                console.log('✅ Dashboard carregado!');

            } catch (error) {
                console.error('❌ Erro:', error);
                alert('Erro: ' + error.message);
            }
        }

        window.copiarLink = () => {
            document.getElementById('linkIndicacao').select();
            document.execCommand('copy');
            alert('Link copiado!');
        };

        window.logout = async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        };

        init();
    </script>
</body>
</html>
