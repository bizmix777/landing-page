<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout PIX - DEBUG V2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; font-size: 24px; }
        p { text-align: center; color: #666; margin-bottom: 30px; }
        .price { font-size: 36px; color: #764ba2; text-align: center; font-weight: bold; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #667eea; color: white; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #5568d3; }
        .debug { background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 11px; max-height: 300px; overflow-y: auto; border: 2px solid #667eea; }
        .debug-title { font-weight: bold; color: #667eea; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Checkout PIX - DEBUG V2</h1>
        <p>Livro Digital - Somos Todos Um</p>
        <div class="price">R$ 47,00</div>

        <form id="checkoutForm">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" value="Teste Debug V2" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" value="teste@debug.com" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="tel" id="telefone" value="(11) 99999-9999" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" value="123.456.789-09" required>
            </div>
            <button type="submit" class="btn" id="btnSubmit">🚀 Gerar PIX</button>
        </form>

        <div class="debug">
            <div class="debug-title">📊 LOGS DE DEBUG:</div>
            <div id="debugContent"></div>
        </div>
    </div>

    <script>
        const debugContent = document.getElementById('debugContent');
        let logCount = 0;
        
        function log(msg, color = '#333') {
            logCount++;
            const timestamp = new Date().toLocaleTimeString();
            const logMsg = `[${logCount}] ${timestamp} - ${msg}`;
            console.log(logMsg);
            debugContent.innerHTML += `<div style="color: ${color}; margin-bottom: 5px;">${logMsg}</div>`;
            debugContent.scrollTop = debugContent.scrollHeight;
        }

        log('🚀 SCRIPT INICIADO', '#28a745');
        log('📍 URL atual: ' + window.location.href, '#0066cc');
        log('📍 Hostname: ' + window.location.hostname, '#0066cc');
        log('📍 Pathname: ' + window.location.pathname, '#0066cc');
        log('📍 Protocol: ' + window.location.protocol, '#0066cc');

        const urlParams = new URLSearchParams(window.location.search);
        const affiliateCode = urlParams.get('ref');
        log('🔍 Código afiliado: ' + (affiliateCode || 'NENHUM'), '#ff6600');

        const form = document.getElementById('checkoutForm');
        const btnSubmit = document.getElementById('btnSubmit');

        if (form) {
            log('✅ Formulário encontrado', '#28a745');
        } else {
            log('❌ ERRO: Formulário não encontrado', '#dc3545');
        }

        if (btnSubmit) {
            log('✅ Botão encontrado', '#28a745');
        } else {
            log('❌ ERRO: Botão não encontrado', '#dc3545');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            log('📝 EVENTO SUBMIT DISPARADO!', '#ff6600');

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;
            const cpf = document.getElementById('cpf').value;

            log('📊 Nome: ' + nome);
            log('📊 Email: ' + email);
            log('📊 Telefone: ' + telefone);
            log('📊 CPF: ' + cpf);

            btnSubmit.disabled = true;
            btnSubmit.textContent = '⏳ Processando...';

            // Gerar ID de teste
            const vendaIdTeste = 'teste-' + Date.now();
            log('🆔 ID de venda gerado: ' + vendaIdTeste, '#0066cc');

            // USAR URL COMPLETA
            const redirectUrl = 'https://bizmix.com.br/somos-todos-um/parceiros/pagamento-pix.html?venda_id=' + vendaIdTeste;
            
            log('🔗 URL COMPLETA de redirecionamento:', '#ff6600');
            log(redirectUrl, '#0066cc');
            log('⏳ Aguardando 3 segundos antes de redirecionar...', '#ff6600');

            let countdown = 3;
            const countdownInterval = setInterval(() => {
                countdown--;
                log(`⏰ Redirecionando em ${countdown} segundos...`, '#ff6600');
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    log('🔄 EXECUTANDO REDIRECIONAMENTO AGORA!', '#28a745');
                    log('🔄 Chamando: window.location.href = "' + redirectUrl + '"', '#28a745');
                    
                    try {
                        window.location.href = redirectUrl;
                        log('✅ Comando de redirecionamento executado', '#28a745');
                    } catch (error) {
                        log('❌ ERRO ao redirecionar: ' + error.message, '#dc3545');
                    }
                }
            }, 1000);
        });

        log('✅ Event listener adicionado ao formulário', '#28a745');
        log('✅ SCRIPT COMPLETO - Aguardando ação do usuário', '#28a745');
        log('-------------------------------------------', '#999');
    </script>
</body>
</html>
