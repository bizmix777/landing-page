<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Vendas - Área do Parceiro</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: #111827;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: #1f2937;
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            border: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }

        .btn-back {
            padding: 10px 20px;
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-back:hover {
            background: #4b5563;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            margin: 0 0 8px 0;
        }

        .stat-card .value {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .card {
            background: #1f2937;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #374151;
            overflow-x: auto;
        }

        .card h2 {
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        thead {
            background: #374151;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: white;
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 2px solid #4b5563;
        }

        td {
            padding: 16px;
            color: #d1d5db;
            font-size: 14px;
            border-bottom: 1px solid #374151;
        }

        tbody tr:hover {
            background: #374151;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.success {
            background: #10b981;
            color: white;
        }

        .badge.warning {
            background: #f59e0b;
            color: white;
        }

        .badge.danger {
            background: #ef4444;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: white;
            font-size: 20px;
            margin: 0 0 8px 0;
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                padding: 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-back {
                width: 100%;
                text-align: center;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <p>⏳ Carregando vendas...</p>
    </div>

    <div class="container" id="conteudo" style="display: none;">
        <div class="header">
            <h1>📋 Minhas Vendas</h1>
            <a href="dashboard.html" class="btn-back">← Voltar ao Dashboard</a>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <h3>Total de Vendas</h3>
                <p class="value" id="totalVendas">0</p>
            </div>
            <div class="stat-card">
                <h3>Valor Total</h3>
                <p class="value" id="valorTotal">R$ 0,00</p>
            </div>
            <div class="stat-card">
                <h3>Comissão Total</h3>
                <p class="value" id="comissaoTotal">R$ 0,00</p>
            </div>
        </div>

        <div class="card">
            <h2>Histórico de Vendas</h2>
            <div id="tabelaContainer"></div>
        </div>
    </div>

    <script>
        console.log('🚀 Página de Vendas - Iniciada');

        // Configuração do Supabase
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM';
        
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioAtual = null;
        let parceiroAtual = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await verificarAutenticacao();
        });

        async function verificarAutenticacao() {
            console.log('🔍 Verificando autenticação...');
            
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error || !session) {
                    console.log('❌ Sessão inválida - redirecionando');
                    window.location.href = '/painel-acesso/';
                    return;
                }
                
                console.log('✅ Sessão válida:', session.user.email);
                usuarioAtual = session.user;
                
                await buscarDadosParceiro();
                
            } catch (error) {
                console.error('❌ Erro:', error);
                window.location.href = '/painel-acesso/';
            }
        }

        async function buscarDadosParceiro() {
            console.log('📥 Buscando dados do parceiro...');
            
            try {
                // Buscar em igrejas
                let { data: igreja, error: erroIgreja } = await supabaseClient
                    .from('igrejas')
                    .select('*')
                    .eq('email', usuarioAtual.email)
                    .single();
                
                if (igreja) {
                    parceiroAtual = {
                        id: igreja.id,
                        nome: igreja.nome,
                        email: igreja.email,
                        tipo: 'igreja'
                    };
                    await carregarVendas();
                    return;
                }
                
                // Buscar em parceiros
                let { data: parceiro, error: erroParceiro } = await supabaseClient
                    .from('parceiros')
                    .select('*')
                    .eq('email', usuarioAtual.email)
                    .single();
                
                if (parceiro) {
                    parceiroAtual = {
                        id: parceiro.id,
                        nome: parceiro.nome,
                        email: parceiro.email,
                        tipo: 'parceiro'
                    };
                    await carregarVendas();
                    return;
                }
                
                console.warn('⚠️ Parceiro não encontrado');
                alert('Cadastro não encontrado.');
                window.location.href = '/painel-acesso/';
                
            } catch (error) {
                console.error('❌ Erro:', error);
                alert('Erro ao carregar dados: ' + error.message);
                window.location.href = '/painel-acesso/';
            }
        }

        async function carregarVendas() {
            console.log('📊 Carregando vendas...');
            
            try {
                const { data: vendas, error } = await supabaseClient
                    .from('vendas')
                    .select('*')
                    .or(`parceiro_id.eq.${parceiroAtual.id},igreja_id.eq.${parceiroAtual.id}`)
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('❌ Erro ao buscar vendas:', error);
                    throw error;
                }
                
                console.log('📊 Vendas encontradas:', vendas);
                
                // Calcular estatísticas
                const totalVendas = vendas ? vendas.length : 0;
                const valorTotal = vendas ? vendas.reduce((sum, v) => sum + parseFloat(v.valor_total || 0), 0) : 0;
                const comissaoTotal = vendas ? vendas.reduce((sum, v) => sum + parseFloat(v.valor_comissao || 0), 0) : 0;
                
                // Atualizar estatísticas
                document.getElementById('totalVendas').textContent = totalVendas;
                document.getElementById('valorTotal').textContent = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
                document.getElementById('comissaoTotal').textContent = `R$ ${comissaoTotal.toFixed(2).replace('.', ',')}`;
                
                // Renderizar tabela
                renderizarTabela(vendas);
                
                // Mostrar conteúdo
                document.getElementById('loading').style.display = 'none';
                document.getElementById('conteudo').style.display = 'block';
                
                console.log('✅ Vendas carregadas');
                
            } catch (error) {
                console.error('❌ Erro:', error);
                alert('Erro ao carregar vendas: ' + error.message);
            }
        }

        function renderizarTabela(vendas) {
            const container = document.getElementById('tabelaContainer');
            
            if (!vendas || vendas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>Nenhuma venda ainda</h3>
                        <p>Suas vendas aparecerão aqui quando forem realizadas</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Cliente</th>
                            <th>Produto</th>
                            <th>Valor</th>
                            <th>Comissão</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            vendas.forEach(venda => {
                const data = new Date(venda.created_at);
                const dataFormatada = data.toLocaleDateString('pt-BR');
                
                let statusBadge = '';
                if (venda.status_pagamento === 'aprovado') {
                    statusBadge = '<span class="badge success">✓ Aprovado</span>';
                } else if (venda.status_pagamento === 'pendente') {
                    statusBadge = '<span class="badge warning">⏳ Pendente</span>';
                } else {
                    statusBadge = '<span class="badge danger">✗ Cancelado</span>';
                }
                
                html += `
                    <tr>
                        <td>${dataFormatada}</td>
                        <td><strong>${venda.nome_comprador || 'N/A'}</strong><br><small>${venda.email_comprador || ''}</small></td>
                        <td>${venda.produto || 'Produto'}</td>
                        <td><strong>R$ ${parseFloat(venda.valor_total || 0).toFixed(2).replace('.', ',')}</strong></td>
                        <td><strong style="color: #10b981;">R$ ${parseFloat(venda.valor_comissao || 0).toFixed(2).replace('.', ',')}</strong></td>
                        <td>${statusBadge}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }
    </script>
</body>
</html>
