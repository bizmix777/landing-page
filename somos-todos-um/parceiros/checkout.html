<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Livro Somos Todos Um</title>
    
    <!-- Mercado Pago SDK -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .produto-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .produto-icon {
            font-size: 64px;
        }

        .produto-detalhes h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .produto-preco {
            font-size: 36px;
            color: #667eea;
            font-weight: bold;
        }

        .parceiro-info {
            padding: 20px 30px;
            background: #f8f9fa;
            border-left: 4px solid #28a745;
            margin: 20px 30px;
            border-radius: 8px;
        }

        .parceiro-info.erro {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .parceiro-info.sucesso {
            background: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }

        .form-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-finalizar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn-finalizar:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-finalizar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .produto-info {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 Livro Digital</h1>
            <p>Somos Todos Um</p>
        </div>

        <div class="produto-info">
            <div class="produto-icon">📚</div>
            <div class="produto-detalhes">
                <h2>Livro Digital: Somos Todos Um</h2>
                <p style="color: #666; margin-bottom: 10px;">Livro digital sobre unidade e espiritualidade</p>
                <div class="produto-preco">R$ 47,00</div>
            </div>
        </div>

        <div id="parceiro-info" class="parceiro-info">
            <div class="loading active">
                <div class="spinner"></div>
                <p>Verificando parceiro...</p>
            </div>
        </div>

        <div class="form-section">
            <div id="alertContainer"></div>

            <form id="checkoutForm">
                <h3 style="margin-bottom: 20px; color: #333;">Dados do Comprador</h3>

                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <h3 style="margin: 30px 0 20px 0; color: #333;">Endereço</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                    </div>
                    <div class="form-group">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" name="numero" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço *</label>
                    <input type="text" id="endereco" name="endereco" required>
                </div>

                <div class="form-group">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <input type="text" id="estado" name="estado" maxlength="2" placeholder="GO" required>
                </div>

                <button type="submit" class="btn-finalizar" id="btnFinalizar">
                    Finalizar Compra
                </button>

                <div class="loading" id="loadingPagamento">
                    <div class="spinner"></div>
                    <p>Processando pagamento...</p>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // ============================================
        // CONFIGURAÇÕES
        // ============================================
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM';
        const MERCADOPAGO_PUBLIC_KEY = 'TEST-3c85afff-0b3a-4907-855c-742b90d6cfce';
        const PRECO_PRODUTO = 47.00;
        const PRODUTO_ID = '00000000-0000-0000-0000-000000000001';

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const mp = new MercadoPago(MERCADOPAGO_PUBLIC_KEY);

        console.log('✅ Supabase e Mercado Pago inicializados');

        // Elementos do DOM
        const parceiroInfo = document.getElementById('parceiro-info');
        const checkoutForm = document.getElementById('checkoutForm');
        const btnFinalizar = document.getElementById('btnFinalizar');
        const loadingPagamento = document.getElementById('loadingPagamento');
        const alertContainer = document.getElementById('alertContainer');

        // Variáveis globais
        let parceiroAtual = null;
        let codigoParceiro = null;

        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        function mostrarAlerta(mensagem, tipo = 'error') {
            alertContainer.innerHTML = `
                <div class="alert alert-${tipo}">
                    ${mensagem}
                </div>
            `;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        function formatarCPF(cpf) {
            return cpf.replace(/\D/g, '')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        }

        function formatarTelefone(telefone) {
            return telefone.replace(/\D/g, '')
                .replace(/(\d{2})(\d)/, '($1) $2')
                .replace(/(\d{5})(\d)/, '$1-$2');
        }

        function formatarCEP(cep) {
            return cep.replace(/\D/g, '')
                .replace(/(\d{5})(\d)/, '$1-$2');
        }

        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length !== 11) return false;
            return true;
        }

        function validarEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // ============================================
        // BUSCAR PARCEIRO
        // ============================================
        async function buscarParceiro() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                codigoParceiro = urlParams.get('ref');

                console.log('🔍 Código do parceiro:', codigoParceiro);

                if (!codigoParceiro) {
                    parceiroInfo.innerHTML = `
                        <div style="color: #856404; padding: 15px;">
                            ℹ️ Nenhum parceiro indicou esta compra
                        </div>
                    `;
                    return;
                }

                const { data: parceiro, error } = await supabase
                    .from('parceiros')
                    .select('*')
                    .eq('codigo_parceiro', codigoParceiro)
                    .eq('status', 'ativo')
                    .single();

                if (error || !parceiro) {
                    console.error('❌ Erro ao buscar parceiro:', error);
                    parceiroInfo.className = 'parceiro-info erro';
                    parceiroInfo.innerHTML = `
                        <div>
                            ⚠️ Parceiro não encontrado<br>
                            <small>O código de parceiro informado não é válido ou está inativo.</small>
                        </div>
                    `;
                    return;
                }

                console.log('✅ Parceiro encontrado:', parceiro);
                parceiroAtual = parceiro;

                parceiroInfo.className = 'parceiro-info sucesso';
                parceiroInfo.innerHTML = `
                    <div>
                        ✅ Você está comprando através da indicação de <strong>${parceiro.nome_completo}</strong><br>
                        <small>Este parceiro receberá ${parceiro.comissao_padrao || 30}% de comissão pela sua compra</small>
                    </div>
                `;

            } catch (error) {
                console.error('❌ Erro:', error);
                parceiroInfo.className = 'parceiro-info erro';
                parceiroInfo.innerHTML = `
                    <div>
                        ❌ Erro ao verificar parceiro<br>
                        <small>${error.message}</small>
                    </div>
                `;
            }
        }

        // ============================================
        // MÁSCARAS DE ENTRADA
        // ============================================
        document.getElementById('cpf').addEventListener('input', (e) => {
            e.target.value = formatarCPF(e.target.value);
        });

        document.getElementById('telefone').addEventListener('input', (e) => {
            e.target.value = formatarTelefone(e.target.value);
        });

        document.getElementById('cep').addEventListener('input', (e) => {
            e.target.value = formatarCEP(e.target.value);
        });

        // ============================================
        // BUSCAR CEP
        // ============================================
        document.getElementById('cep').addEventListener('blur', async (e) => {
            const cep = e.target.value.replace(/\D/g, '');
            
            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    
                    if (!data.erro) {
                        document.getElementById('endereco').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('estado').value = data.uf;
                        document.getElementById('numero').focus();
                    }
                } catch (error) {
                    console.error('Erro ao buscar CEP:', error);
                }
            }
        });

        // ============================================
        // PROCESSAR CHECKOUT
        // ============================================
        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validações
            const cpf = document.getElementById('cpf').value;
            const email = document.getElementById('email').value;

            if (!validarCPF(cpf)) {
                mostrarAlerta('CPF inválido', 'error');
                return;
            }

            if (!validarEmail(email)) {
                mostrarAlerta('Email inválido', 'error');
                return;
            }

            // Desabilitar botão
            btnFinalizar.disabled = true;
            loadingPagamento.classList.add('active');

            try {
                // Coletar dados do formulário
                const dadosVenda = {
                    nome_comprador: document.getElementById('nome').value,
                    email_comprador: document.getElementById('email').value,
                    telefone_comprador: document.getElementById('telefone').value.replace(/\D/g, ''),
                    cpf_comprador: document.getElementById('cpf').value.replace(/\D/g, ''),
                    cep_comprador: document.getElementById('cep').value.replace(/\D/g, ''),
                    endereco_comprador: document.getElementById('endereco').value,
                    numero_comprador: document.getElementById('numero').value,
                    complemento_comprador: document.getElementById('complemento').value,
                    bairro_comprador: document.getElementById('bairro').value,
                    cidade_comprador: document.getElementById('cidade').value,
                    estado_comprador: document.getElementById('estado').value,
                    valor_total: PRECO_PRODUTO,
                    produto_id: PRODUTO_ID,
                    parceiro_id: parceiroAtual ? parceiroAtual.id : null,
                    comissao_percentual: parceiroAtual ? (parceiroAtual.comissao_padrao || 30) : 0,
                    comissao_valor: parceiroAtual ? (PRECO_PRODUTO * (parceiroAtual.comissao_padrao || 30) / 100) : 0,
                    status_pagamento: 'pendente',
                    created_at: new Date().toISOString()
                };

                console.log('📊 Dados da venda:', dadosVenda);

                // Registrar venda no Supabase
                const { data: vendaRegistrada, error: erroVenda } = await supabase
                    .from('vendas')
                    .insert([dadosVenda])
                    .select()
                    .single();

                if (erroVenda) throw erroVenda;

                console.log('✅ Venda registrada:', vendaRegistrada);

                // Criar preferência do Mercado Pago via Edge Function
                console.log('💳 Criando preferência no Mercado Pago via Edge Function...');

                const edgeFunctionUrl = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co/functions/v1/create-mercadopago-preference';

                const preferenceResponse = await fetch(edgeFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        vendaId: vendaRegistrada.id,
                        dadosVenda: dadosVenda
                    })
                });

                if (!preferenceResponse.ok) {
                    const errorData = await preferenceResponse.json();
                    throw new Error(`Erro ao criar preferência: ${errorData.error || 'Erro desconhecido'}`);
                }

                const preferenceData = await preferenceResponse.json();
                console.log('✅ Preferência criada:', preferenceData);

                // Redirecionar para o Mercado Pago
                if (preferenceData.success && preferenceData.init_point) {
                    console.log('🔄 Redirecionando para pagamento...');
                    window.location.href = preferenceData.init_point;
                } else {
                    throw new Error('Erro ao obter link de pagamento');
                }

            } catch (error) {
                console.error('❌ Erro:', error);
                mostrarAlerta('Erro ao processar pedido: ' + error.message, 'error');
                btnFinalizar.disabled = false;
                loadingPagamento.classList.remove('active');
            }
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        buscarParceiro();
    </script>
</body>
</html>
