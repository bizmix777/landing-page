<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .debug {
            background: #fff;
            border: 2px solid #333;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .debug h3 {
            margin-top: 0;
            color: #333;
        }
        .log {
            background: #f0f0f0;
            padding: 10px;
            margin: 5px 0;
            border-left: 4px solid #4CAF50;
            font-family: monospace;
            font-size: 14px;
        }
        .error {
            border-left-color: #f44336;
            background: #ffebee;
        }
        .success {
            border-left-color: #4CAF50;
            background: #e8f5e9;
        }
        .warning {
            border-left-color: #ff9800;
            background: #fff3e0;
        }
    </style>
</head>
<body>
    <div class="debug">
        <h3>🔍 Debug do Checkout</h3>
        <div id="logs"></div>
    </div>

    <script>
        // Função para adicionar logs visíveis
        function addLog(message, type = 'log') {
            const logsDiv = document.getElementById('logs');
            const logElement = document.createElement('div');
            logElement.className = `log ${type}`;
            logElement.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logsDiv.appendChild(logElement);
            console.log(message); // Também tenta no console
        }

        addLog('✅ Página carregada', 'success');
        addLog('🔍 Iniciando testes...', 'log');

        // Teste 1: Verificar parâmetro ref
        const urlParams = new URLSearchParams(window.location.search);
        const codigoParceiro = urlParams.get('ref');
        addLog(`📋 Código do parceiro: ${codigoParceiro || 'NÃO ENCONTRADO'}`, codigoParceiro ? 'success' : 'error');

        // Teste 2: Carregar Supabase
        addLog('📦 Carregando Supabase...', 'log');
        
        const script = document.createElement('script');
        script.type = 'module';
        script.textContent = `
            import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
            
            window.addLog('✅ Supabase SDK carregado', 'success');
            
            const supabase = createClient(
                'https://zofxhfbjgvpbqjtlkbbk.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM'
            );
            
            window.addLog('🔗 Supabase client criado', 'success');
            
            // Buscar parceiro
            const codigoParceiro = '${codigoParceiro}';
            
            if (!codigoParceiro) {
                window.addLog('❌ Código do parceiro não fornecido', 'error');
            } else {
                window.addLog('🔍 Buscando parceiro: ' + codigoParceiro, 'log');
                
                try {
                    const { data, error } = await supabase
                        .from('parceiros')
                        .select('*')
                        .eq('codigo_parceiro', codigoParceiro)
                        .eq('status', 'ativo')
                        .single();
                    
                    if (error) {
                        window.addLog('❌ Erro ao buscar parceiro: ' + error.message, 'error');
                        window.addLog('📊 Detalhes: ' + JSON.stringify(error), 'error');
                    } else if (!data) {
                        window.addLog('⚠️ Parceiro não encontrado', 'warning');
                    } else {
                        window.addLog('✅ Parceiro encontrado: ' + data.nome_completo, 'success');
                        window.addLog('📊 Comissão: ' + data.comissao_padrao + '%', 'success');
                        window.addLog('📊 ID: ' + data.id, 'log');
                    }
                } catch (err) {
                    window.addLog('❌ Erro na busca: ' + err.message, 'error');
                }
            }
        `;
        
        script.onerror = function() {
            addLog('❌ Erro ao carregar script do Supabase', 'error');
        };
        
        document.head.appendChild(script);
        
        addLog('📝 Script adicionado ao documento', 'log');
        
        // Disponibilizar addLog globalmente
        window.addLog = addLog;
    </script>
</body>
</html>
