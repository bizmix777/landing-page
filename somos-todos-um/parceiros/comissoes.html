<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comissões - TESTE - Biz Mix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            padding: 40px;
        }
        .debug {
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .debug h3 {
            color: #10b981;
            margin-bottom: 10px;
        }
        .debug pre {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            color: #6ee7b7;
        }
        .btn {
            padding: 12px 24px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>🔍 DIAGNÓSTICO - Comissões</h1>
    
    <div class="debug">
        <h3>1. LocalStorage - parceiro_logado:</h3>
        <pre id="localStorageData">Carregando...</pre>
    </div>

    <div class="debug">
        <h3>2. Dados Parseados:</h3>
        <pre id="parsedData">Carregando...</pre>
    </div>

    <div class="debug">
        <h3>3. Status:</h3>
        <pre id="status">Carregando...</pre>
    </div>

    <div>
        <button class="btn" onclick="irParaDashboard()">← Voltar ao Dashboard</button>
        <button class="btn" onclick="irParaLogin()">Ir para Login</button>
        <button class="btn" onclick="limparStorage()">Limpar Storage</button>
    </div>

    <script>
        // TESTE 1: Verificar localStorage
        const parceiroLogado = localStorage.getItem('parceiro_logado')
        document.getElementById('localStorageData').textContent = parceiroLogado || 'VAZIO - Nenhum dado encontrado'

        // TESTE 2: Tentar parsear
        let parceiroAtual = null
        let parseError = null
        
        if (parceiroLogado) {
            try {
                parceiroAtual = JSON.parse(parceiroLogado)
                document.getElementById('parsedData').textContent = JSON.stringify(parceiroAtual, null, 2)
            } catch (error) {
                parseError = error.message
                document.getElementById('parsedData').textContent = 'ERRO AO PARSEAR: ' + error.message
            }
        } else {
            document.getElementById('parsedData').textContent = 'Não há dados para parsear'
        }

        // TESTE 3: Status final
        let statusMsg = ''
        if (!parceiroLogado) {
            statusMsg = '❌ PROBLEMA: localStorage está vazio\n'
            statusMsg += 'AÇÃO: Será redirecionado para login.html\n'
            statusMsg += 'SOLUÇÃO: Faça login novamente'
        } else if (parseError) {
            statusMsg = '❌ PROBLEMA: Erro ao parsear JSON\n'
            statusMsg += 'ERRO: ' + parseError + '\n'
            statusMsg += 'SOLUÇÃO: Limpe o storage e faça login novamente'
        } else if (parceiroAtual) {
            statusMsg = '✅ SUCESSO: Dados do parceiro carregados corretamente\n'
            statusMsg += 'ID: ' + parceiroAtual.id + '\n'
            statusMsg += 'Nome: ' + parceiroAtual.nome + '\n'
            statusMsg += 'E-mail: ' + parceiroAtual.email + '\n'
            statusMsg += 'Código: ' + parceiroAtual.codigo + '\n'
            statusMsg += 'Comissão: ' + parceiroAtual.comissao + '%\n'
            statusMsg += '\n✅ A página deveria funcionar normalmente'
        }

        document.getElementById('status').textContent = statusMsg

        // Funções auxiliares
        function irParaDashboard() {
            window.location.href = 'dashboard.html'
        }

        function irParaLogin() {
            window.location.href = 'login.html'
        }

        function limparStorage() {
            localStorage.removeItem('parceiro_logado')
            sessionStorage.clear()
            alert('✅ Storage limpo! Faça login novamente.')
            window.location.href = 'login.html'
        }

        // Log no console
        console.log('=== DIAGNÓSTICO COMISSÕES ===')
        console.log('localStorage:', parceiroLogado)
        console.log('Parseado:', parceiroAtual)
        console.log('Status:', statusMsg)
    </script>
</body>
</html>
