<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout PIX - BizMix</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; }
        p { text-align: center; color: #666; margin-bottom: 30px; }
        .price { font-size: 36px; color: #764ba2; text-align: center; font-weight: bold; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        input:focus { border-color: #667eea; outline: none; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #667eea; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #5568d3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .message { padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; display: none; }
        .message.show { display: block; }
        .message.loading { background: #eef2ff; color: #667eea; }
        .message.error { background: #ffebeb; color: #d9534f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Checkout PIX</h1>
        <p>Livro Digital - Somos Todos Um</p>
        <div class="price">R$ 47,00</div>

        <form id="checkoutForm">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="XXX.XXX.XXX-XX" required>
            </div>
            <button type="submit" class="btn" id="btnSubmit">Gerar PIX</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        (function() {
            console.log('🚀 Checkout PIX iniciado');

            // Configuração (usando variável local com nome único)
            const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY3MTc1NzMsImV4cCI6MjA1MjI5MzU3M30.kHXn2pCMqGdNzxKPTUGIRdJI0Ow-Ks6gxLBLSvXaR_4';
            
            // Usando variável local dentro de IIFE para evitar conflitos
            const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            console.log('✅ Supabase inicializado');

            const urlParams = new URLSearchParams(window.location.search);
            const affiliateCode = urlParams.get('ref') || null;
            console.log('🔍 Código afiliado:', affiliateCode);

            const form = document.getElementById('checkoutForm');
            const btnSubmit = document.getElementById('btnSubmit');
            const message = document.getElementById('message');

            function showMessage(text, type) {
                message.textContent = text;
                message.className = `message show ${type}`;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('📝 Formulário enviado');

                btnSubmit.disabled = true;
                showMessage('Processando...', 'loading');

                const nome = document.getElementById('nome').value;
                const email = document.getElementById('email').value;
                const telefone = document.getElementById('telefone').value;
                const cpf = document.getElementById('cpf').value;

                console.log('📊 Dados:', { nome, email, telefone, cpf });

                try {
                    console.log('💾 Criando venda no Supabase...');

                    const { data, error } = await db
                        .from('vendas')
                        .insert({
                            nome_comprador: nome,
                            email_comprador: email,
                            telefone_comprador: telefone,
                            cpf_comprador: cpf,
                            valor_total: 47.00,
                            valor_comissao: 14.10,
                            status_pagamento: 'pending',
                            forma_pagamento: 'pix',
                            codigo_indicacao: affiliateCode,
                            data_venda: new Date().toISOString()
                        })
                        .select()
                        .single();

                    if (error) {
                        console.error('❌ Erro Supabase:', error);
                        throw error;
                    }

                    console.log('✅ Venda criada:', data.id);
                    console.log('🔄 Redirecionando para PIX...');

                    const redirectUrl = `/somos-todos-um/parceiros/pagamento-pix.html?venda_id=${data.id}`;
                    console.log('🔗 URL:', redirectUrl);
                    
                    window.location.href = redirectUrl;

                } catch (error) {
                    console.error('❌ Erro:', error);
                    showMessage('Erro: ' + error.message, 'error');
                    btnSubmit.disabled = false;
                }
            });

            // Máscaras
            document.getElementById('telefone').addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
                v = v.replace(/(\d)(\d{4})$/, "$1-$2");
                e.target.value = v;
            });

            document.getElementById('cpf').addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                v = v.replace(/(\d{3})(\d)/, "$1.$2");
                v = v.replace(/(\d{3})(\d)/, "$1.$2");
                v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
                e.target.value = v;
            });

            console.log('✅ Checkout pronto!');
        })();
    </script>
</body>
</html>
