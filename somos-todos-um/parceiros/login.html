<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal do Parceiro</title>
    <link rel="stylesheet" href="css/modern-style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .login-footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Portal do Parceiro</h1>
            <p>Faça login para acessar sua área</p>
        </div>

        <div class="login-body">
            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    Entrar
                </button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px; color: #666;">Autenticando...</p>
                </div>
            </form>
        </div>

        <div class="login-footer">
            <p>Ainda não é parceiro? <a href="registro.html">Cadastre-se aqui</a></p>
        </div>
    </div>

    <!-- Supabase Client -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Configuração do Supabase
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('✅ Supabase Client inicializado');

        // Elementos do DOM
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const loading = document.getElementById('loading');
        const alertContainer = document.getElementById('alertContainer');

        // Função para mostrar alertas
        function mostrarAlerta(mensagem, tipo = 'error') {
            alertContainer.innerHTML = `
                <div class="alert alert-${tipo}">
                    ${mensagem}
                </div>
            `;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Verificar se já está logado
        async function verificarSessao() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                console.log('✅ Sessão ativa encontrada, redirecionando...');
                window.location.href = 'dashboard.html';
            }
        }

        verificarSessao();

        // Handler do formulário de login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            console.log('🔐 Tentando fazer login com:', email);

            // Validações básicas
            if (!email || !senha) {
                mostrarAlerta('Por favor, preencha todos os campos.', 'error');
                return;
            }

            // Desabilitar botão e mostrar loading
            btnLogin.disabled = true;
            btnLogin.textContent = 'Entrando...';
            loading.classList.add('active');

            try {
                // Tentar autenticar com Supabase Auth
                console.log('📡 Autenticando via Supabase Auth...');
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: senha,
                });

                if (error) {
                    console.error('❌ Erro na autenticação:', error);
                    throw new Error(error.message);
                }

                console.log('✅ Autenticação bem-sucedida!');
                console.log('👤 Usuário:', data.user);

                // Buscar dados do parceiro
                console.log('📊 Buscando dados do parceiro...');
                
                const { data: parceiro, error: parceiroError } = await supabase
                    .from('parceiros')
                    .select('*')
                    .eq('auth_user_id', data.user.id)
                    .single();

                if (parceiroError) {
                    console.error('❌ Erro ao buscar parceiro:', parceiroError);
                    throw new Error('Parceiro não encontrado no sistema.');
                }

                console.log('✅ Dados do parceiro carregados:', parceiro);

                // Verificar se o parceiro está ativo
                if (parceiro.status !== 'ativo') {
                    throw new Error('Sua conta está inativa. Entre em contato com o suporte.');
                }

                // Atualizar último acesso
                await supabase
                    .from('parceiros')
                    .update({ ultimo_acesso: new Date().toISOString() })
                    .eq('id', parceiro.id);

                // Salvar dados no localStorage (para compatibilidade)
                localStorage.setItem('parceiro', JSON.stringify({
                    id: parceiro.id,
                    nome: parceiro.nome_completo,
                    email: parceiro.email,
                    codigo: parceiro.codigo_parceiro,
                    tipo: parceiro.tipo_parceiro,
                    comissao: parceiro.comissao_percentual || 30
                }));

                console.log('✅ Dados salvos no localStorage');

                // Mostrar sucesso
                mostrarAlerta('Login realizado com sucesso! Redirecionando...', 'success');

                // Redirecionar para o dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('❌ Erro no login:', error);
                
                let mensagemErro = 'Erro ao fazer login. Verifique suas credenciais.';
                
                if (error.message.includes('Invalid login credentials')) {
                    mensagemErro = 'Email ou senha incorretos.';
                } else if (error.message.includes('Email not confirmed')) {
                    mensagemErro = 'Por favor, confirme seu email antes de fazer login.';
                } else if (error.message.includes('Parceiro não encontrado')) {
                    mensagemErro = 'Usuário não cadastrado como parceiro.';
                } else if (error.message.includes('inativa')) {
                    mensagemErro = error.message;
                }

                mostrarAlerta(mensagemErro, 'error');

                // Reabilitar botão
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar';
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
