<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área do Parceiro - Biz Mix</title>
    <link rel="stylesheet" href="css/modern-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="images/logo_par.png" alt="Biz Mix" class="logo-image">
            <p>Área do Parceiro</p>
        </div>

        <div class="card">
            <h2>🔐 Login</h2>
            <p class="subtitle">Entre com suas credenciais para acessar sua área</p>

            <div class="logged-in-box" id="loggedInBox">
                <p>✅ Você já está logado como: <strong id="nomeLogado"></strong></p>
                <div class="btn-group">
                    <button class="btn" onclick="irParaDashboard()">📊 Ir para Dashboard</button>
                    <button class="btn btn-secondary" onclick="fazerLogout()">🚪 Trocar de Conta</button>
                </div>
            </div>

            <div class="alert alert-error" id="alertError">
                ❌ E-mail ou senha incorretos
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha" required>
                </div>

                <button type="submit" class="btn" id="btnLogin">
                    🚀 Entrar
                </button>
            </form>

            <div class="login-link">
                Não tem uma conta? <a href="registro.html">Cadastre-se gratuitamente</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co'
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM'
            
            const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

            window.addEventListener('DOMContentLoaded', () => {
                const parceiroLogado = localStorage.getItem('parceiro_logado')
                
                if (parceiroLogado) {
                    const parceiro = JSON.parse(parceiroLogado)
                    document.getElementById('nomeLogado').textContent = parceiro.nome
                    document.getElementById('loggedInBox').style.display = 'block'
                }
            })

            document.getElementById('formLogin').addEventListener('submit', async (e) => {
                e.preventDefault()
                await realizarLogin()
            })

            async function realizarLogin() {
                try {
                    const btnLogin = document.getElementById('btnLogin')
                    btnLogin.disabled = true
                    btnLogin.textContent = '⏳ Entrando...'

                    const email = document.getElementById('email').value.toLowerCase()
                    const senha = document.getElementById('senha').value

                    const senhaHash = await gerarHashSenha(senha)

                    const { data: parceiro, error } = await clienteSupabase
                        .from('parceiros')
                        .select('*')
                        .eq('email', email)
                        .eq('senha_hash', senhaHash)
                        .single()

                    if (error || !parceiro) {
                        throw new Error('E-mail ou senha incorretos')
                    }

                    if (parceiro.status !== 'ativo') {
                        throw new Error('Sua conta está inativa. Entre em contato com o suporte.')
                    }

                    await clienteSupabase
                        .from('parceiros')
                        .update({ ultimo_acesso: new Date().toISOString() })
                        .eq('id', parceiro.id)

                    const dadosLogin = {
                        id: parceiro.id,
                        nome: parceiro.nome_completo,
                        email: parceiro.email,
                        codigo: parceiro.codigo_parceiro,
                        tipo: parceiro.tipo_parceiro,
                        comissao: parceiro.comissao_padrao
                    }

                    localStorage.setItem('parceiro_logado', JSON.stringify(dadosLogin))

                    console.log('✅ Login realizado:', dadosLogin)

                    window.location.href = 'dashboard.html'

                } catch (error) {
                    console.error('❌ Erro ao fazer login:', error)
                    
                    const alertError = document.getElementById('alertError')
                    alertError.textContent = '❌ ' + error.message
                    alertError.style.display = 'block'

                    setTimeout(() => {
                        alertError.style.display = 'none'
                    }, 5000)

                    const btnLogin = document.getElementById('btnLogin')
                    btnLogin.disabled = false
                    btnLogin.textContent = '🚀 Entrar'
                }
            }

            async function gerarHashSenha(senha) {
                const encoder = new TextEncoder()
                const data = encoder.encode(senha)
                const hashBuffer = await crypto.subtle.digest('SHA-256', data)
                const hashArray = Array.from(new Uint8Array(hashBuffer))
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('')
                return hashHex
            }

            window.irParaDashboard = function() {
                window.location.href = 'dashboard.html'
            }

            window.fazerLogout = function() {
                localStorage.removeItem('parceiro_logado')
                sessionStorage.clear()
                document.getElementById('loggedInBox').style.display = 'none'
                document.getElementById('email').value = ''
                document.getElementById('senha').value = ''
                document.getElementById('email').focus()
            }
        })()
    </script>
</body>
</html>
