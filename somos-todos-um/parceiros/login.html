<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área do Parceiro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #fee;
            border-left: 4px solid #d32f2f;
            color: #c62828;
        }

        .alert-info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f5576c;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .logged-in-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .logged-in-box p {
            color: #1565c0;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .logged-in-box .btn-group {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .card {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🤝 Somos Todos Um</h1>
            <p>Área do Parceiro</p>
        </div>

        <div class="card">
            <h2>🔐 Login</h2>

            <div class="logged-in-box" id="loggedInBox">
                <p>✅ Você já está logado como: <strong id="nomeLogado"></strong></p>
                <div class="btn-group">
                    <button class="btn" onclick="irParaDashboard()">📊 Ir para Dashboard</button>
                    <button class="btn btn-secondary" onclick="fazerLogout()">🚪 Trocar de Conta</button>
                </div>
            </div>

            <div class="alert alert-error" id="alertError">
                ❌ E-mail ou senha incorretos
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha" required>
                </div>

                <button type="submit" class="btn" id="btnLogin">
                    🚀 Entrar
                </button>
            </form>

            <div class="register-link">
                Não tem uma conta? <a href="registro.html">Cadastre-se gratuitamente</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co'
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM'
            
            const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

            // Verificar se já está logado
            window.addEventListener('DOMContentLoaded', () => {
                const parceiroLogado = localStorage.getItem('parceiro_logado')
                
                if (parceiroLogado) {
                    const parceiro = JSON.parse(parceiroLogado)
                    document.getElementById('nomeLogado').textContent = parceiro.nome
                    document.getElementById('loggedInBox').style.display = 'block'
                }
            })

            // Função de login
            document.getElementById('formLogin').addEventListener('submit', async (e) => {
                e.preventDefault()
                await realizarLogin()
            })

            async function realizarLogin() {
                try {
                    const btnLogin = document.getElementById('btnLogin')
                    btnLogin.disabled = true
                    btnLogin.textContent = '⏳ Entrando...'

                    const email = document.getElementById('email').value.toLowerCase()
                    const senha = document.getElementById('senha').value

                    // Gerar hash da senha
                    const senhaHash = await gerarHashSenha(senha)

                    // Buscar parceiro no banco
                    const { data: parceiro, error } = await clienteSupabase
                        .from('parceiros')
                        .select('*')
                        .eq('email', email)
                        .eq('senha_hash', senhaHash)
                        .single()

                    if (error || !parceiro) {
                        throw new Error('E-mail ou senha incorretos')
                    }

                    // Verificar se está ativo
                    if (parceiro.status !== 'ativo') {
                        throw new Error('Sua conta está inativa. Entre em contato com o suporte.')
                    }

                    // Atualizar último acesso
                    await clienteSupabase
                        .from('parceiros')
                        .update({ ultimo_acesso: new Date().toISOString() })
                        .eq('id', parceiro.id)

                    // Salvar no localStorage
                    const dadosLogin = {
                        id: parceiro.id,
                        nome: parceiro.nome_completo,
                        email: parceiro.email,
                        codigo: parceiro.codigo_parceiro,
                        tipo: parceiro.tipo_parceiro,
                        comissao: parceiro.comissao_padrao
                    }

                    localStorage.setItem('parceiro_logado', JSON.stringify(dadosLogin))

                    console.log('✅ Login realizado:', dadosLogin)

                    // Redirecionar para dashboard
                    window.location.href = 'dashboard.html'

                } catch (error) {
                    console.error('❌ Erro ao fazer login:', error)
                    
                    const alertError = document.getElementById('alertError')
                    alertError.textContent = '❌ ' + error.message
                    alertError.style.display = 'block'

                    setTimeout(() => {
                        alertError.style.display = 'none'
                    }, 5000)

                    const btnLogin = document.getElementById('btnLogin')
                    btnLogin.disabled = false
                    btnLogin.textContent = '🚀 Entrar'
                }
            }

            async function gerarHashSenha(senha) {
                const encoder = new TextEncoder()
                const data = encoder.encode(senha)
                const hashBuffer = await crypto.subtle.digest('SHA-256', data)
                const hashArray = Array.from(new Uint8Array(hashBuffer))
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('')
                return hashHex
            }

            // Funções globais
            window.irParaDashboard = function() {
                window.location.href = 'dashboard.html'
            }

            window.fazerLogout = function() {
                localStorage.removeItem('parceiro_logado')
                sessionStorage.clear()
                document.getElementById('loggedInBox').style.display = 'none'
                document.getElementById('email').value = ''
                document.getElementById('senha').value = ''
                document.getElementById('email').focus()
            }
        })()
    </script>
</body>
</html>
