<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal do Parceiro</title>
    <link rel="stylesheet" href="css/modern-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Basic Reset & Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Gradient background */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        /* Login Container for Centering */
        .login-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Login Card Styling */
        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        /* Logo Styling */
        .logo {
            max-width: 150px;
            margin-bottom: 30px;
        }

        /* Heading Styling */
        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
        }

        /* Input Group Styling */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        /* Button Styling */
        .primary-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: 600;
            margin-top: 20px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .primary-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Error Message Styling */
        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none; /* Hidden by default */
            font-size: 14px;
            text-align: left;
        }

        /* Links Group Styling */
        .links-group {
            margin-top: 25px;
        }

        .secondary-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            margin: 10px 0;
            display: block;
            transition: color 0.3s ease;
        }

        .secondary-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Footer Styling */
        footer {
            margin-top: auto; /* Pushes footer to the bottom */
            padding: 20px;
            color: #ffffff;
            text-align: center;
            font-size: 13px;
            opacity: 0.8;
            width: 100%;
            box-sizing: border-box;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .login-card {
                padding: 30px 20px;
                margin: 0 15px;
            }
            h2 {
                font-size: 22px;
            }
            .primary-button {
                font-size: 16px;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <img src="images/logo_par.png" alt="Logo BizMix" class="logo">
            <h2>Login de Parceiro</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <div id="error-message" class="error-message"></div>
                <button type="submit" class="primary-button">Entrar</button>
            </form>
            <div class="links-group">
                <a href="esqueci-senha.html" class="secondary-link">Esqueci minha senha</a>
                <a href="registro.html" class="secondary-link">Cadastrar-se</a>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 BizMix - Somos Todos Um. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.dCjZSX2ridOVxJTaIG3lLXLnhWMQPZjxT-vYgBBHjOw';
        
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Check if already logged in
        async function checkAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    // If a session exists, redirect to the dashboard
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Erro ao verificar sessão:', error);
                // Optionally show a message, but don't block login
            }
        }
        
        // Call checkAuth on page load
        document.addEventListener('DOMContentLoaded', checkAuth);
        
        // Login function
        async function handleLogin(event) {
            event.preventDefault(); // Prevent default form submission
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Clear previous errors
            showError(''); 

            try {
                // 1. Sign in with Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) {
                    // Map common Supabase Auth errors to user-friendly messages
                    if (authError.message.includes('Invalid login credentials')) {
                        throw new Error('Email ou senha inválidos. Por favor, tente novamente.');
                    }
                    throw authError; // Re-throw other auth errors
                }

                // Ensure user data is available after successful login
                if (!authData || !authData.user) {
                    throw new Error('Falha ao obter dados do usuário após o login.');
                }

                const userId = authData.user.id;
                
                // 2. Get parceiro data from 'parceiros' table using the authenticated user's ID
                const { data: parceiro, error: parceiroError } = await supabase
                    .from('parceiros')
                    .select('id, nome_completo, email, codigo_parceiro, tipo_parceiro, comissao_padrao, status')
                    .eq('auth_user_id', userId) // Assuming auth_user_id links to auth.users.id
                    .single();
                
                if (parceiroError) {
                    // If parceiro not found, it might mean the user exists in auth.users but not in 'parceiros'
                    // Or RLS is blocking access.
                    console.error('Erro ao buscar dados do parceiro:', parceiroError);
                    // To prevent orphaned auth.users, you might want to sign out here
                    await supabase.auth.signOut();
                    throw new Error('Não foi possível encontrar seu perfil de parceiro. Entre em contato com o suporte.');
                }
                
                // 3. Check if parceiro is active
                if (parceiro.status !== 'ativo') {
                    // If not active, sign out the user from Supabase Auth
                    await supabase.auth.signOut();
                    throw new Error('Sua conta ainda não foi aprovada ou está inativa. Entre em contato com o suporte.');
                }
                
                // 4. Update last access in 'parceiros' table
                const { error: updateError } = await supabase
                    .from('parceiros')
                    .update({ ultimo_acesso: new Date().toISOString() })
                    .eq('id', parceiro.id); // Update using the parceiro's ID
                
                if (updateError) {
                    console.warn('Aviso: Falha ao atualizar último acesso do parceiro:', updateError.message);
                    // This is a non-critical error, so we don't block login
                }
                
                // 5. Redirect to dashboard
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                console.error('Erro no login:', error);
                showError(error.message || 'Ocorreu um erro inesperado. Tente novamente.');
            }
        }
        
        // Function to display error messages
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            if (message) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            } else {
                errorDiv.textContent = '';
                errorDiv.style.display = 'none';
            }
        }

        // Attach event listener to the form
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
