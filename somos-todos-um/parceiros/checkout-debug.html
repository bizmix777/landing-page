<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout PIX - DEBUG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; }
        p { text-align: center; color: #666; margin-bottom: 30px; }
        .price { font-size: 36px; color: #764ba2; text-align: center; font-weight: bold; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        input:focus { border-color: #667eea; outline: none; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #667eea; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #5568d3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .debug { background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Checkout PIX - DEBUG</h1>
        <p>Livro Digital - Somos Todos Um</p>
        <div class="price">R$ 47,00</div>

        <form id="checkoutForm">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" value="Teste Debug" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" value="teste@debug.com" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="tel" id="telefone" value="(11) 99999-9999" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" value="123.456.789-09" required>
            </div>
            <button type="submit" class="btn" id="btnSubmit">Gerar PIX</button>
        </form>

        <div id="debug" class="debug"></div>
    </div>

    <script>
        const debugDiv = document.getElementById('debug');
        
        function log(msg) {
            console.log(msg);
            debugDiv.innerHTML += msg + '<br>';
        }

        log('🚀 INÍCIO DO SCRIPT');
        log('📍 URL atual: ' + window.location.href);
        log('📍 Pathname: ' + window.location.pathname);

        const urlParams = new URLSearchParams(window.location.search);
        const affiliateCode = urlParams.get('ref');
        log('🔍 Código afiliado: ' + (affiliateCode || 'NENHUM'));

        const form = document.getElementById('checkoutForm');
        const btnSubmit = document.getElementById('btnSubmit');

        log('✅ Elementos encontrados');
        log('✅ Form: ' + (form ? 'OK' : 'ERRO'));
        log('✅ Button: ' + (btnSubmit ? 'OK' : 'ERRO'));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            log('📝 FORMULÁRIO ENVIADO!');

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;
            const cpf = document.getElementById('cpf').value;

            log('📊 Nome: ' + nome);
            log('📊 Email: ' + email);
            log('📊 Telefone: ' + telefone);
            log('📊 CPF: ' + cpf);

            // TESTE: Redirecionar SEM criar venda
            const vendaIdTeste = 'teste-' + Date.now();
            const redirectUrl = '/somos-todos-um/parceiros/pagamento-pix.html?venda_id=' + vendaIdTeste;
            
            log('🔗 URL de redirecionamento: ' + redirectUrl);
            log('⏳ Aguardando 2 segundos...');

            setTimeout(() => {
                log('🔄 REDIRECIONANDO AGORA!');
                window.location.href = redirectUrl;
            }, 2000);
        });

        log('✅ Event listener adicionado');
        log('✅ SCRIPT COMPLETO!');
    </script>
</body>
</html>
