<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Parceiro - Biz Mix</title>
    <meta name="description" content="Cadastre-se como parceiro e comece a ganhar comissões">
    <meta name="robots" content="index, follow">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 150px;
            height: auto;
        }

        h1 {
            color: #1f2937;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .alert {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .alert.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: #ef4444;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group small {
            display: block;
            color: #6b7280;
            font-size: 12px;
            margin-top: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #6b7280;
            font-size: 14px;
            position: relative;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #f3f4f6;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #374151;
            font-size: 13px;
            line-height: 1.6;
            margin: 0;
        }

        .info-box strong {
            color: #1f2937;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../images/logo_par.png" alt="Biz Mix" onerror="this.style.display='none'">
        </div>

        <h1>🤝 Cadastro de Parceiro</h1>
        <p class="subtitle">Torne-se um parceiro e comece a ganhar comissões</p>

        <div class="info-box">
            <p><strong>💡 Como funciona:</strong></p>
            <p>Cadastre-se gratuitamente, receba seu link exclusivo e ganhe comissões sobre cada venda realizada através dele!</p>
        </div>

        <div id="alertContainer"></div>

        <form id="formCadastro">
            <div class="form-group">
                <label for="nome">Nome Completo <span class="required">*</span></label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="seu@email.com">
                <small>Será usado para login</small>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp <span class="required">*</span></label>
                <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label for="senha">Senha <span class="required">*</span></label>
                <input type="password" id="senha" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>

            <div class="form-group">
                <label for="senhaConfirm">Confirmar Senha <span class="required">*</span></label>
                <input type="password" id="senhaConfirm" required placeholder="Digite a senha novamente" minlength="6">
            </div>

            <div class="form-group">
                <label for="documento">CPF ou CNPJ <span class="required">*</span></label>
                <input type="text" id="documento" required placeholder="000.000.000-00">
                <small>Campo obrigatório</small>
            </div>

            <div class="form-group">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Sua cidade">
            </div>

            <div class="form-group">
                <label for="estado">Estado</label>
                <select id="estado">
                    <option value="">Selecione</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="btnCadastrar">
                🚀 Criar Minha Conta
            </button>
        </form>

        <div class="divider">
            <span>ou</span>
        </div>

        <div class="login-link">
            <p>Já tem uma conta? <a href="login.html">Fazer login</a></p>
        </div>
    </div>

    <script>
        console.log('🚀 Página de Cadastro de Parceiro - Iniciada');

        // Configuração do Supabase
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM';
        
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Formulário de cadastro
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnCadastrar = document.getElementById('btnCadastrar');
            btnCadastrar.disabled = true;
            btnCadastrar.textContent = '⏳ Criando conta...';
            
            try {
                // Validar dados
                const nome = document.getElementById('nome').value.trim();
                const email = document.getElementById('email').value.trim().toLowerCase();
                const telefone = document.getElementById('telefone').value.trim();
                const senha = document.getElementById('senha').value;
                const senhaConfirm = document.getElementById('senhaConfirm').value;
                const documento = document.getElementById('documento').value.trim();
                const cidade = document.getElementById('cidade').value.trim();
                const estado = document.getElementById('estado').value;
                
                // Validações
                if (!nome || !email || !telefone || !senha) {
                    throw new Error('Por favor, preencha todos os campos obrigatórios');
                }
                
                if (senha !== senhaConfirm) {
                    throw new Error('As senhas não coincidem');
                }
                
                if (senha.length < 6) {
                    throw new Error('A senha deve ter no mínimo 6 caracteres');
                }
                
                console.log('📝 Criando usuário na autenticação...');
                
                // 1. Criar usuário no Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: senha,
                    options: {
                        data: {
                            nome: nome,
                            telefone: telefone
                        }
                    }
                });
                
                if (authError) {
                    console.error('❌ Erro na autenticação:', authError);
                    throw authError;
                }
                
                console.log('✅ Usuário criado na autenticação:', authData);
                
                // 2. Gerar código único para o parceiro
                const codigo = gerarCodigoParceiro(nome);
                
                console.log('📝 Criando registro na tabela parceiros...');
                
                // 3. Criar registro na tabela 'parceiros'
                const { data: parceiroData, error: parceiroError } = await supabaseClient
                    .from('parceiros')
                    .insert([{
                        nome: nome,
                        email: email,
                        telefone: telefone,
                        documento: documento || null,
                        cidade: cidade || null,
                        estado: estado || null,
                        codigo: codigo,
                        comissao: 10, // Comissão padrão de 10%
                        created_at: new Date().toISOString()
                    }])
                    .select();
                
                if (parceiroError) {
                    console.error('❌ Erro ao criar parceiro:', parceiroError);
                    throw parceiroError;
                }
                
                console.log('✅ Parceiro criado:', parceiroData);
                
                // Sucesso!
                mostrarAlerta('✅ Conta criada com sucesso! Redirecionando para login...', 'success');
                
                // Redirecionar para login após 2 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('❌ Erro no cadastro:', error);
                
                let mensagemErro = 'Erro ao criar conta: ' + error.message;
                
                // Mensagens de erro personalizadas
                if (error.message.includes('already registered')) {
                    mensagemErro = '❌ Este e-mail já está cadastrado. Tente fazer login.';
                } else if (error.message.includes('Invalid email')) {
                    mensagemErro = '❌ E-mail inválido. Verifique e tente novamente.';
                } else if (error.message.includes('Password')) {
                    mensagemErro = '❌ Senha muito fraca. Use no mínimo 6 caracteres.';
                }
                
                mostrarAlerta(mensagemErro, 'error');
                
                btnCadastrar.disabled = false;
                btnCadastrar.textContent = '🚀 Criar Minha Conta';
            }
        });

        // Função para gerar código único do parceiro
        function gerarCodigoParceiro(nome) {
            // Remove acentos e caracteres especiais
            const nomeLimpo = nome
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, '')
                .trim()
                .replace(/\s+/g, '-');
            
            // Adiciona timestamp para garantir unicidade
            const timestamp = Date.now().toString().slice(-4);
            
            return `${nomeLimpo}-${timestamp}`;
        }

        // Função para mostrar alertas
        function mostrarAlerta(mensagem, tipo) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert ${tipo} show">${mensagem}</div>`;
            
            // Auto-remover após 5 segundos (exceto para sucesso)
            if (tipo !== 'success') {
                setTimeout(() => {
                    container.innerHTML = '';
                }, 5000);
            }
        }

        // Máscara para telefone
        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length > 10) {
                value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else if (value.length > 2) {
                value = value.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            } else {
                value = value.replace(/^(\d*)/, '($1');
            }
            
            e.target.value = value;
        });

        // Máscara para CPF/CNPJ
        document.getElementById('documento').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length <= 11) {
                // CPF: 000.000.000-00
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            } else {
                // CNPJ: 00.000.000/0000-00
                value = value.slice(0, 14);
                value = value.replace(/^(\d{2})(\d)/, '$1.$2');
                value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
                value = value.replace(/(\d{4})(\d)/, '$1-$2');
            }
            
            e.target.value = value;
        });

        console.log('✅ Sistema de cadastro pronto');
    </script>
</body>
</html>
