<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de Parceiros - Somos Todos Um">
    <title>Cadastro de Parceiros - Somos Todos Um</title>
    <link rel="icon" href="https://bizmix.com.br/favicon.ico" type="image/x-icon">
    <style>
        /* Reset e Base */
        :root {
            --primary-blue: #667eea;
            --primary-blue-dark: #5568d3;
            --success-green: #10B981;
            --warning-yellow: #F59E0B;
            --danger-red: #EF4444;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --bg-light: #F9FAFB;
            --bg-white: #FFFFFF;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registration-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 800px; /* Increased max-width for more fields */
        }

        .registration-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 30px;
            text-align: center;
            color: white;
        }

        .registration-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .registration-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .registration-body {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .form-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .form-section h2 {
            font-size: 20px;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 0; /* Managed by grid gap */
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input[type="radio"] {
            margin-right: 5px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="tel"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            background-color: var(--bg-white);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-blue);
        }

        .checkbox-group label {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: normal;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .registration-footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-top: 1px solid var(--border-light);
            font-size: 14px;
        }

        .registration-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .registration-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .registration-body {
                padding: 20px;
            }
            .form-section h2 {
                font-size: 18px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="registration-container">
        <div class="registration-header">
            <h1>🤝 Cadastro de Parceiros</h1>
            <p>Preencha seus dados para se tornar um parceiro BizMix</p>
        </div>

        <div class="registration-body">
            <div id="alertContainer" class="hidden"></div>

            <form id="registrationForm">
                <div class="form-section">
                    <h2>Tipo de Parceiro</h2>
                    <div class="form-group">
                        <label>
                            <input type="radio" name="tipoParceiro" value="pessoa_fisica" checked> Pessoa Física
                        </label>
                        <label style="margin-left: 20px;">
                            <input type="radio" name="tipoParceiro" value="pessoa_juridica"> Pessoa Jurídica
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Dados Pessoais</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nomeCompleto">Nome Completo / Razão Social *</label>
                            <input type="text" id="nomeCompleto" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="cpfCnpj" id="cpfCnpjLabel">CPF *</label>
                            <input type="text" id="cpfCnpj" required>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Endereço</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" placeholder="00000-000">
                        </div>
                        <div class="form-group">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco">
                        </div>
                        <div class="form-group">
                            <label for="numero">Número</label>
                            <input type="text" id="numero">
                        </div>
                        <div class="form-group">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento">
                        </div>
                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro">
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade">
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <select id="estado">
                                <option value="">Selecione</option>
                                <option value="AC">Acre</option><option value="AL">Alagoas</option><option value="AP">Amapá</option><option value="AM">Amazonas</option><option value="BA">Bahia</option><option value="CE">Ceará</option><option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option><option value="GO">Goiás</option><option value="MA">Maranhão</option><option value="MT">Mato Grosso</option><option value="MS">Mato Grosso do Sul</option><option value="MG">Minas Gerais</option><option value="PA">Pará</option><option value="PB">Paraíba</option><option value="PR">Paraná</option><option value="PE">Pernambuco</option><option value="PI">Piauí</option><option value="RJ">Rio de Janeiro</option><option value="RN">Rio Grande do Norte</option><option value="RS">Rio Grande do Sul</option><option value="RO">Rondônia</option><option value="RR">Roraima</option><option value="SC">Santa Catarina</option><option value="SP">São Paulo</option><option value="SE">Sergipe</option><option value="TO">Tocantins</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Dados Bancários</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="banco">Banco</label>
                            <input type="text" id="banco">
                        </div>
                        <div class="form-group">
                            <label for="agencia">Agência</label>
                            <input type="text" id="agencia">
                        </div>
                        <div class="form-group">
                            <label for="conta">Conta</label>
                            <input type="text" id="conta">
                        </div>
                        <div class="form-group">
                            <label for="tipoConta">Tipo de Conta</label>
                            <select id="tipoConta">
                                <option value="">Selecione</option>
                                <option value="Corrente">Corrente</option>
                                <option value="Poupanca">Poupança</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pixTipo">Tipo de Chave PIX</label>
                            <select id="pixTipo">
                                <option value="">Selecione</option>
                                <option value="cpf">CPF</option>
                                <option value="cnpj">CNPJ</option>
                                <option value="email">Email</option>
                                <option value="telefone">Telefone</option>
                                <option value="aleatoria">Chave Aleatória</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pixChave">Chave PIX</label>
                            <input type="text" id="pixChave">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Acesso</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="senha">Senha *</label>
                            <input type="password" id="senha" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="confirmarSenha">Confirmar Senha *</label>
                            <input type="password" id="confirmarSenha" required minlength="6">
                        </div>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Eu li e aceito os <a href="#" target="_blank">Termos e Condições</a> *</label>
                </div>

                <button type="submit" class="btn btn-primary" id="submitButton">Cadastrar</button>

                <div class="loading" id="loadingSpinner">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px; color: #666;">Processando seu cadastro...</p>
                </div>
            </form>
        </div>

        <div class="registration-footer">
            <p>Já tem cadastro? <a href="login.html">Faça login</a></p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Supabase Configuration
        const SUPABASE_URL = 'https://hjlpmorykllywjodusqx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILzM';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const registrationForm = document.getElementById('registrationForm');
        const alertContainer = document.getElementById('alertContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const submitButton = document.getElementById('submitButton');

        // Form Fields
        const tipoParceiroRadios = document.querySelectorAll('input[name="tipoParceiro"]');
        const nomeCompletoInput = document.getElementById('nomeCompleto');
        const emailInput = document.getElementById('email');
        const cpfCnpjInput = document.getElementById('cpfCnpj');
        const cpfCnpjLabel = document.getElementById('cpfCnpjLabel');
        const telefoneInput = document.getElementById('telefone');
        const cepInput = document.getElementById('cep');
        const enderecoInput = document.getElementById('endereco');
        const numeroInput = document.getElementById('numero');
        const complementoInput = document.getElementById('complemento');
        const bairroInput = document.getElementById('bairro');
        const cidadeInput = document.getElementById('cidade');
        const estadoSelect = document.getElementById('estado');
        const bancoInput = document.getElementById('banco');
        const agenciaInput = document.getElementById('agencia');
        const contaInput = document.getElementById('conta');
        const tipoContaSelect = document.getElementById('tipoConta');
        const pixTipoSelect = document.getElementById('pixTipo');
        const pixChaveInput = document.getElementById('pixChave');
        const senhaInput = document.getElementById('senha');
        const confirmarSenhaInput = document.getElementById('confirmarSenha');
        const termosCheckbox = document.getElementById('termos');

        // Helper Functions
        const showAlert = (message, type = 'error') => {
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            alertContainer.classList.remove('hidden');
            setTimeout(() => {
                alertContainer.classList.add('hidden');
                alertContainer.innerHTML = '';
            }, 5000);
        };

        const showLoading = (show) => {
            if (show) {
                loadingSpinner.classList.add('active');
                submitButton.disabled = true;
            } else {
                loadingSpinner.classList.remove('active');
                submitButton.disabled = false;
            }
        };

        const validateEmail = (email) => {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        };

        const validateCPF = (cpf) => {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf.length !== 11 || !!cpf.match(/(\d)\1{10}/)) return false;
            let sum = 0, rest;
            for (let i = 1; i <= 9; i++) sum = sum + parseInt(cpf.substring(i - 1, i)) * (11 - i);
            rest = (sum * 10) % 11;
            if ((rest === 10) || (rest === 11)) rest = 0;
            if (rest !== parseInt(cpf.substring(9, 10))) return false;
            sum = 0;
            for (let i = 1; i <= 10; i++) sum = sum + parseInt(cpf.substring(i - 1, i)) * (12 - i);
            rest = (sum * 10) % 11;
            if ((rest === 10) || (rest === 11)) rest = 0;
            if (rest !== parseInt(cpf.substring(10, 11))) return false;
            return true;
        };

        const validateCNPJ = (cnpj) => {
            cnpj = cnpj.replace(/[^\d]+/g, '');
            if (cnpj.length !== 14 || !!cnpj.match(/(\d)\1{13}/)) return false;
            let size = cnpj.length - 2;
            let numbers = cnpj.substring(0, size);
            let digits = cnpj.substring(size);
            let sum = 0;
            let pos = size - 7;
            for (let i = size; i >= 1; i--) {
                sum += parseInt(numbers.charAt(i - 1)) * pos--;
                if (pos < 2) pos = 9;
            }
            let result = sum % 11 < 2 ? 0 : 11 - sum % 11;
            if (result !== parseInt(digits.charAt(0))) return false;
            size = size + 1;
            numbers = cnpj.substring(0, size);
            sum = 0;
            pos = size - 7;
            for (let i = size; i >= 1; i--) {
                sum += parseInt(numbers.charAt(i - 1)) * pos--;
                if (pos < 2) pos = 9;
            }
            result = sum % 11 < 2 ? 0 : 11 - sum % 11;
            if (result !== parseInt(digits.charAt(1))) return false;
            return true;
        };

        // Input Masks
        const applyMask = (input, maskFunction) => {
            input.addEventListener('input', (e) => {
                e.target.value = maskFunction(e.target.value);
            });
        };

        const maskCPF = (value) => {
            value = value.replace(/\D/g, '');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            return value;
        };

        const maskCNPJ = (value) => {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/, '$1.$2');
            value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
            value = value.replace(/(\d{4})(\d)/, '$1-$2');
            return value;
        };

        const maskPhone = (value) => {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
            value = value.replace(/(\d)(\d{4})$/, '$1-$2');
            return value;
        };

        const maskCEP = (value) => {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{5})(\d)/, '$1-$2');
            return value;
        };

        applyMask(cpfCnpjInput, maskCPF);
        applyMask(telefoneInput, maskPhone);
        applyMask(cepInput, maskCEP);

        // Populate States
        const states = [
            'AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO'
        ];
        states.forEach(uf => {
            const option = document.createElement('option');
            option.value = uf;
            option.textContent = uf;
            estadoSelect.appendChild(option);
        });

        // Event Listeners
        tipoParceiroRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const tipo = e.target.value;
                if (tipo === 'pessoa_fisica') {
                    cpfCnpjLabel.textContent = 'CPF *';
                    cpfCnpjInput.placeholder = '000.000.000-00';
                    cpfCnpjInput.value = maskCPF(cpfCnpjInput.value);
                    applyMask(cpfCnpjInput, maskCPF);
                } else {
                    cpfCnpjLabel.textContent = 'CNPJ *';
                    cpfCnpjInput.placeholder = '00.000.000/0000-00';
                    cpfCnpjInput.value = maskCNPJ(cpfCnpjInput.value);
                    applyMask(cpfCnpjInput, maskCNPJ);
                }
            });
        });

        cepInput.addEventListener('blur', async () => {
            const cep = cepInput.value.replace(/\D/g, '');
            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        enderecoInput.value = data.logradouro || '';
                        bairroInput.value = data.bairro || '';
                        cidadeInput.value = data.localidade || '';
                        estadoSelect.value = data.uf || '';
                    } else {
                        showAlert('CEP não encontrado.', 'error');
                    }
                } catch (error) {
                    console.error('Erro ao buscar CEP:', error);
                    showAlert('Erro ao buscar CEP. Tente novamente.', 'error');
                }
            }
        });

        registrationForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading(true);
            alertContainer.classList.add('hidden');

            const tipoParceiro = document.querySelector('input[name="tipoParceiro"]:checked').value;
            const nomeCompleto = nomeCompletoInput.value.trim();
            const email = emailInput.value.trim();
            const cpfCnpj = cpfCnpjInput.value.trim();
            const telefone = telefoneInput.value.trim();
            const cep = cepInput.value.trim();
            const endereco = enderecoInput.value.trim();
            const numero = numeroInput.value.trim();
            const complemento = complementoInput.value.trim();
            const bairro = bairroInput.value.trim();
            const cidade = cidadeInput.value.trim();
            const estado = estadoSelect.value;
            const banco = bancoInput.value.trim();
            const agencia = agenciaInput.value.trim();
            const conta = contaInput.value.trim();
            const tipoConta = tipoContaSelect.value;
            const pixTipo = pixTipoSelect.value;
            const pixChave = pixChaveInput.value.trim();
            const senha = senhaInput.value;
            const confirmarSenha = confirmarSenhaInput.value;

            // --- VALIDATIONS ---
                showAlert('Por favor, preencha todos os campos obrigatórios (*).');
                showLoading(false);
                return;
            }
            if (!validateEmail(email)) {
                showAlert('Por favor, insira um email válido.');
                showLoading(false);
                return;
            }
            if (tipoParceiro === 'pessoa_fisica' && !validateCPF(cpfCnpj)) {
                showAlert('Por favor, insira um CPF válido.');
                showLoading(false);
                return;
            }
            if (tipoParceiro === 'pessoa_juridica' && !validateCNPJ(cpfCnpj)) {
                showAlert('Por favor, insira um CNPJ válido.');
                showLoading(false);
                return;
            }
            if (senha.length < 6) {
                showAlert('A senha deve ter no mínimo 6 caracteres.');
                showLoading(false);
                return;
            }
            if (senha !== confirmarSenha) {
                showAlert('As senhas não coincidem.');
                showLoading(false);
                return;
            }
            if (!termosCheckbox.checked) {
                showAlert('Você deve aceitar os Termos e Condições para se cadastrar.');
                showLoading(false);
                return;
            }

            try {
                // 1. Create Supabase Auth User
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: senha,
                });

                if (authError) {
                    if (authError.message.includes('already registered')) {
                        showAlert('Este email já está cadastrado. Tente fazer login ou recuperar a senha.');
                    } else {
                        showAlert(`Erro ao criar usuário: ${authError.message}`);
                    }
                    showLoading(false);
                    return;
                }

                const authUserId = authData.user.id;

                // 2. Generate unique codigo_parceiro
                let codigoParceiro = '';
                let isUnique = false;
                const firstName = nomeCompleto.split(' ')[0].toUpperCase();
                while (!isUnique) {
                    const randomDigits = Math.floor(1000 + Math.random() * 9000); // 4 random digits
                    codigoParceiro = `${firstName}${randomDigits}`;
                    const { data, error } = await supabase
                        .from('parceiros')
                        .select('codigo_parceiro')
                        .eq('codigo_parceiro', codigoParceiro);
                    if (error) throw error;
                    if (data.length === 0) {
                        isUnique = true;
                    }
                }

                // 3. Insert into 'parceiros' table
                const { error: dbError } = await supabase
                    .from('parceiros')
                    .insert([
                        {
                            auth_user_id: authUserId,
                            nome_completo: nomeCompleto,
                            email: email,
                            cpf_cnpj: cpfCnpj.replace(/\D/g, ''), // Store clean CPF/CNPJ
                            telefone: telefone.replace(/\D/g, ''), // Store clean phone
                            tipo_parceiro: tipoParceiro,
                            codigo_parceiro: codigoParceiro,
                            categoria_produtos: 'todos', // Default for regular partners
                            status: 'pendente', // Awaiting admin approval
                            cep: cep.replace(/\D/g, ''),
                            endereco: endereco,
                            numero: numero,
                            complemento: complemento,
                            bairro: bairro,
                            cidade: cidade,
                            estado: estado,
                            banco: banco,
                            agencia: agencia,
                            conta: conta,
                            tipo_conta: tipoConta,
                            pix_tipo: pixTipo,
                            pix_chave: pixChave,
                        },
                    ]);

                if (dbError) {
                    showAlert(`Erro ao salvar dados do parceiro: ${dbError.message}`);
                    // If DB insert fails, consider deleting the auth user to prevent orphaned accounts
                    await supabase.auth.admin.deleteUser(authUserId); // Requires service_role key, or manual cleanup
                    showLoading(false);
                    return;
                }

                showAlert('Cadastro realizado com sucesso! Aguarde aprovação do administrador.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html'; // Redirect to login page
                }, 3000);

            } catch (error) {
                console.error('Erro no processo de cadastro:', error);
                showAlert(`Ocorreu um erro inesperado: ${error.message}`);
            } finally {
                showLoading(false);
            }
        });
    </script>
</body>
</html>
