<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de Igrejas - Somos Todos Um.">
    <title>Cadastro de Igrejas - Somos Todos Um</title>
    <link rel="icon" href="https://bizmix.com.br/favicon.ico" type="image/x-icon">
    <style>
        /* Reset e Base */
        :root {
            --primary-blue: #667eea;
            --primary-blue-dark: #5568d3;
            --success-green: #10B981;
            --warning-yellow: #F59E0B;
            --danger-red: #EF4444;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --bg-light: #F9FAFB;
            --bg-white: #FFFFFF;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* ==================== REGISTRATION FORM ==================== */
        .registration-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 800px; /* Increased max-width for more fields */
        }

        .registration-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .registration-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .registration-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .registration-body {
            padding: 40px 30px;
        }

        .form-section-title {
            font-size: 20px;
            color: var(--primary-blue);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-light);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 0; /* Removed default margin-bottom */
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .registration-footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-top: 1px solid var(--border-light);
            font-size: 14px;
        }

        .registration-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .registration-footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .checkbox-group label a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group label a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="registration-container">
        <div class="registration-header">
            <h1>⛪ Cadastro de Igrejas</h1>
            <p>Cadastre sua igreja para divulgar produtos religiosos e gerar comissões.</p>
        </div>

        <div class="registration-body">
            <div id="alertContainer"></div>

            <form id="churchRegistrationForm">
                <h3 class="form-section-title">Dados da Igreja</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nomeIgreja">Nome da Igreja *</label>
                        <input type="text" id="nomeIgreja" placeholder="Ex: Igreja da Paz" required>
                    </div>
                    <div class="form-group">
                        <label for="cnpj">CNPJ *</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required>
                    </div>
                    <div class="form-group">
                        <label for="nomeResponsavel">Nome do Responsável/Pastor *</label>
                        <input type="text" id="nomeResponsavel" placeholder="Ex: Pastor João Silva" required>
                    </div>
                    <div class="form-group">
                        <label for="emailInstitucional">Email Institucional *</label>
                        <input type="email" id="emailInstitucional" placeholder="contato@igreja.com.br" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000">
                    </div>
                </div>

                <h3 class="form-section-title">Endereço</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" placeholder="00000-000" required>
                    </div>
                    <div class="form-group">
                        <label for="endereco">Endereço Completo *</label>
                        <input type="text" id="endereco" placeholder="Rua, Avenida, etc." required>
                    </div>
                    <div class="form-group">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" placeholder="123" required>
                    </div>
                    <div class="form-group">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" placeholder="Apto, Bloco, etc.">
                    </div>
                    <div class="form-group">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado *</label>
                        <select id="estado" required>
                            <option value="">Selecione</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                    </div>
                </div>

                <h3 class="form-section-title">Dados Bancários</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="banco">Banco</label>
                        <input type="text" id="banco" placeholder="Ex: Banco do Brasil">
                    </div>
                    <div class="form-group">
                        <label for="agencia">Agência</label>
                        <input type="text" id="agencia" placeholder="0000">
                    </div>
                    <div class="form-group">
                        <label for="conta">Conta</label>
                        <input type="text" id="conta" placeholder="00000-0">
                    </div>
                    <div class="form-group">
                        <label for="tipoConta">Tipo de Conta</label>
                        <select id="tipoConta">
                            <option value="">Selecione</option>
                            <option value="Corrente">Corrente</option>
                            <option value="Poupanca">Poupança</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tipoPix">Tipo de Chave PIX</label>
                        <select id="tipoPix">
                            <option value="">Selecione</option>
                            <option value="cnpj">CNPJ</option>
                            <option value="email">Email</option>
                            <option value="telefone">Telefone</option>
                            <option value="aleatoria">Chave Aleatória</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="chavePix">Chave PIX</label>
                        <input type="text" id="chavePix" placeholder="Sua chave PIX">
                    </div>
                </div>

                <h3 class="form-section-title">Acesso</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="senha">Senha *</label>
                        <input type="password" id="senha" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Senha *</label>
                        <input type="password" id="confirmarSenha" placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Aceito os <a href="#" target="_blank">termos e condições</a> *</label>
                </div>

                <button type="submit" class="btn btn-primary" id="btnRegistrar">Cadastrar Igreja</button>

                <div class="loading" id="loadingSpinner">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px; color: #666;">Registrando...</p>
                </div>
            </form>
        </div>

        <div class="registration-footer">
            <p>Já tem cadastro? <a href="login.html">Faça login</a></p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Supabase Configuration
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNzY2MDAsImV4cCI6MjA4MTc1MjYwMH0.cOkzl5m_FzkACi6yc7398VKNhefK3I_JcRN8df1ILM';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const registrationForm = document.getElementById('churchRegistrationForm');
        const alertContainer = document.getElementById('alertContainer');
        const btnRegistrar = document.getElementById('btnRegistrar');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Input fields
        const nomeIgrejaInput = document.getElementById('nomeIgreja');
        const cnpjInput = document.getElementById('cnpj');
        const nomeResponsavelInput = document.getElementById('nomeResponsavel');
        const emailInstitucionalInput = document.getElementById('emailInstitucional');
        const telefoneInput = document.getElementById('telefone');
        const cepInput = document.getElementById('cep');
        const enderecoInput = document.getElementById('endereco');
        const numeroInput = document.getElementById('numero');
        const complementoInput = document.getElementById('complemento');
        const bairroInput = document.getElementById('bairro');
        const cidadeInput = document.getElementById('cidade');
        const estadoInput = document.getElementById('estado');
        const bancoInput = document.getElementById('banco');
        const agenciaInput = document.getElementById('agencia');
        const contaInput = document.getElementById('conta');
        const tipoContaInput = document.getElementById('tipoConta');
        const tipoPixInput = document.getElementById('tipoPix');
        const chavePixInput = document.getElementById('chavePix');
        const senhaInput = document.getElementById('senha');
        const confirmarSenhaInput = document.getElementById('confirmarSenha');
        const termosCheckbox = document.getElementById('termos');

        // Helper Functions
        const showAlert = (message, type = 'error') => {
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            alertContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 8000);
        };

        const showLoading = (isLoading) => {
            btnRegistrar.disabled = isLoading;
            loadingSpinner.classList.toggle('active', isLoading);
            btnRegistrar.textContent = isLoading ? 'Registrando...' : 'Cadastrar Igreja';
        };

        // Input Masks
        const applyCnpjMask = (value) => {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/, '$1.$2');
            value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
            value = value.replace(/(\d{4})(\d)/, '$1-$2');
            return value;
        };

        const applyPhoneMask = (value) => {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
            value = value.replace(/(\d)(\d{4})$/, '$1-$2');
            return value;
        };

        const applyCepMask = (value) => {
            value = value.replace(/\D/g, '');
            value = value.replace(/^(\d{5})(\d)/, '$1-$2');
            return value;
        };

        cnpjInput.addEventListener('input', (e) => { e.target.value = applyCnpjMask(e.target.value); });
        telefoneInput.addEventListener('input', (e) => { e.target.value = applyPhoneMask(e.target.value); });
        cepInput.addEventListener('input', (e) => { e.target.value = applyCepMask(e.target.value); });

        // CNPJ Validation
        const validateCnpj = (cnpj) => {
            cnpj = cnpj.replace(/[^\d]+/g, '');
            if (cnpj == '') return false;
            if (cnpj.length != 14) return false;

            // Elimina CNPJs inválidos conhecidos
            if (cnpj == "00000000000000" ||
                cnpj == "11111111111111" ||
                cnpj == "22222222222222" ||
                cnpj == "33333333333333" ||
                cnpj == "44444444444444" ||
                cnpj == "55555555555555" ||
                cnpj == "66666666666666" ||
                cnpj == "77777777777777" ||
                cnpj == "88888888888888" ||
                cnpj == "99999999999999")
                return false;

            // Valida DVs
            let tamanho = cnpj.length - 2;
            let numeros = cnpj.substring(0, tamanho);
            let digitos = cnpj.substring(tamanho);
            let soma = 0;
            let pos = tamanho - 7;
            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2)
                    pos = 9;
            }
            let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
            if (resultado != digitos.charAt(0))
                return false;

            tamanho = tamanho + 1;
            numeros = cnpj.substring(0, tamanho);
            soma = 0;
            pos = tamanho - 7;
            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2)
                    pos = 9;
            }
            resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
            if (resultado != digitos.charAt(1))
                return false;

            return true;
        };

        // ViaCEP Lookup
        cepInput.addEventListener('blur', async () => {
            const cep = cepInput.value.replace(/\D/g, '');
            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        enderecoInput.value = data.logradouro || '';
                        bairroInput.value = data.bairro || '';
                        cidadeInput.value = data.localidade || '';
                        estadoInput.value = data.uf || '';
                    } else {
                        showAlert('CEP não encontrado.', 'error');
                    }
                } catch (error) {
                    console.error('Erro ao buscar CEP:', error);
                    showAlert('Erro ao buscar CEP. Tente novamente.', 'error');
                }
            }
        });

        // Registration Form Submission
        registrationForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', 'hidden'); // Clear previous alerts
            showLoading(true);

            const nomeIgreja = nomeIgrejaInput.value.trim();
            const cnpj = cnpjInput.value.trim();
            const nomeResponsavel = nomeResponsavelInput.value.trim();
            const emailInstitucional = emailInstitucionalInput.value.trim();
            const telefone = telefoneInput.value.trim();
            const cep = cepInput.value.trim();
            const endereco = enderecoInput.value.trim();
            const numero = numeroInput.value.trim();
            const complemento = complementoInput.value.trim();
            const bairro = bairroInput.value.trim();
            const cidade = cidadeInput.value.trim();
            const estado = estadoInput.value;
            const banco = bancoInput.value.trim();
            const agencia = agenciaInput.value.trim();
            const conta = contaInput.value.trim();
            const tipoConta = tipoContaInput.value;
            const tipoPix = tipoPixInput.value;
            const chavePix = chavePixInput.value.trim();
            const senha = senhaInput.value;
            const confirmarSenha = confirmarSenhaInput.value;
            const termosAceitos = termosCheckbox.checked;

            // Client-side validation
                showAlert('Por favor, preencha todos os campos obrigatórios.');
                showLoading(false);
                return;
            }
            if (!validateCnpj(cnpj)) {
                showAlert('CNPJ inválido.');
                showLoading(false);
                return;
            }
            if (senha.length < 6) {
                showAlert('A senha deve ter no mínimo 6 caracteres.');
                showLoading(false);
                return;
            }
            if (senha !== confirmarSenha) {
                showAlert('As senhas não coincidem.');
                showLoading(false);
                return;
            }
            if (!termosAceitos) {
                showAlert('Você deve aceitar os termos e condições.');
                showLoading(false);
                return;
            }

            try {
                // 1. Create Supabase Auth user
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: emailInstitucional,
                    password: senha,
                });

                if (authError) {
                    if (authError.message.includes('already registered')) {
                        showAlert('Este email já está cadastrado. Tente fazer login ou recuperar a senha.');
                    } else {
                        showAlert(`Erro ao criar usuário: ${authError.message}`);
                    }
                    showLoading(false);
                    return;
                }

                const authUserId = authData.user.id;

                // 2. Generate unique codigo_parceiro
                let codigoParceiro;
                let isUnique = false;
                while (!isUnique) {
                    const randomDigits = Math.floor(1000 + Math.random() * 9000); // 4 random digits
                    codigoParceiro = `IGREJA${randomDigits}`;
                    const { data, error } = await supabase
                        .from('parceiros')
                        .select('codigo_parceiro')
                        .eq('codigo_parceiro', codigoParceiro);
                    if (error) throw error;
                    if (data.length === 0) {
                        isUnique = true;
                    }
                }

                // 3. Insert into 'parceiros' table
                const { error: dbError } = await supabase
                    .from('parceiros')
                    .insert({
                        auth_user_id: authUserId,
                        nome_completo: nomeIgreja, // Use nomeIgreja como nome_completo para igrejas
                        email: emailInstitucional,
                        cpf_cnpj: cnpj,
                        telefone: telefone,
                        tipo_parceiro: 'igreja',
                        nome_igreja: nomeIgreja,
                        responsavel_igreja: nomeResponsavel,
                        codigo_parceiro: codigoParceiro,
                        produtos_permitidos: ['Livro Somos Todos Um'], // Initial product
                        categoria_produtos: 'religiosos',
                        status: 'pendente', // Awaiting admin approval
                        cep: cep,
                        endereco: endereco,
                        numero: numero,
                        complemento: complemento,
                        bairro: bairro,
                        cidade: cidade,
                        estado: estado,
                        banco: banco,
                        agencia: agencia,
                        conta: conta,
                        tipo_conta: tipoConta,
                        pix_tipo: tipoPix,
                        pix_chave: chavePix,
                    });

                if (dbError) {
                    // If DB insert fails, try to delete the Supabase Auth user to avoid orphans
                    await supabase.auth.admin.deleteUser(authUserId); // Requires admin privileges or RLS
                    showAlert(`Erro ao registrar igreja: ${dbError.message}`);
                    showLoading(false);
                    return;
                }

                showAlert('Cadastro realizado com sucesso! Aguarde aprovação.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html'; // Redirect to login page
                }, 3000);

            } catch (error) {
                console.error('Erro no processo de registro:', error);
                showAlert(`Ocorreu um erro inesperado: ${error.message}`);
            } finally {
                showLoading(false);
            }
        });
    </script>
</body>
</html>
