<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Produtos - Admin BizMix</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    
    <!-- Configuração Universal -->
    <script src="/js/supabase-config.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f7fa; display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: white; color: #333; padding: 30px 20px; position: fixed; height: 100vh; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar-header { text-align: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .sidebar-header h2 { font-size: 22px; color: #667eea; }
        .menu-item { margin-bottom: 10px; list-style: none; }
        .menu-item a { display: flex; align-items: center; padding: 12px 15px; color: #666; text-decoration: none; border-radius: 8px; transition: 0.3s; }
        .menu-item a:hover, .menu-item a.active { background: #f0f3ff; color: #667eea; }
        .menu-item a i { margin-right: 12px; width: 20px; }
        .btn-logout { width: 100%; padding: 10px; background: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }

        /* Main Content */
        .main-content { margin-left: 260px; flex: 1; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px 30px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .top-bar h1 { font-size: 24px; color: #333; }
        
        .btn-add { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3); }

        /* Table */
        .table-container { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { color: #666; font-size: 14px; background: #f9f9f9; }
        
        .product-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #eee; }
        .price-badge { background: #d4edda; color: #155724; padding: 5px 10px; border-radius: 20px; font-weight: 600; font-size: 12px; }
        
        .btn-action { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; margin-right: 5px; color: white; transition: 0.3s; }
        .btn-edit { background: #3498db; } .btn-edit:hover { background: #2980b9; }
        .btn-delete { background: #e74c3c; } .btn-delete:hover { background: #c0392b; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-save { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Admin</h2>
            <p>Produtos</p>
        </div>
        <ul class="menu">
            <li class="menu-item"><a href="/admin/index.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="menu-item"><a href="/admin/gerenciar-parceiros.html"><i class="fas fa-users"></i> Parceiros</a></li>
            <li class="menu-item"><a href="/admin/dashboard-igrejas.html"><i class="fas fa-church"></i> Igrejas</a></li>
            <li class="menu-item"><a href="/admin/venda.html"><i class="fas fa-shopping-cart"></i> Nova Venda</a></li>
            <li class="menu-item"><a href="/admin/comissoes.html"><i class="fas fa-dollar-sign"></i> Comissões</a></li>
            <li class="menu-item"><a href="/admin/produtos.html" class="active"><i class="fas fa-box"></i> Produtos</a></li>
            <li class="menu-item"><a href="/admin/relatorios.html"><i class="fas fa-file-alt"></i> Relatórios</a></li>
        </ul>
        <button class="btn-logout" onclick="logout()">Sair</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <h1>📦 Meus Produtos</h1>
            <button class="btn-add" onclick="abrirModal()">
                <i class="fas fa-plus"></i> Novo Produto
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="productsTable">
                    <tr><td colspan="4" style="text-align:center;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Produto</h2>
                <button onclick="fecharModal()" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="prodId">
                <div class="form-group">
                    <label>Nome do Produto *</label>
                    <input type="text" id="prodNome" required>
                </div>
                <div class="form-group">
                    <label>Preço (R$) *</label>
                    <input type="number" id="prodPreco" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="prodDesc" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="text" id="prodImg" placeholder="https://...">
                </div>
                <button type="submit" class="btn-save">💾 Salvar Produto</button>
            </form>
        </div>
    </div>
        <script>
        // Inicialização
        // const supabase = window.supabase;
        let products = [];

        // Auth
        async function verificarAuth() {
            if (!supabase) { alert("Erro config"); return; }
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/admin/login.html'; return; }
            carregarProdutos();
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = '/admin/login.html'; }

        // Carregar
        async function carregarProdutos() {
            try {
                const { data, error } = await supabase.from('produtos').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                products = data || [];
                renderTable();
            } catch (err) {
                console.error(err);
                document.getElementById('productsTable').innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">Erro ao carregar.</td></tr>';
            }
        }

        // Renderizar
        function renderTable() {
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = '';
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum produto cadastrado.</td></tr>';
                return;
            }

            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${p.imagem_url || 'https://via.placeholder.com/50'}" class="product-img"></td>
                    <td>
                        <strong>${p.nome}</strong><br>
                        <small style="color:#888;">${p.descricao || ''}</small>
                    </td>
                    <td><span class="price-badge">R$ ${p.preco.toFixed(2).replace('.', ',')}</span></td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editar('${p.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-action btn-delete" onclick="deletar('${p.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Adicionar / Editar
        function abrirModal() {
            document.getElementById('productForm').reset();
            document.getElementById('prodId').value = '';
            document.getElementById('modalTitle').textContent = 'Novo Produto';
            document.getElementById('productModal').classList.add('show');
        }

        function editar(id) {
            const p = products.find(x => x.id === id);
            if(!p) return;
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodNome').value = p.nome;
            document.getElementById('prodPreco').value = p.preco;
            document.getElementById('prodDesc').value = p.descricao || '';
            document.getElementById('prodImg').value = p.imagem_url || '';
            document.getElementById('modalTitle').textContent = 'Editar Produto';
            document.getElementById('productModal').classList.add('show');
        }

        function fecharModal() { document.getElementById('productModal').classList.remove('show'); }

        // Salvar
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('prodId').value;
            const dados = {
                nome: document.getElementById('prodNome').value,
                preco: parseFloat(document.getElementById('prodPreco').value),
                descricao: document.getElementById('prodDesc').value,
                imagem_url: document.getElementById('prodImg').value,
                ativo: true,
                status: 'ativo'
            };

            try {
                if(id) {
                    await supabase.from('produtos').update(dados).eq('id', id);
                    alert("Atualizado!");
                } else {
                    await supabase.from('produtos').insert([dados]);
                    alert("Criado!");
                }
                fecharModal();
                carregarProdutos();
            } catch(err) { alert("Erro ao salvar."); console.error(err); }
        });

        // Deletar
        async function deletar(id) {
            if(!confirm("Tem certeza que deseja excluir?")) return;
            try {
                await supabase.from('produtos').delete().eq('id', id);
                carregarProdutos();
            } catch(err) { alert("Erro ao deletar."); }
        }

        verificarAuth();
    </script>
</body>
</html>
