<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo BizMix</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-form {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 BizMix</h1>
            <p>Painel Administrativo</p>
        </div>
        
        <div class="login-form">
            <div class="error-message" id="errorMessage"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #666;">Autenticando...</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
            </form>

            <div class="forgot-password">
                <a href="#" id="forgotPassword">Esqueceu sua senha?</a>
            </div>
        </div>
    </div>

    <script>
        // Configuração do Supabase
        const supabaseUrl = 'https://pjzaabuqzgvwrfgqzgzm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueGtsaGNwcXRwYnhuYmdqanFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYzNDU5NjksImV4cCI6MjA1MTkyMTk2OX0.xZEKkTJVvzYNvBxJxPzGqYhHLq2fFKjOCMZnGCLKAzs';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');
        const btnLogin = document.getElementById('btnLogin');

        // Ler credenciais da URL (se existirem)
        const urlParams = new URLSearchParams(window.location.search);
        const emailFromUrl = urlParams.get('email');
        const passwordFromUrl = urlParams.get('password');

        if (emailFromUrl) {
            document.getElementById('email').value = emailFromUrl;
        }

        if (passwordFromUrl) {
            document.getElementById('password').value = passwordFromUrl;
        }

        // Verifica se já está logado
        async function checkExistingSession() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                // Busca dados do usuário
                const { data: userData } = await supabase
                    .from('parceiros')
                    .select('tipo_parceiro')
                    .eq('email', session.user.email)
                    .single();

                if (userData) {
                    redirectToDashboard(userData.tipo_parceiro);
                }
            }
        }

        // Função de redirecionamento - CORRIGIDA!
        function redirectToDashboard(tipoParceiro) {
            if (tipoParceiro === 'admin') {
                window.location.href = '/admin/super-admin/index.html';  // ✅ CAMINHO CORRETO!
            } else if (tipoParceiro === 'parceiro') {
                window.location.href = '/admin/dashboard-parceiro.html';
            } else if (tipoParceiro === 'igreja') {
                window.location.href = '/admin/dashboard-igreja.html';
            } else {
                showError('Tipo de usuário não reconhecido.');
            }
        }

        // Função para mostrar erro
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validação básica
            if (!email || !password) {
                showError('Por favor, preencha todos os campos.');
                return;
            }

            // Mostrar loading
            loading.classList.add('show');
            btnLogin.disabled = true;
            errorMessage.classList.remove('show');

            try {
                // Autenticar com Supabase
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    throw new Error('Email ou senha incorretos.');
                }

                // Buscar dados do parceiro
                const { data: userData, error: userError } = await supabase
                    .from('parceiros')
                    .select('tipo_parceiro, status')
                    .eq('email', email)
                    .single();

                if (userError || !userData) {
                    throw new Error('Usuário não encontrado no sistema.');
                }

                // Verificar status
                if (userData.status !== 'ativo') {
                    await supabase.auth.signOut();
                    throw new Error('Sua conta está inativa. Entre em contato com o suporte.');
                }

                // Redirecionar baseado no tipo
                redirectToDashboard(userData.tipo_parceiro);

            } catch (error) {
                loading.classList.remove('show');
                btnLogin.disabled = false;
                showError(error.message);
            }
        });

        // Esqueci minha senha
        document.getElementById('forgotPassword').addEventListener('click', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showError('Por favor, digite seu email no campo acima.');
                return;
            }

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/admin/reset-password.html'
                });

                if (error) throw error;

                alert('Email de recuperação enviado! Verifique sua caixa de entrada.');
            } catch (error) {
                showError('Erro ao enviar email de recuperação: ' + error.message);
            }
        });

        // Auto-submit se credenciais vieram da URL
        if (emailFromUrl && passwordFromUrl) {
            setTimeout(() => {
                loginForm.dispatchEvent(new Event('submit'));
            }, 500);
        }

        // Verificar sessão ao carregar
        checkExistingSession();
    </script>
</body>
</html>
