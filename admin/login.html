<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="/imagens/logo.png" alt="Logo">
            </div>
            
            <h1>Painel Administrativo</h1>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Esqueci minha senha</a>
                </div>

                <button type="submit" id="btnLogin" class="btn-login">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <script>
        // Aguardar o DOM carregar completamente
        document.addEventListener('DOMContentLoaded', function() {
            
            const loginForm = document.getElementById('loginForm');
            const btnLogin = document.getElementById('btnLogin');
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');

            // Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Desabilitar botão e mostrar loading
                btnLogin.disabled = true;
                btnLogin.textContent = 'Entrando...';
                errorMessage.classList.remove('show');
                loading.style.display = 'block';

                try {
                    // Fazer login
                    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (authError) throw authError;

                    // Verificar se é admin
                    const { data: usuario, error: userError } = await supabase
                        .from('usuarios')
                        .select('tipo')
                        .eq('email', email)
                        .single();

                    if (userError) throw new Error('Usuário não encontrado');

                    if (usuario.tipo !== 'admin' && usuario.tipo !== 'super_admin') {
                        await supabase.auth.signOut();
                        throw new Error('Acesso negado. Você não tem permissão de administrador.');
                    }

                    // Redirecionar baseado no tipo
                    window.location.href = '/admin/index.html';

                } catch (error) {
                    console.error('Erro no login:', error);
                    errorMessage.textContent = error.message || 'Erro ao fazer login. Verifique suas credenciais.';
                    errorMessage.classList.add('show');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar';
                    loading.style.display = 'none';
                }
            });

            // Recuperar senha - Redirecionar para página dedicada
            document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = '/admin/esqueci-senha.html';
            });

        }); // Fim do DOMContentLoaded
    </script>
</body>
</html>
