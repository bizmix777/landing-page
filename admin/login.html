<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BizMix</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Login</h1>
            <p>Acesse sua conta BizMix</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu@email.com" 
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    placeholder="••••••••" 
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Entrar
            </button>
        </form>

        <div class="links">
            <a href="/cadastro/">Criar conta</a> | 
            <a href="/recuperar-senha.html">Esqueci minha senha</a>
        </div>
    </div>

    <script>
                
        // ELEMENTOS
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const alertBox = document.getElementById('alertBox');

        // FUNÇÕES AUXILIARES
        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        function setLoading(isLoading) {
            btnLogin.disabled = isLoading;
            if (isLoading) {
                btnLogin.innerHTML = '<span class="loader"></span>Entrando...';
            } else {
                btnLogin.innerHTML = 'Entrar';
            }
        }

        // LOGIN HANDLER
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            if (!email || !senha) {
                showAlert('Por favor, preencha todos os campos.');
                return;
            }

            setLoading(true);
            
            try {
                // PASSO 1: AUTENTICAR NO SUPABASE AUTH
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (authError) {
                    throw new Error('E-mail ou senha incorretos.');
                }

                const userId = authData.user.id;

                // PASSO 2: VERIFICAR SE É ADMIN
                const { data: adminData, error: adminError } = await supabase
                    .from('admins')
                    .select('*')
                    .eq('email', email)
                    .eq('ativo', true)
                    .single();

                if (adminData && !adminError) {
                    // É ADMIN - redirecionar baseado no nível
                    console.log('✅ Login como Admin:', adminData.nivel);
                    
                    if (adminData.nivel === 'super-admin') {
                        window.location.href = '/admin/super-admin/index.html';
                    } else {
                        window.location.href = '/admin/index.html';
                    }
                    return;
                }

                // PASSO 3: VERIFICAR SE É PARCEIRO OU IGREJA
                const { data: parceiroData, error: parceiroError } = await supabase
                    .from('parceiros')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (parceiroData && !parceiroError) {
                    console.log('✅ Login como Parceiro:', parceiroData.tipo_parceiro);
                    
                    // Atualizar último acesso
                    await supabase
                        .from('parceiros')
                        .update({ ultimo_acesso: new Date().toISOString() })
                        .eq('id', parceiroData.id);

                    // Verificar se está aprovado
                    if (parceiroData.status !== 'aprovado') {
                        showAlert('Sua conta ainda está aguardando aprovação.', 'error');
                        await supabase.auth.signOut();
                        setLoading(false);
                        return;
                    }

                    // Redirecionar para painel de parceiro
                    if (parceiroData.tipo_parceiro === 'igreja') {
                        window.location.href = '/painel/';
                    } else {
                        window.location.href = '/painel/';
                    }
                    return;
                }

                // CASO NÃO SEJA ADMIN NEM PARCEIRO
                throw new Error('Usuário não encontrado no sistema. Entre em contato com o suporte.');

            } catch (error) {
                console.error('Erro no login:', error);
                showAlert(error.message);
                setLoading(false);
            }
        });

        // VERIFICAR SE JÁ ESTÁ LOGADO
        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                const email = session.user.email;

                // Verificar se é admin
                const { data: admin } = await supabase
                    .from('admins')
                    .select('nivel')
                    .eq('email', email)
                    .eq('ativo', true)
                    .single();

                if (admin) {
                    if (admin.nivel === 'super-admin') {
                        window.location.href = '/admin/super-admin/index.html';
                    } else {
                        window.location.href = '/admin/index.html';
                    }
                } else {
                    // É parceiro
                    window.location.href = '/painel/';
                }
            }
        })();
    </script>
</body>
</html>
