<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BizMix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Reset básico */
        body, h1, p, form, input, button {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); /* Gradiente azul para roxo */
            color: #333;
            line-height: 1.6;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #2575fc;
            box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.2);
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px 20px;
            background-color: #2575fc;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1a5edb;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message, .loading-message {
            background-color: #f44336;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none; /* Escondido por padrão */
            font-size: 0.95em;
            text-align: center;
        }

        .loading-message {
            background-color: #2196f3;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .login-container {
                padding: 30px 20px;
                width: 95%;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 25px;
            }

            input[type="email"],
            input[type="password"],
            button {
                padding: 12px 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login - BizMix</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <div id="errorMessage" class="error-message"></div>
        <div id="loadingMessage" class="loading-message">Carregando...</div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY4NzE5NjcsImV4cCI6MjA1MjQ0Nzk2N30.4yKEOCmKyHqXxKCN0JoLZLDqWNZQHVVMXJGPnfLkruI';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Get DOM elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessageDiv = document.getElementById('errorMessage');
        const loadingMessageDiv = document.getElementById('loadingMessage');

        // Function to display error message
        function showErrorMessage(message) {
            errorMessageDiv.textContent = message;
            errorMessageDiv.style.display = 'block';
            loadingMessageDiv.style.display = 'none';
        }

        // Function to display loading message
        function showLoadingMessage() {
            loadingMessageDiv.textContent = 'Carregando...';
            loadingMessageDiv.style.display = 'block';
            errorMessageDiv.style.display = 'none';
        }

        // Function to hide messages
        function hideMessages() {
            errorMessageDiv.style.display = 'none';
            loadingMessageDiv.style.display = 'none';
        }

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent default form submission

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showErrorMessage('Por favor, preencha todos os campos.');
                return;
            }

            showLoadingMessage();

            try {
                // 1. Authenticate with Supabase Auth
                const { data, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (authError) {
                    console.error('Erro de autenticação Supabase:', authError);
                    let userFriendlyMessage = 'Erro ao fazer login. Verifique seu email e senha.';
                    if (authError.message.includes('Invalid login credentials')) {
                        userFriendlyMessage = 'Credenciais de login inválidas.';
                    }
                    showErrorMessage(userFriendlyMessage);
                    return;
                }

                if (data && data.user) {
                    console.log('Usuário autenticado:', data.user);

                    // 2. Query the "parceiros" table to get user data
                    const { data: parceiroData, error: parceiroError } = await supabase
                        .from('parceiros')
                        .select('tipo_parceiro')
                        .eq('email', email)
                        .single();

                    if (parceiroError) {
                        console.error('Erro ao buscar tipo de parceiro:', parceiroError);
                        showErrorMessage('Erro ao obter informações do usuário. Tente novamente.');
                        // Even if there's an error fetching parceiro data, we might still redirect to a default dashboard
                        window.location.href = '/admin/dashboard-parceiro.html'; // Default redirect on error
                        return;
                    }

                    // 3. Check the "tipo_parceiro" field and redirect
                    const tipo_parceiro = parceiroData ? parceiroData.tipo_parceiro : null;
                    let redirectPath = '/admin/dashboard-parceiro.html'; // Default redirect

                    if (tipo_parceiro === 'admin') {
                        redirectPath = '/admin/super-admin.html';
                    } else if (tipo_parceiro === 'parceiro') {
                        redirectPath = '/admin/dashboard-parceiro.html';
                    } else if (tipo_parceiro === 'igreja') {
                        redirectPath = '/admin/dashboard-igreja.html';
                    }
                    
                    console.log(`Redirecionando para: ${redirectPath}`);
                    window.location.href = redirectPath;

                } else {
                    // This case should ideally be caught by authError, but as a fallback
                    showErrorMessage('Ocorreu um erro inesperado. Tente novamente.');
                }

            } catch (error) {
                console.error('Erro inesperado durante o login:', error);
                showErrorMessage('Ocorreu um erro inesperado. Tente novamente.');
            } finally {
                hideMessages(); // Hide loading/error messages after attempt
            }
        });
    </script>
</body>
</html>
