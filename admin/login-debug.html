<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Debug - BizMix</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background: #764ba2;
        }
        .debug {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .debug h3 {
            margin-top: 0;
            color: #667eea;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .success {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .info {
            background: #def;
            color: #36c;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 BizMix Login (Debug)</h1>
        
        <div id="messages"></div>

        <form id="form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="henrique65@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" value="162534" required>
            </div>
            <button type="submit">Entrar</button>
            <button type="button" onclick="testConnection()">Testar Conexão Supabase</button>
        </form>

        <div class="debug" id="debug">
            <h3>Log de Debug:</h3>
            <div id="debugLog">Aguardando ação...</div>
        </div>
    </div>

    <script>
        // Configuração Supabase
        const SUPABASE_URL = 'https://pjzaabuqzgvwrfgqzgzm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqemFhYnVxemd2d3JmZ3F6Z3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY5NTQ4NzMsImV4cCI6MjA1MjUzMDg3M30.VJEhHoLhkuLZo7XqNnODKzL-dKNs5gMvEr3gCHxoKfk';
        
        let sb;
        
        function log(message, type = 'info') {
            const debugLog = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            debugLog.innerHTML += `<div style="margin-bottom: 5px;"><strong>[${timestamp}]</strong> ${message}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `<div class="${type}">${message}</div>`;
        }

        // Inicializar Supabase
        try {
            log('Inicializando cliente Supabase...');
            sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            log('✅ Cliente Supabase inicializado com sucesso', 'success');
        } catch (error) {
            log('❌ Erro ao inicializar Supabase: ' + error.message, 'error');
            showMessage('Erro ao inicializar Supabase: ' + error.message, 'error');
        }

        // Testar conexão
        async function testConnection() {
            log('--- INICIANDO TESTE DE CONEXÃO ---');
            showMessage('Testando conexão com Supabase...', 'info');

            try {
                // Teste 1: Verificar se consegue fazer uma query simples
                log('Teste 1: Tentando buscar dados da tabela parceiros...');
                const { data, error } = await sb
                    .from('parceiros')
                    .select('count')
                    .limit(1);

                if (error) {
                    log('❌ Erro na query: ' + error.message, 'error');
                    showMessage('Erro na conexão: ' + error.message, 'error');
                } else {
                    log('✅ Conexão com banco de dados OK!', 'success');
                    showMessage('✅ Conexão com Supabase funcionando!', 'success');
                }

                // Teste 2: Verificar sessão atual
                log('Teste 2: Verificando sessão atual...');
                const { data: session } = await sb.auth.getSession();
                if (session.session) {
                    log('✅ Sessão ativa encontrada: ' + session.session.user.email);
                } else {
                    log('ℹ️ Nenhuma sessão ativa');
                }

            } catch (error) {
                log('❌ Erro no teste de conexão: ' + error.message, 'error');
                log('❌ Tipo do erro: ' + error.name, 'error');
                log('❌ Stack: ' + error.stack, 'error');
                showMessage('Erro de conexão: ' + error.message, 'error');
            }

            log('--- TESTE DE CONEXÃO FINALIZADO ---');
        }

        // Login
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            log('--- INICIANDO PROCESSO DE LOGIN ---');
            log('Email: ' + email);
            showMessage('Autenticando...', 'info');

            try {
                // Passo 1: Autenticar
                log('Passo 1: Tentando autenticar com Supabase Auth...');
                const { data: authData, error: authError } = await sb.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    log('❌ Erro de autenticação: ' + authError.message, 'error');
                    log('❌ Código do erro: ' + authError.status, 'error');
                    throw new Error('Erro de autenticação: ' + authError.message);
                }

                log('✅ Autenticação bem-sucedida!', 'success');
                log('User ID: ' + authData.user.id);
                log('Email confirmado: ' + (authData.user.email_confirmed_at ? 'Sim' : 'Não'));

                // Passo 2: Buscar dados do parceiro
                log('Passo 2: Buscando dados na tabela parceiros...');
                const { data: userData, error: userError } = await sb
                    .from('parceiros')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (userError) {
                    log('❌ Erro ao buscar dados: ' + userError.message, 'error');
                    throw new Error('Erro ao buscar dados do usuário');
                }

                log('✅ Dados do usuário encontrados!', 'success');
                log('Nome: ' + userData.nome_completo);
                log('Tipo: ' + userData.tipo_parceiro);
                log('Status: ' + userData.status);
                log('Código: ' + userData.codigo_parceiro);

                // Passo 3: Verificar status
                if (userData.status !== 'ativo') {
                    log('❌ Conta inativa', 'error');
                    throw new Error('Sua conta está inativa');
                }

                log('✅ Status verificado: ATIVO', 'success');

                // Passo 4: Redirecionar
                log('Passo 4: Redirecionando para dashboard...');
                
                let redirectUrl = '';
                if (userData.tipo_parceiro === 'admin') {
                    redirectUrl = '/admin/super-admin.html';
                } else if (userData.tipo_parceiro === 'parceiro') {
                    redirectUrl = '/admin/dashboard-parceiro.html';
                } else if (userData.tipo_parceiro === 'igreja') {
                    redirectUrl = '/admin/dashboard-igreja.html';
                }

                log('URL de redirecionamento: ' + redirectUrl);
                showMessage('✅ Login bem-sucedido! Redirecionando...', 'success');

                setTimeout(() => {
                    log('Redirecionando agora...');
                    window.location.href = redirectUrl;
                }, 2000);

            } catch (error) {
                log('❌ ERRO NO LOGIN: ' + error.message, 'error');
                log('❌ Tipo do erro: ' + error.name, 'error');
                if (error.stack) {
                    log('❌ Stack: ' + error.stack, 'error');
                }
                showMessage('Erro: ' + error.message, 'error');
            }

            log('--- PROCESSO DE LOGIN FINALIZADO ---');
        });

        // Ler URL
        const params = new URLSearchParams(window.location.search);
        const emailUrl = params.get('email');
        const passUrl = params.get('password');

        if (emailUrl) {
            document.getElementById('email').value = emailUrl;
            log('Email preenchido da URL: ' + emailUrl);
        }
        if (passUrl) {
            document.getElementById('password').value = passUrl;
            log('Senha preenchida da URL');
        }

        // Auto-submit se credenciais vieram da URL
        if (emailUrl && passUrl) {
            log('Credenciais detectadas na URL, aguardando 1 segundo para auto-submit...');
            setTimeout(() => {
                log('Executando auto-submit...');
                document.getElementById('form').dispatchEvent(new Event('submit'));
            }, 1000);
        }

        // Log inicial
        log('Página carregada');
        log('URL do Supabase: ' + SUPABASE_URL);
    </script>
</body>
</html>
