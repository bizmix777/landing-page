<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - BizMix</title>
    <link rel="icon" href="https://bizmix.com.br/favicon.ico">
    
    <!-- Configuração centralizada (FETCH DIRETO) -->
    <script src="/js/supabase-config.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .body {
            padding: 40px 30px;
        }

        .product-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .product-info h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            font-weight: 600;
            color: #667eea;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-pagar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00C9A7 0%, #00B894 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-pagar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 201, 167, 0.4);
        }

        .btn-pagar:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px auto;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🛒 Finalizar Compra</h1>
            <p>Complete seus dados para pagamento via PIX</p>
        </div>

        <div class="body">
            <div id="alertBox" class="alert alert-error"></div>

            <div class="product-info">
                <h3>📦 Resumo do Pedido</h3>
                <div class="info-row">
                    <span class="info-label">Produto:</span>
                    <span id="productName">Carregando...</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Preço unitário:</span>
                    <span id="productPrice">R$ 0,00</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Total:</span>
                    <span class="info-value" id="totalValue">R$ 0,00</span>
                </div>
            </div>

            <form id="formCheckout">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" required placeholder="Seu nome">
                </div>

                <div class="form-group">
                    <label for="sobrenome">Sobrenome *</label>
                    <input type="text" id="sobrenome" name="sobrenome" required placeholder="Seu sobrenome">
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" maxlength="14">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone (opcional)</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15">
                </div>

                <div class="form-group">
                    <label for="whatsapp">WhatsApp *</label>
                    <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(00) 00000-0000" maxlength="15">
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade</label>
                    <select id="quantidade" name="quantidade">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <button type="submit" id="btnPagar" class="btn-pagar">
                    💳 Pagar com PIX
                </button>
            </form>
        </div>
    </div>

    <script>
        console.log('🛒 Página de checkout carregada');

        // 
        // VERIFICAR SE CONFIG EXISTE
        // 
        if (typeof SUPABASE_URL === 'undefined' || typeof supabaseFetch === 'undefined') {
            alert('❌ Erro: arquivo supabase-config.js não encontrado!');
            throw new Error('supabase-config.js não carregado');
        }

        // 
        // OBTER PRODUTO DA URL
        // 
        const urlParams = new URLSearchParams(window.location.search);
        const produtoId = urlParams.get('produto');

        console.log('🆔 Produto ID:', produtoId);

        if (!produtoId) {
            showAlert('❌ Produto não encontrado na URL!');
            setTimeout(() => window.location.href = '/', 3000);
        }

        let produtoSelecionado = null;

        // 
        // CARREGAR PRODUTO (USA supabaseFetch)
        // 
        async function carregarProduto() {
            try {
                console.log('📦 Buscando produto:', produtoId);

                // Usando supabaseFetch do config
                const produtos = await supabaseFetch(`produtos?id=eq.${produtoId}&select=*`);

                if (!produtos || produtos.length === 0) {
                    throw new Error('Produto não encontrado');
                }

                produtoSelecionado = produtos[0];
                console.log('✅ Produto carregado:', produtoSelecionado);

                // Atualizar tela
                document.getElementById('productName').textContent = produtoSelecionado.nome;
                document.getElementById('productPrice').textContent = `R$ ${produtoSelecionado.preco.toFixed(2)}`;
                document.getElementById('totalValue').textContent = `R$ ${produtoSelecionado.preco.toFixed(2)}`;

                // Atualizar ao mudar quantidade
                document.getElementById('quantidade').addEventListener('change', function() {
                    const quantidade = parseInt(this.value);
                    const total = produtoSelecionado.preco * quantidade;
                    document.getElementById('totalValue').textContent = `R$ ${total.toFixed(2)}`;
                });

            } catch (error) {
                console.error('❌ Erro ao carregar produto:', error);
                showAlert('❌ Erro ao carregar produto!');
            }
        }

        // 
        // PROCESSAR PAGAMENTO
        // 
        document.getElementById('formCheckout').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btnPagar = document.getElementById('btnPagar');
            btnPagar.disabled = true;
            btnPagar.innerHTML = '<span class="spinner"></span> Processando...';

            try {
                // Coletar dados
                const nome = document.getElementById('nome').value.trim();
                const sobrenome = document.getElementById('sobrenome').value.trim();
                const email = document.getElementById('email').value.trim();
                const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
                const telefone = document.getElementById('telefone').value.replace(/\D/g, '');
                const whatsapp = document.getElementById('whatsapp').value.replace(/\D/g, '');
                const quantidade = parseInt(document.getElementById('quantidade').value) || 1;

                // Validações
                    throw new Error('Preencha todos os campos obrigatórios!');
                }

                if (cpf.length !== 11) {
                    throw new Error('CPF inválido! Deve ter 11 dígitos.');
                }

                if (whatsapp.length < 10) {
                    throw new Error('WhatsApp inválido!');
                }

                const valorTotal = produtoSelecionado.preco * quantidade;

                console.log('💳 Criando pagamento PIX via Edge Function...');
                console.log('📊 Dados:', { nome, sobrenome, email, cpf, whatsapp, valorTotal });

                // 
                // CHAMAR EDGE FUNCTION (USA supabaseFunction)
                // 
                const paymentData = await supabaseFunction('create-payment-mp', {
                    transaction_amount: valorTotal,
                    description: `${produtoSelecionado.nome} - ${quantidade}x`,
                    payment_method_id: 'pix',
                    payer: {
                        email: email,
                        first_name: nome,
                        last_name: sobrenome,
                        identification: {
                            type: 'CPF',
                            number: cpf
                        }
                    },
                    external_reference: `produto_${produtoId}`
                });

                console.log('✅ Resposta Edge Function:', paymentData);

                if (!paymentData.success || !paymentData.payment_id) {
                    throw new Error(paymentData.error || 'Falha ao criar pagamento no Mercado Pago');
                }

                // 
                // INSERIR VENDA NO BANCO (NOMES CORRETOS)
                // 
                console.log('💾 Salvando venda no banco...');

                const vendaData = {
                    produto_id: produtoId,
                    quantidade: quantidade,
                    valor_unitario: produtoSelecionado.preco,
                    valor_total: valorTotal,
                    nome_comprador: `${nome} ${sobrenome}`,
                    email_comprador: email,
                    cpf_comprador: cpf,
                    telefone_comprador: telefone || null,
                    whatsapp_comprador: whatsapp,
                    status_pagamento: 'pending',
                    mercadopago_payment_id: paymentData.payment_id,
                    mercadopago_status: paymentData.status
                };

                const vendas = await supabaseFetch('vendas', {
                    method: 'POST',
                    body: JSON.stringify(vendaData)
                });

                if (!vendas || vendas.length === 0) {
                    throw new Error('Erro ao registrar venda no banco');
                }

                const venda = vendas[0];
                console.log('✅ Venda salva:', venda);

                // 
                // REDIRECIONAR PARA PIX.HTML (CORRIGIDO)
                // 
                const redirectUrl = `/pix.html?payment_id=${paymentData.payment_id}&venda_id=${venda.id}`;
                
                console.log('🔄 Redirecionando para:', redirectUrl);
                window.location.href = redirectUrl;

            } catch (error) {
                console.error('❌ Erro no processo:', error);
                showAlert(`❌ ${error.message}`);
                
                btnPagar.disabled = false;
                btnPagar.innerHTML = '💳 Pagar com PIX';
            }
        });

        // 
        // MÁSCARA CPF
        // 
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        // 
        // MÁSCARA TELEFONE E WHATSAPP
        // 
        function aplicarMascaraTelefone(input) {
            input.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length <= 11) {
                    if (value.length <= 10) {
                        value = value.replace(/(\d{2})(\d)/, '($1) $2');
                        value = value.replace(/(\d{4})(\d)/, '$1-$2');
                    } else {
                        value = value.replace(/(\d{2})(\d)/, '($1) $2');
                        value = value.replace(/(\d{5})(\d)/, '$1-$2');
                    }
                    e.target.value = value;
                }
            });
        }

        aplicarMascaraTelefone(document.getElementById('telefone'));
        aplicarMascaraTelefone(document.getElementById('whatsapp'));

        // 
        // FUNÇÕES AUXILIARES
        // 
        function showAlert(message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.classList.add('show');
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        // 
        // INICIALIZAR
        // 
        window.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM carregado, iniciando...');
            carregarProduto();
        });
    </script>

</body>
</html>
