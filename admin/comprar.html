<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Finalize sua Compra - Livro Somos Todos Um</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Config -->
    <script src="/js/supabase-config.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --text-color: #333;
            --light-text-color: #f0f0f0;
            --card-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 20px;
            padding: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px var(--shadow-color);
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2em;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 25px;
            color: #555;
        }

        .price {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 30px;
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
            outline: none;
        }

        .button-group {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px 25px;
            font-size: 1.2em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: var(--light-text-color);
            background: linear-gradient(45deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            .price {
                font-size: 2em;
            }
            .card {
                padding: 20px;
            }
            .btn {
                font-size: 1.1em;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🛒 Finalize sua Compra</h1>
            <p>Adquira o livro "Somos Todos Um" e transforme sua vida!</p>
            <span class="price">R$ 29,90</span>

            <form id="purchaseForm">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Seu nome completo" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" placeholder="(XX) XXXXX-XXXX" maxlength="15" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" placeholder="XXX.XXX.XXX-XX" maxlength="14" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn">💳 Pagar com PIX</button>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: var(--primary-color); font-weight: 600;">Processando...</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        console.log('✅ JavaScript de compra carregado com sucesso!');

        // Usar Supabase do config
        const meuSupabase = window.supabase;

        // Get URL parameters for referral tracking
        const urlParams = new URLSearchParams(window.location.search);
        const referralParams = {
            igreja: urlParams.get('igreja'),
            parceiro: urlParams.get('parceiro'),
            empresa: urlParams.get('empresa'),
            ref: urlParams.get('ref')
        };
        console.log('Parâmetros capturados:', referralParams);

        // --- Auto-formatting functions ---
        function formatPhone(value) {
            value = value.replace(/\D/g, '');
            if (value.length > 10) {
                value = value.replace(/^(\d\d)(\d{5})(\d{4}).*/, '($1) $2-$3');
            } else if (value.length > 6) {
                value = value.replace(/^(\d\d)(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else if (value.length > 2) {
                value = value.replace(/^(\d\d)(\d{0,5}).*/, '($1) $2');
            } else {
                value = value.replace(/^(\d*)/, '($1');
            }
            return value;
        }

        function formatCPF(value) {
            value = value.replace(/\D/g, '');
            if (value.length > 9) {
                value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/^(\d{3})(\d{0,3}).*/, '$1.$2');
            }
            return value;
        }

        // --- Event Listeners for auto-formatting ---
        document.getElementById('telefone').addEventListener('input', function(e) {
            e.target.value = formatPhone(e.target.value);
        });

        document.getElementById('cpf').addEventListener('input', function(e) {
            e.target.value = formatCPF(e.target.value);
        });

        // --- Form Submission Handler ---
        document.getElementById('purchaseForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            // Mostrar loading
            const btn = event.target.querySelector('.btn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            loading.classList.add('active');

            // Get form values
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.replace(/\D/g, '');
            const cpf = document.getElementById('cpf').value.replace(/\D/g, '');

            // Validation
            if (!nome || !email || !telefone || !cpf) {
                alert('⚠️ Por favor, preencha todos os campos!');
                btn.disabled = false;
                loading.classList.remove('active');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('⚠️ Por favor, insira um email válido!');
                btn.disabled = false;
                loading.classList.remove('active');
                return;
            }

            // Determinar origem
            let origem = 'direto';
            let referencia = null;
            
            if (referralParams.ref) {
                referencia = referralParams.ref;
                origem = 'afiliado';
            } else if (referralParams.igreja) {
                referencia = referralParams.igreja;
                origem = 'igreja';
            } else if (referralParams.parceiro) {
                referencia = referralParams.parceiro;
                origem = 'parceiro';
            } else if (referralParams.empresa) {
                referencia = referralParams.empresa;
                origem = 'empresa';
            }

            // Prepare data for Supabase
            const dadosVenda = {
                nome_comprador: nome,
                email_comprador: email,
                telefone_comprador: telefone,
                cpf_comprador: cpf,
                valor_total: 29.90,
                valor_comissao: 8.97,
                comissao_percentual: 30,
                forma_pagamento: 'pix',
                status_pagamento: 'pending',
                email_enviado: false,
                downloads: 0,
                origem: origem,
                referencia: referencia
            };

            console.log('📤 Enviando dados para o Supabase:', dadosVenda);

            try {
                // Insert into Supabase
                const { data, error } = await meuSupabase
                    .from('vendas')
                    .insert([dadosVenda])
                    .select();

                if (error) {
                    console.error('❌ Erro do Supabase:', error);
                    alert('❌ Erro ao registrar compra: ' + error.message);
                    btn.disabled = false;
                    loading.classList.remove('active');
                    return;
                }

                console.log('✅ Compra registrada com sucesso!', data);

                // Pegar o ID da venda criada
                const vendaId = data[0].id;

                console.log('🔀 Redirecionando para página de pagamento PIX...');
                console.log('📋 Venda ID:', vendaId);

                // ✅ REDIRECIONAR para página de pagamento PIX
                window.location.href = `/somos-todos-um/parceiros/pagamento-pix.html?venda_id=${vendaId}`;

            } catch (err) {
                console.error('❌ Erro ao processar compra:', err);
                alert('❌ Erro ao processar compra: ' + err.message);
                btn.disabled = false;
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
