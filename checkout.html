<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Seu Produto Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanilla-masker@1.2.0/lib/vanilla-masker.min.js"></script>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            padding: 30px;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        h1 {
            color: var(--dark-color);
            font-size: 2.2em;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .product-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--light-color);
        }

        .product-info img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .product-details h2 {
            margin: 0 0 8px 0;
            font-size: 1.5em;
            color: var(--dark-color);
        }

        .product-details p {
            margin: 0 0 5px 0;
            font-size: 0.95em;
            color: var(--secondary-color);
        }

        .product-details .price {
            font-size: 1.4em;
            font-weight: 600;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
            font-size: 0.95em;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            color: var(--text-color);
            background-color: var(--card-bg);
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0; /* Handled by parent form-group */
        }

        button {
            width: 100%;
            padding: 15px 25px;
            background-color: var(--success-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #218838;
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: var(--secondary-color);
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        button.loading .loading-spinner {
            display: inline-block;
        }

        button.loading {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.85em;
            margin-top: 5px;
            display: none; /* Hidden by default */
        }

        .form-group.error input,
        .form-group.error select {
            border-color: var(--danger-color);
        }

        #product-not-found {
            text-align: center;
            color: var(--danger-color);
            font-size: 1.2em;
            font-weight: 500;
            margin-top: 30px;
            display: none;
        }

        .section-title {
            font-size: 1.6em;
            font-weight: 600;
            color: var(--dark-color);
            margin-top: 30px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            .product-info {
                flex-direction: column;
                text-align: center;
            }
            .product-info img {
                width: 80px;
                height: 80px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .form-row .form-group {
                min-width: unset;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Finalizar Compra</h1>

        <div id="product-display">
            <div class="product-info">
                <img id="product-image" src="" alt="Imagem do Produto">
                <div class="product-details">
                    <h2 id="product-name">Carregando Produto...</h2>
                    <p id="product-description"></p>
                    <p class="price" id="product-price">R$ 0,00</p>
                </div>
            </div>
        </div>

        <div id="product-not-found">
            Produto não encontrado ou inválido. Por favor, verifique o link.
        </div>

        <form id="checkout-form">
            <h2 class="section-title">Dados Pessoais</h2>
            <div class="form-group">
                <label for="nome_completo">Nome Completo</label>
                <input type="text" id="nome_completo" name="nome_completo" required>
                <div class="error-message" id="error-nome_completo"></div>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <div class="error-message" id="error-email"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required>
                    <div class="error-message" id="error-cpf"></div>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone (Opcional)</label>
                    <input type="text" id="telefone" name="telefone">
                    <div class="error-message" id="error-telefone"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="whatsapp">WhatsApp (Obrigatório)</label>
                <input type="text" id="whatsapp" name="whatsapp" required>
                <div class="error-message" id="error-whatsapp"></div>
            </div>

            <h2 class="section-title">Endereço de Entrega</h2>
            <div class="form-group">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" required>
                <div class="error-message" id="error-cep"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" required>
                    <div class="error-message" id="error-endereco"></div>
                </div>
                <div class="form-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" required>
                    <div class="error-message" id="error-numero"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="complemento">Complemento (Opcional)</label>
                <input type="text" id="complemento" name="complemento">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" required>
                    <div class="error-message" id="error-bairro"></div>
                </div>
                <div class="form-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <div class="error-message" id="error-cidade"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required>
                    <option value="">Selecione o Estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
                <div class="error-message" id="error-estado"></div>
            </div>

            <button type="submit" id="checkout-button">
                Pagar com PIX
                <span class="loading-spinner"></span>
            </button>
        </form>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://igjimhvemnjvfwyxmypp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnamltaHl2ZW1uanZmd3l4bXlwcCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzM2MzU4NDQyLCJleHAiOjIwNTE5MzQ0NDJ9.Q7xY7zGv8TZN0RKp9aKMNl6lVzT0wH8gL8KfhF5_Hlw';
        const EDGE_FUNCTION_URL = '/functions/v1/create-payment-mp'; // Relative path for Edge Function

        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let productId = null;
        let productPrice = 0;

        const checkoutForm = document.getElementById('checkout-form');
        const checkoutButton = document.getElementById('checkout-button');
        const productDisplay = document.getElementById('product-display');
        const productNotFound = document.getElementById('product-not-found');

        // Helper to show/hide error messages
        function displayError(fieldId, message) {
            const errorElement = document.getElementById(`error-${fieldId}`);
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
                inputElement.closest('.form-group').classList.add('error');
            }
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(`error-${fieldId}`);
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.textContent = '';
                errorElement.style.display = 'none';
                inputElement.closest('.form-group').classList.remove('error');
            }
        }

        // Load product details
        async function loadProduct() {
            const urlParams = new URLSearchParams(window.location.search);
            productId = urlParams.get('produto');

            if (!productId) {
                productDisplay.style.display = 'none';
                productNotFound.style.display = 'block';
                checkoutForm.style.display = 'none';
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('produtos')
                    .select('*')
                    .eq('id', productId)
                    .single();

                if (error || !data) {
                    console.error('Erro ao carregar produto:', error);
                    productDisplay.style.display = 'none';
                    productNotFound.style.display = 'block';
                    checkoutForm.style.display = 'none';
                    return;
                }

                document.getElementById('product-image').src = data.imagem_url || 'https://via.placeholder.com/100';
                document.getElementById('product-name').textContent = data.nome;
                document.getElementById('product-description').textContent = data.descricao;
                document.getElementById('product-price').textContent = `R$ ${data.preco.toFixed(2).replace('.', ',')}`;
                productPrice = data.preco;

                productDisplay.style.display = 'flex';
                productNotFound.style.display = 'none';
                checkoutForm.style.display = 'block';

            } catch (err) {
                console.error('Erro inesperado ao carregar produto:', err);
                productDisplay.style.display = 'none';
                productNotFound.style.display = 'block';
                checkoutForm.style.display = 'none';
            }
        }

        // Apply input masks
        function applyMasks() {
            VMasker(document.getElementById('cpf')).maskPattern('999.999.999-99');
            VMasker(document.getElementById('telefone')).maskPattern('(99) 9999-9999');
            VMasker(document.getElementById('whatsapp')).maskPattern('(99) 99999-9999');
            VMasker(document.getElementById('cep')).maskPattern('99999-999');
        }

        // CEP auto-fill
        async function handleCepBlur() {
            const cepInput = document.getElementById('cep');
            const cep = cepInput.value.replace(/\D/g, ''); // Remove non-digits

            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();

                    if (data.erro) {
                        displayError('cep', 'CEP não encontrado.');
                        clearAddressFields();
                    } else {
                        clearError('cep');
                        document.getElementById('endereco').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('estado').value = data.uf;
                        document.getElementById('numero').focus(); // Focus on number field
                    }
                } catch (error) {
                    console.error('Erro ao buscar CEP:', error);
                    displayError('cep', 'Erro ao buscar CEP. Tente novamente.');
                    clearAddressFields();
                }
            } else if (cep.length > 0) {
                displayError('cep', 'CEP inválido. Digite 8 dígitos.');
                clearAddressFields();
            } else {
                clearError('cep');
                clearAddressFields();
            }
        }

        function clearAddressFields() {
            document.getElementById('endereco').value = '';
            document.getElementById('bairro').value = '';
            document.getElementById('cidade').value = '';
            document.getElementById('estado').value = '';
            document.getElementById('numero').value = '';
            document.getElementById('complemento').value = '';
        }

        // Form submission handler
        checkoutForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            checkoutButton.disabled = true;
            checkoutButton.classList.add('loading');

            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.form-group.error').forEach(el => el.classList.remove('error'));

            let isValid = true;
            const formData = new FormData(checkoutForm);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value.trim();
            }

            // Basic validation for required fields
            const requiredFields = ['nome_completo', 'email', 'cpf', 'whatsapp', 'cep', 'endereco', 'numero', 'bairro', 'cidade', 'estado'];
            for (const field of requiredFields) {
                if (!data[field]) {
                    displayError(field, 'Este campo é obrigatório.');
                    isValid = false;
                } else {
                    clearError(field);
                }
            }

            // Specific validations
            if (data.email && !/\S+@\S+\.\S+/.test(data.email)) {
                displayError('email', 'E-mail inválido.');
                isValid = false;
            }

            const whatsappClean = data.whatsapp.replace(/\D/g, '');
            if (whatsappClean.length < 10) {
                displayError('whatsapp', 'WhatsApp inválido. Mínimo de 10 dígitos.');
                isValid = false;
            }

            const cpfClean = data.cpf.replace(/\D/g, '');
            if (cpfClean.length !== 11) {
                displayError('cpf', 'CPF inválido. Digite 11 dígitos.');
                isValid = false;
            }

            const cepClean = data.cep.replace(/\D/g, '');
            if (cepClean.length !== 8) {
                displayError('cep', 'CEP inválido. Digite 8 dígitos.');
                isValid = false;
            }

            if (!isValid) {
                checkoutButton.disabled = false;
                checkoutButton.classList.remove('loading');
                return;
            }

            try {
                // Step 1: Save sale to Supabase 'vendas' table
                const { data: vendaData, error: vendaError } = await supabase
                    .from('vendas')
                    .insert({
                        produto_id: productId,
                        valor_total: productPrice,
                        nome_comprador: data.nome_completo,
                        email_comprador: data.email,
                        cpf_comprador: cpfClean,
                        telefone_comprador: data.telefone.replace(/\D/g, ''),
                        whatsapp_comprador: whatsappClean,
                        cep_comprador: cepClean,
                        endereco_comprador: data.endereco,
                        numero_comprador: data.numero,
                        complemento_comprador: data.complemento,
                        bairro_comprador: data.bairro,
                        cidade_comprador: data.cidade,
                        estado_comprador: data.estado,
                        status_pagamento: 'pendente' // Initial status
                    })
                    .select('id')
                    .single();

                if (vendaError || !vendaData) {
                    throw new Error('Erro ao registrar a venda: ' + (vendaError?.message || 'Desconhecido'));
                }

                const vendaId = vendaData.id;

                // Step 2: Call Edge Function to create Mercado Pago PIX payment
                const response = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}` // Pass anon key for Edge Function auth
                    },
                    body: JSON.stringify({
                        venda_id: vendaId,
                        amount: productPrice,
                        description: `Compra do produto: ${document.getElementById('product-name').textContent}`,
                        payer_email: data.email,
                        payer_first_name: data.nome_completo.split(' ')[0],
                        payer_last_name: data.nome_comprador.split(' ').slice(1).join(' '),
                        payer_identification_type: 'CPF',
                        payer_identification_number: cpfClean
                    })
                });

                if (!response.ok) {
                    const errorBody = await response.json();
                    throw new Error(`Erro ao gerar PIX: ${errorBody.message || response.statusText}`);
                }

                const paymentResult = await response.json();
                const paymentId = paymentResult.payment_id; // Mercado Pago payment ID

                if (!paymentId) {
                    throw new Error('ID de pagamento do Mercado Pago não retornado.');
                }

                // Step 3: Update Supabase 'vendas' table with Mercado Pago payment ID
                const { error: updateError } = await supabase
                    .from('vendas')
                    .update({
                        mercadopago_payment_id: paymentId,
                        mercadopago_status: 'pending' // Mercado Pago status
                    })
                    .eq('id', vendaId);

                if (updateError) {
                    console.error('Erro ao atualizar venda com MP ID:', updateError);
                    // Continue to redirect, as PIX was generated, but log the error
                }

                // Step 4: Redirect to pix.html
                window.location.href = `/pix.html?payment_id=${paymentId}&venda_id=${vendaId}`;

            } catch (error) {
                console.error('Erro no processo de checkout:', error);
                alert('Ocorreu um erro ao finalizar a compra: ' + error.message);
            } finally {
                checkoutButton.disabled = false;
                checkoutButton.classList.remove('loading');
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadProduct();
            applyMasks();
            document.getElementById('cep').addEventListener('blur', handleCepBlur);

            // Add event listeners to clear errors on input
            const inputs = checkoutForm.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('input', () => clearError(input.id));
                input.addEventListener('change', () => clearError(input.id)); // For select elements
            });
        });
    </script>
</body>
</html>
