<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Somos Todos Um</title>
    <style>
        /* CSS INLINE */
        :root {
            --primary-color: #2c3e50;<br/>
            --accent-color: #3498db;<br/>
            --success-color: #27ae60;<br/>
            --error-color: #e74c3c;<br/>
            --text-color: #333;<br/>
            --light-gray: #f4f4f4;<br/>
            --border-color: #ddd;<br/>
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;<br/>
            margin: 0;<br/>
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif; /* Assuming Open Sans is loaded elsewhere or fallback */<br/>
            line-height: 1.6;<br/>
            color: var(--text-color);<br/>
            background-color: var(--light-gray);<br/>
            display: flex;<br/>
            justify-content: center;<br/>
            align-items: flex-start;<br/>
            min-height: 100vh;<br/>
            padding: 20px;
        }

        .checkout-container {
            background-color: #fff;<br/>
            border-radius: 8px;<br/>
            box-shadow: 0 4px 15px var(--shadow-color);<br/>
            width: 100%;<br/>
            max-width: 700px;<br/>
            padding: 30px;<br/>
            margin-top: 20px;
        }

        h1, h2, h3 {
            color: var(--primary-color);<br/>
            margin-bottom: 20px;<br/>
            text-align: center;
        }

        h2 {
            font-size: 1.8em;<br/>
            border-bottom: 2px solid var(--border-color);<br/>
            padding-bottom: 10px;<br/>
            margin-top: 30px;
        }

        h3 {
            font-size: 1.4em;<br/>
            margin-top: 25px;
        }

        .product-summary {
            display: flex;<br/>
            align-items: center;<br/>
            gap: 20px;<br/>
            padding: 20px;<br/>
            border: 1px solid var(--border-color);<br/>
            border-radius: 8px;<br/>
            margin-bottom: 30px;<br/>
            background-color: var(--light-gray);
        }

        .product-summary img {
            width: 100px;<br/>
            height: auto;<br/>
            border-radius: 4px;<br/>
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .product-details {
            flex-grow: 1;
        }

        .product-details h3 {
            margin: 0 0 5px 0;<br/>
            color: var(--primary-color);<br/>
            text-align: left;
        }

        .product-details p {
            margin: 0;<br/>
            font-size: 1.1em;<br/>
            font-weight: bold;<br/>
            color: var(--accent-color);
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;<br/>
            margin-bottom: 5px;<br/>
            font-weight: bold;<br/>
            color: var(--primary-color);
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="date"],
        .form-group textarea,
        .form-group select {
            width: 100%;<br/>
            padding: 12px;<br/>
            border: 1px solid var(--border-color);<br/>
            border-radius: 5px;<br/>
            font-size: 1em;<br/>
            color: var(--text-color);<br/>
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,<br/>
        .form-group textarea:focus,<br/>
        .form-group select:focus {<br/>
            border-color: var(--accent-color);<br/>
            outline: none;<br/>
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .form-group textarea {
            resize: vertical;<br/>
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;<br/>
            align-items: center;<br/>
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;<br/>
            width: 20px;<br/>
            height: 20px;<br/>
            cursor: pointer;
        }

        .checkbox-group label {
            font-weight: bold;<br/>
            color: var(--primary-color);<br/>
            cursor: pointer;
        }

        .gift-section {
            border: 1px dashed var(--accent-color);<br/>
            padding: 20px;<br/>
            border-radius: 8px;<br/>
            background-color: #e8f4f8; /* Light blue background for gift section */<br/>
            margin-top: 20px;
        }

        .gift-section h3 {
            color: var(--accent-color);<br/>
            margin-top: 0;<br/>
            margin-bottom: 15px;<br/>
            text-align: left;
        }

        .payment-options {
            display: flex;<br/>
            flex-direction: column;<br/>
            gap: 15px;<br/>
            margin-bottom: 30px;
        }

        .payment-method {
            border: 1px solid var(--border-color);<br/>
            border-radius: 8px;<br/>
            padding: 15px;<br/>
            cursor: pointer;<br/>
            transition: all 0.3s ease;<br/>
            background-color: #fdfdfd;
        }

        .payment-method:hover {<br/>
            border-color: var(--accent-color);<br/>
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .payment-method.selected {
            border-color: var(--accent-color);<br/>
            box-shadow: 0 0 0 2px var(--accent-color);<br/>
            background-color: #e8f4f8;
        }

        .payment-method label {
            display: flex;<br/>
            align-items: center;<br/>
            font-weight: bold;<br/>
            color: var(--primary-color);<br/>
            cursor: pointer;
        }

        .payment-method input[type="radio"] {
            margin-right: 10px;<br/>
            width: 18px;<br/>
            height: 18px;
        }

        .payment-details {
            margin-top: 15px;<br/>
            padding-top: 15px;<br/>
            border-top: 1px dashed var(--border-color);
        }

        .pix-details, .card-details {
            display: none;
        }

        .pix-details img {
            max-width: 150px;<br/>
            height: auto;<br/>
            display: block;<br/>
            margin: 15px auto;<br/>
            border: 1px solid var(--border-color);<br/>
            border-radius: 4px;
        }

        .pix-code-container {
            display: flex;<br/>
            align-items: center;<br/>
            gap: 10px;<br/>
            margin-top: 10px;
        }

        .pix-code-container input {
            flex-grow: 1;<br/>
            background-color: var(--light-gray);<br/>
            cursor: text;
        }

        .copy-button {
            background-color: var(--accent-color);<br/>
            color: #fff;<br/>
            border: none;<br/>
            border-radius: 5px;<br/>
            padding: 10px 15px;<br/>
            cursor: pointer;<br/>
            font-size: 0.9em;<br/>
            transition: background-color 0.3s ease;
        }

        .copy-button:hover {<br/>
            background-color: #2980b9;
        }

        .submit-button {
            background-color: var(--success-color);<br/>
            color: #fff;<br/>
            border: none;<br/>
            border-radius: 5px;<br/>
            padding: 15px 25px;<br/>
            font-size: 1.2em;<br/>
            font-weight: bold;<br/>
            cursor: pointer;<br/>
            width: 100%;<br/>
            transition: background-color 0.3s ease, transform 0.1s ease;<br/>
            margin-top: 30px;
        }

        .submit-button:hover:not(:disabled) {<br/>
            background-color: #229a53;<br/>
            transform: translateY(-2px);
        }

        .submit-button:disabled {<br/>
            background-color: #cccccc;<br/>
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error-color);<br/>
            font-size: 0.9em;<br/>
            margin-top: 5px;<br/>
            display: none; /* Hidden by default */
        }

        .form-group.has-error input,
        .form-group.has-error textarea,
        .form-group.has-error select {
            border-color: var(--error-color);
        }

        .loading-overlay {
            position: fixed;<br/>
            top: 0;<br/>
            left: 0;<br/>
            width: 100%;<br/>
            height: 100%;<br/>
            background-color: rgba(255, 255, 255, 0.8);<br/>
            display: flex;<br/>
            justify-content: center;<br/>
            align-items: center;<br/>
            z-index: 1000;<br/>
            display: none; /* Hidden by default */
        }

        .spinner {
            border: 8px solid var(--border-color);<br/>
            border-top: 8px solid var(--accent-color);<br/>
            border-radius: 50%;<br/>
            width: 60px;<br/>
            height: 60px;<br/>
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }<br/>
            100% { transform: rotate(360deg); }
        }

        .success-message, .payment-error-message {
            padding: 15px;<br/>
            border-radius: 5px;<br/>
            margin-top: 20px;<br/>
            text-align: center;<br/>
            font-weight: bold;
        }

        .success-message {
            background-color: #d4edda;<br/>
            color: #155724;<br/>
            border: 1px solid #c3e6cb;
        }

        .payment-error-message {
            background-color: #f8d7da;<br/>
            color: #721c24;<br/>
            border: 1px solid #f5c6cb;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .checkout-container {
                padding: 20px;
            }
            .product-summary {
                flex-direction: column;<br/>
                text-align: center;
            }
            .product-details h3 {
                text-align: center;
            }
            .payment-method label {
                flex-direction: column;<br/>
                align-items: flex-start;
            }
            .payment-method input[type="radio"] {
                margin-bottom: 5px;
            }
        }
    </style>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="checkout-container">
        <h1>Finalizar Compra</h1>

        <div class="product-summary">
            <img src="/somos-todos-um/images/capa-livro.jpg" alt="Capa do livro Somos Todos Um">
            <div class="product-details">
                <h3>Somos Todos Um</h3>
                <p id="product-price">R$ 29,90</p>
            </div>
        </div>

        <form id="checkoutForm">
            <div class="form-section">
                <h2>Seus Dados</h2>
                <div class="form-group" id="group-nome">
                    <label for="nome">Nome Completo <span style="color: var(--error-color);">*</span></label>
                    <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
                    <div class="error-message"></div>
                </div>
                <div class="form-group" id="group-email">
                    <label for="email">E-mail <span style="color: var(--error-color);">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
                    <div class="error-message"></div>
                </div>
                <div class="form-group" id="group-whatsapp">
                    <label for="whatsapp">WhatsApp <span style="color: var(--error-color);">*</span></label>
                    <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(99) 99999-9999" maxlength="15">
                    <div class="error-message"></div>
                </div>
            </div>

            <div class="form-section">
                <h2>Personalização do Livro</h2>
                <div class="form-group">
                    <label for="personalizacao">Personalização do Rodapé (Opcional)</label>
                    <textarea id="personalizacao" name="personalizacao" rows="3" 
                              placeholder="Digite aqui a mensagem que deseja no rodapé do seu livro (máx. 200 caracteres)" 
                              maxlength="200"></textarea>
                    <small style="color: #666; font-size: 0.9em;">Exemplo: "Para Maria, com todo meu amor - João"</small>
                </div>
            </div>

            <div class="form-section">
                <h2>Enviar como Presente?</h2>
                <div class="checkbox-group">
                    <input type="checkbox" id="isGift" name="isGift">
                    <label for="isGift">Sim, quero enviar como presente!</label>
                </div>

                <div class="gift-section" id="giftSection" style="display: none;">
                    <h3>Detalhes do Presente</h3>
                    <div class="form-group" id="group-nomePresenteador">
                        <label for="nomePresenteador">Seu Nome (Quem presenteia) <span style="color: var(--error-color);">*</span></label>
                        <input type="text" id="nomePresenteador" name="nomePresenteador" placeholder="Seu nome">
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group" id="group-nomePresenteado">
                        <label for="nomePresenteado">Nome do Presenteado <span style="color: var(--error-color);">*</span></label>
                        <input type="text" id="nomePresenteado" name="nomePresenteado" placeholder="Nome de quem vai receber o livro">
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group" id="group-dataPresente">
                        <label for="dataPresente">Data do Presente <span style="color: var(--error-color);">*</span></label>
                        <input type="date" id="dataPresente" name="dataPresente">
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group" id="group-emailPresenteado">
                        <label for="emailPresenteado">E-mail do Presenteado <span style="color: var(--error-color);">*</span></label>
                        <input type="email" id="emailPresenteado" name="emailPresenteado" placeholder="email.do.presenteado@exemplo.com">
                        <div class="error-message"></div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Método de Pagamento</h2>
                <div class="payment-options">
                    <div class="payment-method" id="method-pix">
                        <label>
                            <input type="radio" name="paymentMethod" value="pix" checked>
                            PIX
                        </label>
                        <div class="payment-details pix-details" id="pixDetails">
                            <p>Após finalizar a compra, você será redirecionado para a página do PIX para concluir o pagamento.</p>
                        </div>
                    </div>
                    <div class="payment-method" id="method-card">
                        <label>
                            <input type="radio" name="paymentMethod" value="credit_card">
                            Cartão de Crédito
                        </label>
                        <div class="payment-details card-details" id="cardDetails">
                            <div class="form-group">
                                <label for="cardNumber">Número do Cartão <span style="color: var(--error-color);">*</span></label>
                                <input type="text" id="cardNumber" name="cardNumber" placeholder="**** **** **** ****" maxlength="19">
                                <div class="error-message"></div>
                            </div>
                            <div class="form-group">
                                <label for="cardName">Nome no Cartão <span style="color: var(--error-color);">*</span></label>
                                <input type="text" id="cardName" name="cardName" placeholder="Nome impresso no cartão">
                                <div class="error-message"></div>
                            </div>
                            <div class="form-group" style="display: flex; gap: 15px;"><br/>
                                <div style="flex: 2;"><br/>
                                    <label for="cardExpiry">Validade <span style="color: var(--error-color);">*</span></label>
                                    <input type="text" id="cardExpiry" name="cardExpiry" placeholder="MM/AA" maxlength="5">
                                    <div class="error-message"></div>
                                </div>
                                <div style="flex: 1;"><br/>
                                    <label for="cardCvv">CVV <span style="color: var(--error-color);">*</span></label>
                                    <input type="text" id="cardCvv" name="cardCvv" placeholder="***" maxlength="4">
                                    <div class="error-message"></div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="installments">Parcelas</label>
                                <select id="installments" name="installments">
                                    <option value="1">1x de R$ 29,90</option>
                                    <!-- Add more installment options dynamically if needed -->
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-button" id="submitButton">Finalizar Compra</button>
            <div class="payment-error-message" id="paymentErrorMessage" style="display: none;"></div>
        </form>
    </div>

    <script>
        // Supabase Client Initialization
        const SUPABASE_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZnhoZmJqZ3ZwYnFqdGxrYmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzU5MjYwNzksImV4cCI6MjA1MTUwMjA3OX0.SW_rz6Lo-2OV05mQkI2U83kQR6V5QFe-oWwIGc7xDaU';
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Edge Function URLs
        const PIX_EDGE_FUNCTION_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co/functions/v1/criar-pagamento-pix';<br/>
        const CARD_EDGE_FUNCTION_URL = 'https://zofxhfbjgvpbqjtlkbbk.supabase.co/functions/v1/create-payment-mp';

        // Redirect URLs
        const PIX_REDIRECT_URL = '/somos-todos-um/pix.html';
        const SUCCESS_REDIRECT_URL = '/somos-todos-um/sucesso.html';

        // Product Details (hardcoded as per prompt, fetched from URL for ID)
        const PRODUCT_ID_DEFAULT = '1f19140d-d466-4d14-b64c-c6c2ae9c22df';
        const PRODUCT_PRICE = 29.90; // R$ 29,90

        // DOM Elements
        const checkoutForm = document.getElementById('checkoutForm');
        const nomeInput = document.getElementById('nome');
        const emailInput = document.getElementById('email');
        const whatsappInput = document.getElementById('whatsapp');
        const personalizacaoInput = document.getElementById('personalizacao');
        const isGiftCheckbox = document.getElementById('isGift');
        const giftSection = document.getElementById('giftSection');
        const nomePresenteadorInput = document.getElementById('nomePresenteador');
        const nomePresenteadoInput = document.getElementById('nomePresenteado');
        const dataPresenteInput = document.getElementById('dataPresente');
        const emailPresenteadoInput = document.getElementById('emailPresenteado');
        const paymentMethods = document.querySelectorAll('input[name="paymentMethod"]');
        const pixMethod = document.getElementById('method-pix');
        const cardMethod = document.getElementById('method-card');
        const pixDetails = document.getElementById('pixDetails');
        const cardDetails = document.getElementById('cardDetails');
        const cardNumberInput = document.getElementById('cardNumber');
        const cardNameInput = document.getElementById('cardName');
        const cardExpiryInput = document.getElementById('cardExpiry');
        const cardCvvInput = document.getElementById('cardCvv');
        const installmentsSelect = document.getElementById('installments');
        const submitButton = document.getElementById('submitButton');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const paymentErrorMessage = document.getElementById('paymentErrorMessage');

        let currentProductId = PRODUCT_ID_DEFAULT;

        // --- Helper Functions ---

        function getProductIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('produto') || PRODUCT_ID_DEFAULT;
        }

        function showLoading() {
            loadingOverlay.style.display = 'flex';
            submitButton.disabled = true;
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
            submitButton.disabled = false;
        }

        function showError(element, message) {
            const formGroup = element.closest('.form-group');
            if (formGroup) {
                formGroup.classList.add('has-error');
                const errorMessageDiv = formGroup.querySelector('.error-message');
                if (errorMessageDiv) {
                    errorMessageDiv.textContent = message;
                    errorMessageDiv.style.display = 'block';
                }
            }
        }

        function hideError(element) {
            const formGroup = element.closest('.form-group');
            if (formGroup) {
                formGroup.classList.remove('has-error');
                const errorMessageDiv = formGroup.querySelector('.error-message');
                if (errorMessageDiv) {
                    errorMessageDiv.textContent = '';
                    errorMessageDiv.style.display = 'none';
                }
            }
        }

        function isValidEmail(email) {
            const re = /^(([^<>()[\]\.,;:\s@"]+(\.[^<>()[\]\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }

        function applyWhatsAppMask(value) {
            value = value.replace(/\D/g, ""); // Remove tudo o que não é dígito
            value = value.replace(/^(\d{2})(\d)/g, "($1) $2"); // Coloca parênteses em volta dos dois primeiros dígitos
            value = value.replace(/(\d)(\d{4})$/, "$1-$2"); // Coloca hífen entre o quarto e o quinto dígitos
            return value;
        }

        function applyCardNumberMask(value) {
            value = value.replace(/\D/g, ""); // Remove tudo o que não é dígito
            value = value.replace(/(\d{4})(?=\d)/g, "$1 "); // Adiciona espaço a cada 4 dígitos
            return value;
        }

        function applyCardExpiryMask(value) {
            value = value.replace(/\D/g, ""); // Remove tudo o que não é dígito
            if (value.length > 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            return value;
        }

        function generateGiftMessage(presenteador, presenteado, data) {
            const dataFormatada = new Date(data + 'T00:00:00').toLocaleDateString('pt-BR');
            return `Eu ${presenteador} entrego este presente para ${presenteado} em ${dataFormatada}.`;
        }

        // --- Event Listeners ---

        document.addEventListener('DOMContentLoaded', () => {
            currentProductId = getProductIdFromUrl();
            // Initialize payment method display
            paymentMethods.forEach(method => {
                if (method.checked) {
                    document.getElementById(`method-${method.value}`).classList.add('selected');
                    if (method.value === 'pix') {
                        pixDetails.style.display = 'block';
                        cardDetails.style.display = 'none';
                    } else {
                        pixDetails.style.display = 'none';
                        cardDetails.style.display = 'block';
                    }
                }
            });
        });

        whatsappInput.addEventListener('input', (e) => {
            e.target.value = applyWhatsAppMask(e.target.value);
            hideError(e.target);
        });

        cardNumberInput.addEventListener('input', (e) => {
            e.target.value = applyCardNumberMask(e.target.value);
            hideError(e.target);
        });

        cardExpiryInput.addEventListener('input', (e) => {
            e.target.value = applyCardExpiryMask(e.target.value);
            hideError(e.target);
        });

        cardCvvInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, ""); // Only digits
            hideError(e.target);
        });

        emailInput.addEventListener('input', (e) => hideError(e.target));
        nomeInput.addEventListener('input', (e) => hideError(e.target));
        personalizacaoInput.addEventListener('input', (e) => hideError(e.target));
        nomePresenteadorInput.addEventListener('input', (e) => hideError(e.target));
        nomePresenteadoInput.addEventListener('input', (e) => hideError(e.target));
        dataPresenteInput.addEventListener('input', (e) => hideError(e.target));
        emailPresenteadoInput.addEventListener('input', (e) => hideError(e.target));

        isGiftCheckbox.addEventListener('change', () => {
            if (isGiftCheckbox.checked) {
                giftSection.style.display = 'block';
                // Make gift fields required when checked
                nomePresenteadorInput.required = true;
                nomePresenteadoInput.required = true;
                dataPresenteInput.required = true;
                emailPresenteadoInput.required = true;
            } else {
                giftSection.style.display = 'none';
                // Make gift fields not required and clear errors when unchecked
                nomePresenteadorInput.required = false;
                nomePresenteadoInput.required = false;
                dataPresenteInput.required = false;
                emailPresenteadoInput.required = false;
                [nomePresenteadorInput, nomePresenteadoInput, dataPresenteInput, emailPresenteadoInput].forEach(input => {
                    hideError(input);
                    input.value = ''; // Clear values
                });
            }
        });

        paymentMethods.forEach(method => {
            method.addEventListener('change', (e) => {
                document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
                e.target.closest('.payment-method').classList.add('selected');

                if (e.target.value === 'pix') {
                    pixDetails.style.display = 'block';
                    cardDetails.style.display = 'none';
                    // Make card fields not required
                    [cardNumberInput, cardNameInput, cardExpiryInput, cardCvvInput].forEach(input => {
                        input.required = false;
                        hideError(input);
                    });
                } else {
                    pixDetails.style.display = 'none';
                    cardDetails.style.display = 'block';
                    // Make card fields required
                    [cardNumberInput, cardNameInput, cardExpiryInput, cardCvvInput].forEach(input => input.required = true);
                }
            });
        });

        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            paymentErrorMessage.style.display = 'none'; // Hide previous errors

            if (!validateForm()) {
                return;
            }

            showLoading();

            const selectedPaymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

            const pedidoData = {
                produto_id: currentProductId,<br/>
                nome_comprador: nomeInput.value,<br/>
                email_comprador: emailInput.value,<br/>
                whatsapp_comprador: whatsappInput.value.replace(/\D/g, ''), // Save only digits<br/>
                personalizacao: personalizacaoInput.value || null,<br/>
                eh_presente: isGiftCheckbox.checked,<br/>
                metodo_pagamento: selectedPaymentMethod,<br/>
                valor_total: PRODUCT_PRICE,<br/>
                status_pagamento: 'pendente', // Initial status
            };

            if (isGiftCheckbox.checked) {
                pedidoData.nome_presenteador = nomePresenteadorInput.value;
                pedidoData.nome_presenteado = nomePresenteadoInput.value;
                pedidoData.data_presente = dataPresenteInput.value;
                pedidoData.email_presenteado = emailPresenteadoInput.value;
                // Override personalizacao with gift message if gift is selected
                pedidoData.personalizacao = generateGiftMessage(
                    nomePresenteadorInput.value,
                    nomePresenteadoInput.value,
                    dataPresenteInput.value
                );
            }

            try {
                // 1. Insert order into Supabase
                const { data: insertedPedido, error: insertError } = await supabase
                    .from('pedidos')
                    .insert([pedidoData])
                    .select();

                if (insertError) {
                    throw new Error('Erro ao salvar pedido: ' + insertError.message);
                }

                const pedidoId = insertedPedido[0].id;

                // 2. Process payment via Edge Function
                let paymentResponse;
                if (selectedPaymentMethod === 'pix') {
                    paymentResponse = await processPixPayment(pedidoId, pedidoData.email_comprador, PRODUCT_PRICE);
                } else { // credit_card
                    paymentResponse = await processCardPayment(pedidoId, pedidoData.email_comprador, PRODUCT_PRICE);
                }

                if (paymentResponse.success) {
                    // 3. Update order status in Supabase (if needed, or webhook handles it)
                    // For PIX, the redirect page will handle status update/polling
                    // For Card, we can update here if the Edge Function returns final status
                    if (selectedPaymentMethod === 'credit_card' && paymentResponse.status === 'approved') {
                         await supabase
                            .from('pedidos')
                            .update({ status_pagamento: 'aprovado', id_transacao_mp: paymentResponse.paymentId })
                            .eq('id', pedidoId);
                        window.location.href = SUCCESS_REDIRECT_URL;
                    } else if (selectedPaymentMethod === 'pix') {
                        // Redirect to PIX page with payment details
                        window.location.href = `${PIX_REDIRECT_URL}?paymentId=${paymentResponse.paymentId}&qrCode=${encodeURIComponent(paymentResponse.qrCode)}&qrCodeBase64=${encodeURIComponent(paymentResponse.qrCodeBase64)}&pixCode=${encodeURIComponent(paymentResponse.pixCode)}&pedidoId=${pedidoId}`;
                    } else {
                        // Card payment not approved immediately
                        throw new Error(paymentResponse.message || 'Pagamento com cartão não aprovado.');
                    }
                } else {
                    throw new Error(paymentResponse.message || 'Erro ao processar pagamento.');
                }

            } catch (error) {
                console.error('Erro no fluxo de compra:', error);
                paymentErrorMessage.textContent = error.message;
                paymentErrorMessage.style.display = 'block';
                // Update order status to 'falha' if payment failed
                if (pedidoId) {
                    await supabase
                        .from('pedidos')
                        .update({ status_pagamento: 'falha', mensagem_erro: error.message })
                        .eq('id', pedidoId);
                }
            } finally {
                hideLoading();
            }
        });

        // --- Validation Function ---
        function validateForm() {
            let isValid = true;
            const requiredFields = [
                { element: nomeInput, message: 'Por favor, preencha seu nome completo.' },<br/>
                { element: emailInput, message: 'Por favor, preencha um e-mail válido.' },<br/>
                { element: whatsappInput, message: 'Por favor, preencha um número de WhatsApp válido (DDD + 9 dígitos).' }
            ];

            // Clear all previous errors
            document.querySelectorAll('.form-group').forEach(group => {
                group.classList.remove('has-error');
                const errorDiv = group.querySelector('.error-message');
                if (errorDiv) errorDiv.style.display = 'none';
            });

            // Validate main fields
            requiredFields.forEach(field => {
                if (!field.element.value.trim()) {
                    showError(field.element, field.message);
                    isValid = false;
                } else {
                    hideError(field.element);
                }
            });

            if (emailInput.value.trim() && !isValidEmail(emailInput.value.trim())) {
                showError(emailInput, 'Formato de e-mail inválido.');
                isValid = false;
            }

            if (whatsappInput.value.replace(/\D/g, '').length < 11) {
                showError(whatsappInput, 'WhatsApp deve ter 11 dígitos (DDD + 9 dígitos).');
                isValid = false;
            }

            // Validate gift fields if enabled
            if (isGiftCheckbox.checked) {
                const giftFields = [
                    { element: nomePresenteadorInput, message: 'Por favor, preencha o nome de quem presenteia.' },<br/>
                    { element: nomePresenteadoInput, message: 'Por favor, preencha o nome do presenteado.' },<br/>
                    { element: dataPresenteInput, message: 'Por favor, selecione a data do presente.' },<br/>
                    { element: emailPresenteadoInput, message: 'Por favor, preencha o e-mail do presenteado.' }
                ];
                giftFields.forEach(field => {
                    if (!field.element.value.trim()) {
                        showError(field.element, field.message);
                        isValid = false;
                    } else {
                        hideError(field.element);
                    }
                });
                if (emailPresenteadoInput.value.trim() && !isValidEmail(emailPresenteadoInput.value.trim())) {
                    showError(emailPresenteadoInput, 'Formato de e-mail do presenteado inválido.');
                    isValid = false;
                }
            }

            // Validate card fields if selected
            if (document.querySelector('input[name="paymentMethod"]:checked').value === 'credit_card') {
                const cardFields = [
                    { element: cardNumberInput, message: 'Número do cartão é obrigatório.' },<br/>
                    { element: cardNameInput, message: 'Nome no cartão é obrigatório.' },<br/>
                    { element: cardExpiryInput, message: 'Validade do cartão é obrigatória (MM/AA).' },<br/>
                    { element: cardCvvInput, message: 'CVV é obrigatório.' }
                ];
                cardFields.forEach(field => {
                    if (!field.element.value.trim()) {
                        showError(field.element, field.message);
                        isValid = false;
                    } else {
                        hideError(field.element);
                    }
                });

                if (cardNumberInput.value.replace(/\D/g, '').length < 16) {
                    showError(cardNumberInput, 'Número do cartão inválido.');
                    isValid = false;
                }
                if (!/^\d{2}\/\d{2}$/.test(cardExpiryInput.value)) {
                    showError(cardExpiryInput, 'Formato de validade inválido (MM/AA).');
                    isValid = false;
                } else {
                    const [month, year] = cardExpiryInput.value.split('/').map(Number);
                    const currentYear = new Date().getFullYear() % 100; // Last two digits
                    const currentMonth = new Date().getMonth() + 1; // 1-12
                        showError(cardExpiryInput, 'Cartão expirado ou validade inválida.');
                        isValid = false;
                    }
                }
                if (cardCvvInput.value.replace(/\D/g, '').length < 3) {
                    showError(cardCvvInput, 'CVV inválido.');
                    isValid = false;
                }
            }

            return isValid;
        }

        // --- Payment Processing Functions ---

        async function processPixPayment(pedidoId, emailComprador, valor) {
            try {
                const response = await fetch(PIX_EDGE_FUNCTION_URL, {
                    method: 'POST',<br/>
                    headers: {<br/>
                        'Content-Type': 'application/json',<br/>
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}` // Or a service role key if function requires it
                    },
                    body: JSON.stringify({<br/>
                        pedidoId: pedidoId,<br/>
                        email: emailComprador,<br/>
                        valor: valor,<br/>
                        description: 'Compra do livro Somos Todos Um'
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao criar pagamento PIX.');
                }

                return {
                    success: true,<br/>
                    paymentId: data.paymentId,<br/>
                    qrCode: data.qrCode,<br/>
                    qrCodeBase64: data.qrCodeBase64,<br/>
                    pixCode: data.pixCode,<br/>
                    message: 'Pagamento PIX criado com sucesso.'
                };
            } catch (error) {
                console.error('Erro na Edge Function PIX:', error);<br/>
                return { success: false, message: error.message };
            }
        }

        async function processCardPayment(pedidoId, emailComprador, valor) {
            try {
                const response = await fetch(CARD_EDGE_FUNCTION_URL, {
                    method: 'POST',<br/>
                    headers: {<br/>
                        'Content-Type': 'application/json',<br/>
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}` // Or a service role key
                    },
                    body: JSON.stringify({<br/>
                        pedidoId: pedidoId,<br/>
                        email: emailComprador,<br/>
                        valor: valor,<br/>
                        description: 'Compra do livro Somos Todos Um',<br/>
                        cardNumber: cardNumberInput.value.replace(/\D/g, ''),<br/>
                        cardName: cardNameInput.value,<br/>
                        cardExpiry: cardExpiryInput.value,<br/>
                        cardCvv: cardCvvInput.value,<br/>
                        installments: parseInt(installmentsSelect.value.split('x')[0]),
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao processar pagamento com cartão.');
                }

                return {
                    success: true,<br/>
                    status: data.status, // e.g., 'approved', 'pending', 'rejected'<br/>
                    paymentId: data.paymentId,<br/>
                    message: data.message || 'Pagamento com cartão processado.'
                };
            } catch (error) {
                console.error('Erro na Edge Function Cartão:', error);<br/>
                return { success: false, message: error.message };
            }
        }

        // Initial setup for payment method display
        document.addEventListener('DOMContentLoaded', () => {
            const initialMethod = document.querySelector('input[name="paymentMethod"]:checked');
            if (initialMethod) {
                document.getElementById(`method-${initialMethod.value}`).classList.add('selected');
                if (initialMethod.value === 'pix') {
                    pixDetails.style.display = 'block';
                } else {
                    cardDetails.style.display = 'block';
                }
            }
        });

    </script>
