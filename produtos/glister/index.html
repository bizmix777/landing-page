<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glister Multi-Action | Dentes Brancos em 21 Dias</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    :root { --primary: #00A0DC; --primary-dark: #0081B3; }
    .btn-primary, .btn-block { 
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%) !important;
      color: #FFFFFF !important; /* Letras Brancas */
      border: none !important;
      font-weight: bold;
      cursor: pointer;
      padding: 12px;
      border-radius: 8px;
    }
    .text-primary { color: var(--primary); font-weight: 800; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .modal-content { max-height: 90vh; overflow-y: auto; padding: 25px; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container navbar-container">
      <img src="/images/logo-bizmix-preto.png" alt="BizMix" style="height: 40px;">
      <a href="#comprar" class="btn-primary" style="padding: 10px 20px; text-decoration: none;">Comprar Agora</a>
    </div>
  </header>

  <main>
    <section class="hero" style="padding: 60px 20px; text-align: center;">
      <h1>Dentes <span class="text-primary">3 Tons Mais Brancos</span></h1>
      <p>Tecnologia SYLODENT™: Branqueamento sem sensibilidade.</p>
      <a href="#comprar" class="btn-primary" style="padding: 15px 30px; text-decoration: none; display: inline-block; margin-top: 20px;">Quero Meu Glister</a>
    </section>

    <section id="comprar" style="padding: 60px 0; background: #f4f4f4; text-align: center;">
      <div class="container" style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;">
        <div style="background: white; padding: 30px; border-radius: 15px; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
          <h3>Cliente VIP</h3>
          <p>Descontos exclusivos.</p>
          <button id="btn-opcao-cliente" class="btn-primary btn-block">QUERO SER CLIENTE VIP</button>
        </div>
        <div style="background: var(--primary); color: white; padding: 30px; border-radius: 15px; width: 300px;">
          <h3 style="color: white;">Empreendedor</h3>
          <p>Revenda e lucre.</p>
          <button id="btn-opcao-empreendedor" style="background: white; color: var(--primary); border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer;">QUERO SER EMPREENDEDOR</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="cadastroModalCliente">
    <div class="modal-content">
      <button class="modal-close-cliente" style="float: right;">X</button>
      <h3>Cadastro Cliente VIP</h3>
      <form id="cadastroFormCliente">
        <div class="form-group"><label>Nome Completo</label><input type="text" id="nomeCliente" class="form-control" required></div>
        <div class="form-group"><label>CPF</label><input type="text" id="cpfCliente" class="form-control" required></div>
        <div class="form-group"><label>WhatsApp</label><input type="tel" id="celularCliente" class="form-control" required></div>
        <div class="form-group"><label>E-mail</label><input type="email" id="emailCliente" class="form-control" required></div>
        <div class="form-group"><label>CEP</label><input type="text" id="cepCliente" class="form-control" required></div>
        <div class="form-group"><label>Rua</label><input type="text" id="ruaCliente" class="form-control"></div>
        <div id="formMessageCliente" class="form-message hidden"></div>
        <button type="submit" id="btnSubmitCliente" class="btn-primary btn-block">FINALIZAR E ENVIAR</button>
      </form>
    </div>
  </div>

  <div class="modal" id="cadastroModalEmpreendedor">
    <div class="modal-content">
      <button class="modal-close-empreendedor" style="float: right;">X</button>
      <h3>Cadastro Empreendedor Amway</h3>
      <form id="cadastroFormEmpreendedor">
        <div class="form-group"><label>Nome Completo</label><input type="text" id="nomeEmp" class="form-control" required></div>
        <div class="form-group"><label>CPF</label><input type="text" id="cpfEmp" class="form-control" required></div>
        <div style="display: flex; gap: 5px;" class="form-group">
          <input type="text" id="diaEmp" placeholder="DD" maxlength="2" style="width: 50px;" class="form-control">
          <input type="text" id="mesEmp" placeholder="MM" maxlength="2" style="width: 50px;" class="form-control">
          <input type="text" id="anoEmp" placeholder="AAAA" maxlength="4" style="width: 80px;" class="form-control">
        </div>
        <div class="form-group"><label>E-mail</label><input type="email" id="emailEmp" class="form-control" required></div>
        <div class="form-group"><label>WhatsApp</label><input type="tel" id="celularEmp" class="form-control" required></div>
        <div class="form-group">
            <label>Kit Inicial</label>
            <select id="tipoKitEmp" class="form-control">
                <option value="virtual">Kit Virtual - R$ 197,00</option>
                <option value="irresistivel">Kit Irresistível</option>
            </select>
        </div>
        <div class="form-group"><label>CEP</label><input type="text" id="cepEmp" class="form-control" required></div>
        <div class="form-group"><label>Rua e Nº</label><input type="text" id="ruaEmp" class="form-control" placeholder="Rua, número e bairro"></div>
        <div id="formMessageEmpreendedor" class="form-message hidden"></div>
        <button type="submit" id="btnSubmitEmpreendedor" class="btn-primary btn-block">FINALIZAR E ENVIAR</button>
      </form>
    </div>
  </div>

  <script src="./js/script.js"></script>
</body>
</html>
