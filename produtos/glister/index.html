<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glister Multi-Action | Amway</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* Trava de segurança: garante que os modais comecem escondidos */
        .modal-overlay { display: none !important; }
        .modal-overlay.active { display: flex !important; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <h2>Glister™</h2>
            <a href="#comprar" class="btn btn-primary">Comprar Agora</a>
        </div>
    </header>

    <section class="hero section">
        <div class="container">
            <h1>Dentes mais brancos em 21 dias</h1>
            <p>O melhor creme dental do mundo, agora ao seu alcance.</p>
            <a href="#comprar" class="btn btn-primary btn-xlarge">QUERO AGORA</a>
        </div>
    </section>

    <section id="comprar" class="section">
        <div class="container">
            <div class="pricing-grid" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                
                <div class="pricing-card" style="border: 1px solid #ddd; padding: 20px; border-radius: 10px; width: 300px; text-align: center;">
                    <h3>Cliente VIP</h3>
                    <p>30% de Desconto</p>
                    <button id="btn-opcao-cliente" class="btn btn-primary btn-block">QUERO DESCONTO</button>
                </div>

                <div class="pricing-card" style="border: 1px solid #ddd; padding: 20px; border-radius: 10px; width: 300px; text-align: center;">
                    <h3>Empreendedor</h3>
                    <p>Lucro na Revenda</p>
                    <button id="btn-opcao-empreendedor" class="btn btn-outline btn-block">QUERO EMPREENDER</button>
                </div>

            </div>
        </div>
    </section>

    <div class="modal-overlay" id="cadastroModalCliente">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cadastro Cliente VIP</h3>
                <button class="modal-close-cliente modal-close">X</button>
            </div>
            <div class="modal-body">
                <form id="cadastroFormCliente">
                    <input type="text" id="nomeCliente" placeholder="Nome" class="form-control" required>
                    <input type="text" id="cpfCliente" placeholder="CPF" class="form-control" required>
                    <input type="date" id="dataNascimentoCliente" class="form-control" required>
                    <input type="tel" id="celularCliente" placeholder="WhatsApp" class="form-control" required>
                    <input type="email" id="emailCliente" placeholder="E-mail" class="form-control" required>
                    <input type="password" id="senhaCliente" placeholder="Senha" class="form-control" required>
                    <input type="text" id="cepCliente" placeholder="CEP" class="form-control" required>
                    <button type="button" id="btnBuscarCepCliente" class="btn btn-outline">Buscar CEP</button>
                    <input type="text" id="ruaCliente" placeholder="Rua" class="form-control" required>
                    <input type="text" id="numeroCliente" placeholder="Número" class="form-control" required>
                    <input type="text" id="bairroCliente" placeholder="Bairro" class="form-control" required>
                    <input type="text" id="cidadeCliente" placeholder="Cidade" class="form-control" required>
                    <input type="text" id="estadoCliente" placeholder="UF" class="form-control" maxlength="2" required>
                    
                    <div id="formMessageCliente" class="form-message hidden"></div>
                    <button type="submit" id="btnSubmitCliente" class="btn btn-primary">FINALIZAR CADASTRO</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="cadastroModalEmpreendedor">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cadastro Empreendedor</h3>
                <button class="modal-close-empreendedor modal-close">X</button>
            </div>
            <div class="modal-body">
                <form id="cadastroFormEmpreendedor">
                    <input type="text" id="nomeEmp" placeholder="Nome" class="form-control" required>
                    <input type="text" id="cpfEmp" placeholder="CPF" class="form-control" required>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="diaEmp" placeholder="DD" style="width: 30%">
                        <input type="number" id="mesEmp" placeholder="MM" style="width: 30%">
                        <input type="number" id="anoEmp" placeholder="AAAA" style="width: 40%">
                    </div>
                    <input type="tel" id="celularEmp" placeholder="WhatsApp" class="form-control" required>
                    <input type="email" id="emailEmp" placeholder="E-mail" class="form-control" required>
                    <input type="password" id="senhaEmp" placeholder="Senha" class="form-control" required>
                    
                    <div class="form-section">
                        <label><input type="radio" name="tipoKit" value="virtual" checked> Kit Virtual</label>
                        <label><input type="radio" name="tipoKit" value="irresistivel"> Kit Irresistível (R$ 220)</label>
                    </div>

                    <input type="text" id="cepEmp" placeholder="CEP" class="form-control" required>
                    <button type="button" id="btnBuscarCepEmp" class="btn btn-outline">Buscar CEP</button>
                    <input type="text" id="ruaEmp" placeholder="Rua" class="form-control" required>
                    <input type="text" id="numeroEmp" placeholder="Número" class="form-control" required>
                    <input type="text" id="bairroEmp" placeholder="Bairro" class="form-control" required>
                    <input type="text" id="cidadeEmp" placeholder="Cidade" class="form-control" required>
                    <input type="text" id="estadoEmpEnd" placeholder="UF" class="form-control" maxlength="2" required>

                    <div id="formMessageEmp" class="form-message hidden"></div>
                    <button type="submit" id="btnSubmitEmp" class="btn btn-primary">FINALIZAR CADASTRO</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/script.js"></script>
</body>
</html>
