<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1>Redirecionando...</h1>
        <p>Aguarde enquanto carregamos seu painel</p>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configuração Universal -->
    <script src="/js/supabase-config.js"></script>
    
    <script>
        console.log('🔄 Redirecionamento iniciado');
        const supabase = window.supabase;

        async function verificarERedirecionar() {
            try {
                // 1. Verifica Sessão
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session) {
                    window.location.href = '/painel-acesso/';
                    return;
                }

                const userId = session.user.id;

                // 2. Tenta achar na tabela PARCEIROS (onde o cadastro salva!)
                const { data: parceiro } = await supabase
                    .from('parceiros')
                    .select('tipo_parceiro, is_admin, status')
                    .eq('auth_user_id', userId)
                    .single();

                if (parceiro) {
                    // Se for ADMIN
                    if (parceiro.is_admin) {
                        window.location.href = '/admin/index.html';
                        return;
                    }
                    
                    // Se for PARCEIRO / IGREJA / EMPRESA
                    if (parceiro.status === 'ativo') {
                        window.location.href = '/somos-todos-um/parceiros/dashboard.html';
                        return;
                    } else {
                        alert("Sua conta está pendente de aprovação.");
                        await supabase.auth.signOut();
                        window.location.href = '/painel-acesso/';
                        return;
                    }
                }

                // 3. Se não achou em parceiros, tenta na tabela USUARIOS (Legado/Admins antigos)
                const { data: usuario } = await supabase
                    .from('usuarios')
                    .select('tipo')
                    .eq('email', session.user.email) // ou auth_user_id se tiver
                    .single();

                if (usuario && (usuario.tipo === 'admin' || usuario.tipo === 'super_admin')) {
                    window.location.href = '/admin/index.html';
                    return;
                }

                // Se não achou em lugar nenhum
                alert("Perfil não encontrado.");
                window.location.href = '/painel-acesso/';

            } catch (error) {
                console.error('❌ Erro:', error);
                window.location.href = '/painel-acesso/';
            }
        }

        verificarERedirecionar();
    </script>
</body>
</html>
